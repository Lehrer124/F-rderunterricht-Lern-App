<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchstabenhafen – Lese-Rechtschreib-Lotse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Andika:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
  :root{
    --harbor-dark:#0F3145;
    --harbor-mid:#1B6E7F;
    --sand:#FCF4E4;
    --sand-deep:#F4E6CB;
    --coral:#E2672E;
    --coral-dark:#C44F1D;
    --sun:#F4B93E;
    --foam:#4FA893;
    --ink:#173142;
    --line:#D8C9A8;
    --white:#FFFFFF;
    --radius-lg:22px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:'Andika', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    color:var(--harbor-dark);
    margin:0;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px;}
  @media (min-width:820px){
    #app{max-width:920px;}
    body{font-size:1.15rem;}
    .prompt-text{font-size:1.5rem;}
    .pic-target{font-size:5.6rem;}
    .pic-target .pic-img{width:5.6rem;height:5.6rem;}
    .task-instr{font-size:1.25rem;}
    .opt-btn, .pic-opt-btn{font-size:1.3rem;min-height:96px;}
    .btn{font-size:1.2rem;padding:16px 30px;}
    .station-icon{width:66px;height:66px;font-size:2rem;}
    .station-body h3{font-size:1.25rem;}
  }

  /* ---------- header / wave ---------- */
  .topbar{
    background:linear-gradient(180deg, var(--harbor-dark) 0%, var(--harbor-mid) 100%);
    color:var(--white);
    padding:18px 20px 40px;
    position:relative;
  }
  .topbar h1{color:var(--white);font-size:1.5rem;font-weight:700;}
  .topbar .sub{font-size:0.9rem;opacity:0.85;margin-top:2px;}
  .wave{
    position:absolute;left:0;right:0;bottom:-1px;height:26px;
    background:var(--sand);
    clip-path: polygon(0 60%, 5% 40%, 10% 60%, 15% 40%, 20% 60%, 25% 40%, 30% 60%, 35% 40%, 40% 60%, 45% 40%, 50% 60%, 55% 40%, 60% 60%, 65% 40%, 70% 60%, 75% 40%, 80% 60%, 85% 40%, 90% 60%, 95% 40%, 100% 60%, 100% 100%, 0 100%);
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .icon-btn{
    background:rgba(255,255,255,0.15);
    border:none;color:var(--white);
    border-radius:50%;
    width:42px;height:42px;
    font-size:1.1rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:rgba(255,255,255,0.3);}

  main{padding:0 20px;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    border:none;
    border-radius:999px;
    padding:14px 26px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--coral);color:var(--white);}
  .btn-primary:hover{background:var(--coral-dark);}
  .btn-ghost{background:var(--white);color:var(--harbor-dark);border:2px solid var(--line);}
  .btn-block{width:100%;justify-content:center;}

  /* ---------- start screen ---------- */
  .hero{text-align:center;padding:8px 4px 10px;}
  @keyframes lumiSail{ 0%{ transform:translateX(-40px); opacity:0; } 100%{ transform:translateX(0); opacity:1; } }
  .lumi-sail{ animation: lumiSail 0.6s ease-out; }
  .lighthouse{font-size:64px;line-height:1;margin-bottom:4px;}
  .hero p{font-size:1rem;line-height:1.5;color:var(--ink);opacity:0.85;margin-top:10px;}
  .card{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:20px;
    margin-top:18px;
    border:2px solid var(--line);
  }

  /* ---------- diagnostic / practice question ---------- */
  .progress-track{height:10px;background:var(--sand-deep);border-radius:999px;overflow:hidden;margin:14px 0 22px;}
  .progress-fill{height:100%;background:var(--foam);border-radius:999px;transition:width .3s ease;}
  .prompt-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:24px 20px;
    border:2px solid var(--line);
    text-align:center;
  }
  .domain-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--sand-deep);color:var(--harbor-dark);
    font-family:'Baloo 2';font-weight:700;font-size:0.85rem;
    padding:6px 14px;border-radius:999px;margin-bottom:14px;
  }
  .prompt-text{font-size:1.3rem;font-weight:600;line-height:1.4;color:var(--harbor-dark);margin:6px 0 4px;font-family:'Baloo 2';}
  .speak-btn{
    background:var(--sun);border:none;color:var(--harbor-dark);
    border-radius:50%;width:52px;height:52px;font-size:1.4rem;cursor:pointer;margin:10px auto 4px;
    display:flex;align-items:center;justify-content:center;
  }
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  .options.single{grid-template-columns:1fr;}
  .opt-btn{
    background:var(--sand);
    border:2px solid var(--line);
    border-radius:var(--radius-sm);
    padding:16px 10px;
    font-family:'Andika';
    font-weight:700;font-size:1.1rem;color:var(--ink);
    cursor:pointer;
  }
  .opt-btn:active{transform:scale(0.97);}
  .opt-btn.correct{background:var(--foam);border-color:var(--foam);color:var(--white);}
  .opt-btn.wrong{background:#F1A38B;border-color:var(--coral-dark);color:var(--white);}
  .opt-btn[disabled]{cursor:default;}

  .kb-display{min-height:58px;border:2px solid var(--line);border-radius:14px;background:#fff;font-family:'Baloo 2',sans-serif;font-weight:700;font-size:2rem;letter-spacing:.06em;color:var(--harbor-dark);display:flex;align-items:center;justify-content:center;padding:4px 12px;margin-top:16px;word-break:break-all;}
  .kb-ph{font-size:1.05rem;font-weight:500;letter-spacing:0;color:#8A9BA6;}
  .kb-caret{display:inline-block;width:2px;height:1.9rem;background:var(--coral);margin-left:2px;animation:kbblink 1s steps(1) infinite;}
  @keyframes kbblink{50%{opacity:0}}
  .kb-keys{margin-top:10px;display:flex;flex-direction:column;gap:6px;-webkit-user-select:none;user-select:none;touch-action:manipulation;}
  .kb-row{display:flex;gap:5px;justify-content:center;}
  .kb-key{flex:1 1 0;max-width:62px;min-height:54px;border:2px solid var(--line);border-radius:10px;background:#fff;font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:700;color:var(--harbor-dark);padding:0;cursor:pointer;}
  .kb-key:active{background:#D7EEF3;}
  .kb-key.kb-wide{flex:1.6 1 0;max-width:100px;font-size:1.2rem;} .kb-key.kb-space{flex:6 1 0;max-width:none;} .kb-key.kb-on{background:var(--coral);color:#fff;border-color:var(--coral);}
  .text-input-row{display:flex;gap:10px;margin-top:18px;}
  .text-input-row input{
    flex:1;font-size:1.2rem;padding:14px 16px;border-radius:var(--radius-sm);
    border:2px solid var(--line);font-family:'Andika';
  }
  .task-badge{font-size:1.9rem;margin-bottom:2px;}
  .task-instr{
    font-family:'Baloo 2';font-weight:700;font-size:1.05rem;color:var(--harbor-dark);
    line-height:1.3;margin-bottom:4px;
  }
  .pic-target{font-size:4.6rem;line-height:1;margin:2px 0 6px;}
  .pic-img{width:4.6rem;height:4.6rem;object-fit:contain;display:block;margin:0 auto;}
  .pic-opt-btn .pic-img{width:2.6rem;height:2.6rem;}
  .pic-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px;}
  .pic-options.two{grid-template-columns:1fr 1fr;}
  .pic-opt-btn{
    background:var(--sand);border:2px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 6px;font-size:1.8rem;line-height:1.15;cursor:pointer;
    display:flex;align-items:center;justify-content:center;min-height:80px;
    font-family:'Andika';font-weight:700;color:var(--ink);
    word-break:break-word;
  }
  .pic-opt-btn:active{transform:scale(0.96);}
  .pic-opt-btn.correct{background:var(--foam);border-color:var(--foam);color:var(--white);}
  .pic-opt-btn.wrong{background:#F1A38B;border-color:var(--coral-dark);color:var(--white);}
  .pic-opt-btn[disabled]{cursor:default;}
  .feedback-box{
    margin-top:18px;padding:14px 16px;border-radius:var(--radius-sm);
    font-size:0.95rem;line-height:1.45;text-align:left;
  }
  .feedback-good{background:#E4F4EF;border:2px solid var(--foam);color:#0F5240;}
  .feedback-tip{background:#FDEDE2;border:2px solid var(--coral);color:#7A3512;}

  /* ---------- harbor map ---------- */
  .map-wrap{margin-top:14px;}
  .station{
    display:flex;align-items:center;gap:14px;
    background:var(--white);border:2px solid var(--line);
    border-radius:var(--radius-lg);padding:14px 16px;margin-bottom:12px;
    cursor:pointer;
  }
  .station:active{transform:scale(0.99);}
  .station.locked{opacity:0.5;filter:grayscale(65%);}
  .station.mastered{border-color:var(--sun);border-width:3px;}
  .station.review{border-color:var(--foam);border-width:3px;}
  .lock-note{font-size:0.78rem;color:#8A7355;margin-top:6px;line-height:1.4;}
  .section-label{font-family:'Baloo 2';font-weight:700;font-size:0.85rem;color:#8A9BA8;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.03em;}
  .station-icon{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;
    flex-shrink:0;
  }
  .station-body{flex:1;}
  .station-body h3{font-size:1.05rem;}
  .station-body .sub{font-size:0.82rem;color:#5B7280;margin-top:1px;}
  .anchors{margin-top:6px;font-size:0.95rem;letter-spacing:2px;}
  .stars-badge{
    background:var(--sand-deep);border-radius:999px;padding:6px 10px;
    font-family:'Baloo 2';font-weight:700;font-size:0.85rem;color:var(--harbor-dark);
    display:flex;align-items:center;gap:4px;white-space:nowrap;
  }

  .teacher-panel table{width:100%;border-collapse:collapse;margin-top:10px;font-size:0.9rem;}
  .teacher-panel td,.teacher-panel th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .badge-level{
    display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:0.8rem;
    background:var(--sand-deep);color:var(--harbor-dark);
  }

  .footnote{font-size:0.78rem;color:#6B7F8C;line-height:1.5;margin-top:18px;text-align:center;padding:0 10px;}

  .overlay{
    position:fixed;inset:0;background:rgba(15,49,69,0.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:10;
  }
  .sheet{
    background:var(--sand);width:100%;max-width:640px;border-radius:24px 24px 0 0;
    padding:22px 20px 30px;max-height:85vh;overflow-y:auto;
  }
  .sheet-close{float:right;background:none;border:none;font-size:1.4rem;color:var(--harbor-dark);cursor:pointer;}
  /* ---- Hafenkarte: Dein Weg, Pokal-Regal, Hilfe ---- */
  .map-h{font-family:'Baloo 2',sans-serif;font-size:1.25rem;margin:14px 0 6px;color:var(--harbor-dark);}
  .map-h small{font-size:.8rem;color:#6B7F8C;font-family:'Andika',sans-serif;}
  .station-hint{font-size:.78rem;color:#4B6473;margin-top:4px;line-height:1.35;}
  .more-btn{display:block;margin:12px auto 4px;}
  .shelf{margin-top:20px;background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px 14px;}
  .shelf-head{display:flex;align-items:center;justify-content:space-between;}
  .shelf-head h3{margin:0;font-family:'Baloo 2',sans-serif;font-size:1.05rem;color:var(--harbor-dark);}
  .shelf-total{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:1.15rem;}
  .shelf-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .shelf-tile{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:92px;padding:8px 10px;border:3px solid var(--sun);border-radius:14px;background:#FFF8E1;font-family:'Andika',sans-serif;color:var(--ink);cursor:pointer;}
  .shelf-tile.known{border-color:var(--line);background:var(--sand);opacity:.9;}
  .shelf-tile:disabled{opacity:.5;cursor:default;}
  .shelf-tile .si{font-size:1.6rem;line-height:1;}
  .shelf-tile .sn{font-size:.78rem;font-weight:700;}
  .shelf-tile .sc{font-size:.74rem;color:#4B6473;}
  .shelf-empty{font-size:.85rem;color:#6B7F8C;padding:6px 2px;}
  .plus-star{color:#B07A00;white-space:nowrap;}
  .help-link{background:none;border:none;color:var(--harbor-mid);font-family:'Andika',sans-serif;font-weight:700;font-size:.85rem;text-decoration:underline;cursor:pointer;margin-left:6px;}
  .help-row{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:1rem;line-height:1.45;}
  .help-ic{font-size:2rem;line-height:1;}
  /* ---- Lesekai ---- */
  /* ---- Kreuze an (Seite) ---- */
  .ks-count{text-align:right;font-weight:700;color:#4B6473;margin-top:6px;}
  .ks-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px;}
  @media (max-width:640px){.ks-grid{grid-template-columns:1fr;}}
  .ks-item{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--line);border-radius:18px;padding:10px;}
  .ks-item.ok{border-color:#2E8B57;background:#E3F4EA;}
  .ks-item.no{border-color:var(--coral);background:#FDE9DD;}
  .ks-pic{flex:0 0 auto;width:84px;height:84px;border-radius:50%;background:var(--sand-deep);display:flex;align-items:center;justify-content:center;font-size:50px;line-height:1;}
  .ks-pic .pic-img{height:56px;width:auto;}
  .ks-opts{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
  .ks-opt{display:flex;align-items:center;gap:10px;min-height:54px;padding:6px 12px;border-radius:12px;border:3px solid var(--line);background:var(--sand);font-family:'Andika',sans-serif;font-size:1.35rem;font-weight:700;color:var(--ink);text-align:left;cursor:pointer;}
  .ks-box{flex:0 0 auto;width:28px;height:28px;border:3px solid var(--harbor-mid);border-radius:8px;background:#fff;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:1.1rem;}
  .ks-opt.sel{border-color:var(--harbor-mid);background:#E4F2F4;}
  .ks-opt.sel .ks-box{background:var(--harbor-mid);}
  .ks-opt.sel .ks-box::after{content:"✓";}
  .ks-opt.right{border-color:#2E8B57;background:#fff;}
  .ks-opt.right .ks-box{background:#2E8B57;border-color:#2E8B57;}
  .ks-opt.right .ks-box::after{content:"✓";}
  .ks-opt.wrong{border-color:var(--coral);background:#fff;}
  .ks-opt.wrong .ks-box{background:var(--coral);border-color:var(--coral);}
  .ks-opt.wrong .ks-box::after{content:"✗";}
  .ks-diff{color:var(--coral-dark);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;}
  .btn[disabled]{opacity:.5;cursor:default;}
  /* ---- Lernvideo-Knopf auf der Stationskachel ---- */
  .station-video{margin-top:8px;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:14px;border:2px solid var(--coral);background:#fff;color:var(--coral-dark);font-family:inherit;font-weight:700;font-size:.9rem;cursor:pointer;}
  /* ---- Erklärvideo Lotze Lumi ---- */
  .lumi-stage{position:relative;background:#0F3145;border-radius:20px;overflow:hidden;aspect-ratio:10/7;border:4px solid #F4B93E;margin-top:14px;}
  .lumi-stage{background:#4D9CCB;}
  .lumi-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;}
  .lumi-stage img.kb{animation:lumikb 16s ease-in-out forwards;}
  @keyframes lumikb{from{transform:scale(1)}to{transform:scale(1.06)}}
  .lumi-cap{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(15,49,69,.9);color:#fff;font-size:clamp(1.05rem,3.4vw,1.5rem);line-height:1.35;text-align:center;min-height:3.4em;display:flex;align-items:center;justify-content:center;font-weight:600;}
  .lumi-start{position:absolute;inset:0;background:rgba(15,49,69,.93);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;text-align:center;padding:16px;}
  .lumi-start p{margin:0;font-size:1.2rem;}
  .lumi-sum{position:absolute;inset:0;bottom:3.4em;background:linear-gradient(#DFF0F5,#FCF4E4);color:#173142;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;}
  .lumi-sum h2{margin:0;font-size:clamp(1.2rem,4.5vw,1.9rem);}
  .lumi-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:560px;}
  .lumi-tile{background:#fff;border:3px solid #cfe0e6;border-radius:16px;padding:8px;text-align:center;font-size:clamp(.85rem,2.8vw,1.15rem);opacity:.35;transition:.4s;}
  .lumi-tile.lit{opacity:1;border-color:#2E8B57;}
  .lumi-tile span{display:block;font-size:clamp(1.6rem,5.5vw,2.4rem);}
  .lumi-bar{height:10px;background:#d8c9a8;border-radius:6px;margin:12px 2px 6px;overflow:hidden;}
  .lumi-bar i{display:block;height:100%;width:0;background:#F4B93E;transition:width .4s;}
  .lumi-title{text-align:center;font-weight:700;color:var(--harbor-dark);min-height:1.4em;}
  .lumi-dots{display:flex;gap:8px;justify-content:center;margin:8px 0;}
  .lumi-dots b{width:14px;height:14px;border-radius:50%;background:#d8c9a8;cursor:pointer;}
  .lumi-dots b.on{background:#E2672E;}
  .lumi-ctrl{display:flex;gap:10px;justify-content:center;}
  .lumi-ctrl .btn{min-width:64px;min-height:56px;font-size:1.3rem;}
  .syl-0{color:#C44F1D;} .syl-1{color:#1B6E7F;}
  .gap-word{font-size:2.6rem;font-weight:800;letter-spacing:.06em;margin:2px 0 8px;line-height:1.2;}
  .gap-box{display:inline-block;width:1.1em;height:1.15em;border:3px dashed #8a7a55;border-radius:10px;vertical-align:-.22em;margin:0 .06em;background:#fff8e6;}
  .gap-fill{display:inline-block;padding:0 .12em;border-radius:10px;background:#d9f3dc;color:#1e7a34;}
  .m-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px;}
  .m-col{display:flex;flex-direction:column;gap:10px;}
  .m-btn{min-height:68px;border:3px solid var(--line);border-radius:14px;background:var(--sand);font-family:'Andika',sans-serif;font-weight:700;font-size:1.5rem;color:var(--ink);cursor:pointer;padding:6px 10px;}
  .m-pic{font-size:2.6rem;line-height:1;}
  .m-pic .pic-img{height:2.8rem;width:auto;}
  .m-sel{border-color:var(--harbor-mid);background:#E4F2F4;box-shadow:0 0 0 3px #1B6E7F55;}
  .m-done{border-color:#2E8B57;background:#E3F4EA;opacity:.85;}
  .m-wrong{border-color:var(--coral);background:#FDE9DD;animation:mshake .3s;}
  .sess-bar{position:relative;height:30px;margin:2px 0 6px;border-radius:15px;background:linear-gradient(#D7EEF3,#BFE0EA);overflow:hidden;}
  .sess-ship{position:absolute;top:1px;font-size:1.35rem;line-height:28px;transition:left 1s linear;}
  .sess-port{position:absolute;right:6px;top:2px;font-size:1.2rem;line-height:26px;opacity:.7;}
  .sess-hold{position:fixed;left:0;bottom:0;width:60px;height:60px;z-index:4;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;background:transparent;}
  @keyframes pz-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-22px)}}
  @keyframes pz-shake{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
  @keyframes pz-spread{0%,100%{transform:scaleX(.8)}50%{transform:scaleX(1.25)}}
  @keyframes pz-eyes{0%,100%{transform:translateX(-26px)}50%{transform:translateX(26px)}}
  @keyframes pz-neck{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
  @keyframes pz-feet{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
  @keyframes pz-br{0%,100%{transform:scale(.5)}50%{transform:scale(1.15)}}
  @keyframes pz-bar{from{width:0}to{width:100%}}

<body>
<div id="app"></div>
<div id="ttsNotice" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;background:#0F3145;color:#fff;padding:14px 16px;border-radius:14px;font-family:'Andika';font-size:0.88rem;line-height:1.4;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,0.25);">
  🔈 Auf diesem Gerät/in dieser Ansicht ist keine Sprachausgabe verfügbar. Öffne die Datei direkt im Browser der Vorschau (z. B. Chrome), dann sollte der Lautsprecher-Button funktionieren.
  <button onclick="document.getElementById('ttsNotice').style.display='none'" style="display:block;margin-top:8px;background:#E2672E;border:none;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;">Verstanden</button>
</div>

<script>
/* ============================================================
   DATENBASIS: Kompetenzbereiche & Aufgabenpools
   Grundlage: phonologische Bewusstheit, Graphem-Phonem-Korrespondenz,
   Lesegenauigkeit/-flüssigkeit, lautorientiertes & orthografisches
   Schreiben (Silben-, Morphem-, Regelstrategien; FRESCH-nahe Tipps:
   Schwingen / Verlängern / Ableiten / Merken)
   ============================================================ */

// Kurze, feste Erklärung je Aufgabentyp – wird angezeigt UND vorgelesen,
// ist aber nie Voraussetzung: die Aufgabe bleibt über Bilder lösbar.
const taskInstructions = {
  '🔁': 'Welches Bild reimt sich?',
  '👏': 'Wie viele Silben hat das Wort?',
  '🎯': 'Welches Bild beginnt mit dem gleichen Laut?',
  '🔡': 'Welchen Laut hörst du am Anfang des Wortes?',
  '🔚': 'Welchen Laut hörst du am Ende des Wortes?',
  '🔍': 'Welchen Laut hörst du in diesem Wort?',
  '🔤': 'Welches Wort ist richtig geschrieben, so wie du es hörst?',
  '🔠': 'Welcher Kleinbuchstabe klingt genauso wie dieser Großbuchstabe?',
};

// Vertiefung für leistungsstarke Kinder: bewusst NICHT Teil von `domains`,
// damit sie nie in der Hauptübersicht/Sperrlogik auftaucht. Freigeschaltet
// erst, wenn Lesefahrrinne sicher sitzt (gemeistert oder in Auffrischung).
const advancedDomains = [
  {id:'blitzlesen', name:'Blitzbucht', sub:'Wörter blitzschnell erkennen', icon:'⚡', color:'#E8A33D'},
  {id:'lesekompetenz', name:'Krähennest', sub:'Texte verstehen und einordnen', icon:'🔭', color:'#3D6E8A'},
];

function anyDomain(id){
  return domains.find(x=>x.id===id) || advancedDomains.find(x=>x.id===id);
}

function advancedUnlocked(){
  const lesenDomain = domains.find(x=>x.id==='lesen');
  const s = domainStatus(lesenDomain).status;
  return s==='mastered' || s==='review';
}

const domains = [
  {id:'phon', name:'Lauthafen', sub:'Reime, Silben & Laute hören', icon:'🌊', color:'#4FA893'},
  {id:'buchstabe', name:'Buchstabenbrücke', sub:'Laute Buchstaben zuordnen', icon:'🌉', color:'#1B6E7F'},
  {id:'silbendock', name:'Silbendock', sub:'Laute & Silben verschriften', icon:'🪢', color:'#6B8E6B'},
  {id:'lesen', name:'Lesefahrrinne', sub:'Genau & flüssig lesen', icon:'⛵', color:'#E2672E'},
  {id:'lesekai', name:'Lesekai', sub:'Wörter & Sätze lesen, ankreuzen, malen', icon:'📖', color:'#B5527A'},
  {id:'schreib1', name:'Schreibwerft', sub:'Wörter lauttreu schreiben', icon:'⚓', color:'#0F3145'},
  {id:'schreib2', name:'Werkzeugkiste', sub:'Rechtschreib-Strategien (Niko/FRESCH)', icon:'🧰', color:'#F4B93E'},
  {id:'grundwortschatz', name:'Speicherstadt', sub:'Hamburger Grundwortschatz üben', icon:'🧱', color:'#A34A3D'},
  {id:'satzbau', name:'Satzwerft', sub:'Ganze Sätze aus Bildern bauen & schreiben', icon:'🧩', color:'#2E6E8E'},
  {id:'diktat', name:'Flaschenpost', sub:'Sätze diktieren & auf Papier schreiben', icon:'📝', color:'#6E4A8E'},
];

// Entwicklungsstufen (angelehnt an die alphabetische → orthografische
// Strategie): Tier 1 baut auf gesicherter Tier-0-Leistung auf, Tier 2 auf
// gesicherter Tier-1-Leistung. So werden Kinder nicht mit Aufgaben
// konfrontiert, für die die Voraussetzungen fehlen.
const TIERS = {
  phon:0, buchstabe:0, silbendock:0,
  lesen:1, lesekai:1, schreib1:1,
  schreib2:2, grundwortschatz:2, satzbau:2,
  diktat:3,
};
// Flaschenpost und Satzwerft brauchen Papier bzw. freie Konstruktion - kein
// Teil der kurzen digitalen Einstiegsdiagnostik. Starten regulär bei Stufe 1,
// sobald sie über die normale Stufen-Freischaltung erreichbar werden.
const diagDomains = domains.filter(d => d.id !== 'diktat' && d.id !== 'satzbau' && d.id !== 'lesekai');
const MASTERY_STARS = 12; // ab so vielen Sternen bei Stufe 3 gilt ein Bereich als gefestigt

// ------------------------------------------------------------------
// Abhängigkeiten zwischen den Stationen (inhaltlich begründet).
// DEPS[Station][Stufe] = [[Voraussetzungs-Station, mindestens Stufe], ...]:
// Das wird gebraucht, um diese Stufe zu betreten. Die Bedingungen gelten
// kumulativ (Stufe 3 braucht auch alles von Stufe 1 und 2). Stufe 1 = Start der
// Station. Stufe "n" einer Voraussetzung heißt: ihre Stufen 1 bis n-1 sind
// durchlaufen. Es gibt keine Lehrkraft-Freigabe, die Kinder selbst nutzen könnten.
// ------------------------------------------------------------------
const DEPS = {
  // Aufschreiben setzt Buchstabenkenntnis (Laut -> Buchstabe) und Anlaut-Hören voraus
  silbendock:      {1:[['buchstabe',2],['phon',2]], 4:[['buchstabe',4]]},
  // Wörter lesen: Buchstabenbrücke Stufe 2 ("ganze Wörter mit ihren Buchstaben verbinden")
  lesen:           {1:[['buchstabe',3]], 3:[['buchstabe',4]]},
  // Lesekai: Wörter zum Bild; Silbenfarben brauchen Silbenbewusstheit; Sätze/Anweisungen brauchen Satzlesen
  lesekai:         {1:[['buchstabe',3]], 2:[['phon',2]], 3:[['lesen',2]], 4:[['lesen',3]]},
  // ganze Wörter schreiben: Laute heraushören (Silbendock bis Silben) + Buchstaben;
  // Konsonantenhäufungen (Stern, Schlange, Pfanne) erst nach Buchstabenbrücke Stufe 3
  schreib1:        {1:[['silbendock',3],['buchstabe',3]], 3:[['buchstabe',4],['silbendock',4]], 4:[['buchstabe',4]]},
  // Rechtschreibregeln bauen auf sicherem lautgetreuem Schreiben und Wörterlesen auf
  // Strategien erst, wenn lautgetreues Schreiben wirklich sicher ist (Schreibwerft bis Stufe 4 UND Pokal, siehe depsMissing)
  schreib2:        {1:[['schreib1',4],['silbendock',4],['lesen',3]], 3:[['schreib1',4]]},
  grundwortschatz: {1:[['schreib1',3],['lesen',2]], 3:[['schreib1',4]], 4:[['lesen',3]]},
  satzbau:         {1:[['schreib1',3],['lesen',2]], 3:[['schreib1',4]]},
  diktat:          {1:[['schreib2',2],['grundwortschatz',2],['satzbau',2]], 3:[['schreib2',3],['grundwortschatz',3]]},
};
function depsMissing(id, level){
  const tab = DEPS[id]; if(!tab) return [];
  const need = {};
  Object.keys(tab).map(Number).filter(L=>L<=level).forEach(L=>{
    tab[L].forEach(([sid,lv])=>{ need[sid] = Math.max(need[sid]||0, lv); });
  });
  const res = Object.keys(need)
    .filter(sid => (state.levels[sid]||1) < need[sid])
    .map(sid => ({d: domains.find(x=>x.id===sid), need: need[sid]}));
  // Werkzeugkiste: zusätzlich muss die Schreibwerft gemeistert sein (Pokal), nicht nur durchlaufen
  if(id==='schreib2' && !res.some(r=>r.d.id==='schreib1')){
    const s1 = domains.find(x=>x.id==='schreib1');
    const st = domainStatus(s1).status;
    if(st!=='mastered' && st!=='review') res.push({d:s1, need:4});
  }
  return res;
}
// Schon begonnen = es wurde wirklich geübt (nicht nur ein Diagnose-Startwert).
// Begonnene Stationen werden nie wieder gesperrt.
function stationStarted(id){
  const saved = state.attemptLogs[id];
  return (state.stars[id]||0)>0 || (state.errorCounts[id]||0)>0 || !!state.mastery[id]
      || !!(state.trophies && state.trophies[id]) || !!(saved && saved.log && saved.log.length);
}
// Wartet die Station auf eine Voraussetzung für die nächste Stufe?
function nextLevelBlocked(id){
  const lvl = state.levels[id]||1;
  return lvl<4 ? depsMissing(id, lvl+1) : [];
}
function domainStatus(d){
  const missing = depsMissing(d.id, 1);
  if(missing.length && !stationStarted(d.id)) return {status:'locked', missing};
  const lvl = state.levels[d.id]||1;
  const m = state.mastery[d.id];
  // Gemeistert: bereits vergebenes Mastery bleibt bestehen (Altbestand), neu
  // nur mit dem schärferen Kriterium (siehe masteryReliable).
  if((m && lvl>=3) || masteryReliable(d)){
    if(m && m.nextReviewAt && m.nextReviewAt <= todayStr()) return {status:'review'};
    return {status:'mastered'};
  }
  return {status:'active'};
}

// Verlässlich gemeistert: Stufe 3+, mind. 12 Sterne UND von den letzten 8
// Aufgaben auf dieser Stufe mindestens 7 richtig.
function masteryReliable(d){
  const lvl = state.levels[d.id]||1, st = state.stars[d.id]||0;
  if(lvl<3 || st<MASTERY_STARS) return false;
  const saved = state.attemptLogs[d.id];
  if(!saved || saved.level!==lvl) return false;
  const last8 = (saved.log||[]).slice(-8);
  return last8.length>=8 && last8.filter(Boolean).length>=7;
}

// Altbestand (Daten ohne stationsVersion): Wer nach der alten Regel (Stufe 3 +
// 12 Sterne) bereits gemeistert hatte, behält Pokal und Auffrischungs-Termin.
function migrateStationsV1(){
  state.trophies = state.trophies || {};
  const t = todayStr();
  domains.forEach(d=>{
    const lvl = state.levels[d.id]||1, st = state.stars[d.id]||0;
    if(lvl>=3 && st>=MASTERY_STARS && !state.mastery[d.id]) state.mastery[d.id] = {nextReviewAt: addDays(t,14)};
    if(state.mastery[d.id] && !state.trophies[d.id]) state.trophies[d.id] = t;
  });
  state.stationsVersion = 2;
}

// Buchstabenbrücke wurde umgebaut (alt: 1 Laute, 2 ganze Wörter, 3 Verwechslungen, 4 Häufungen;
// neu: 1 Laute, 2 Lückenwörter, 3 ganze Wörter, 4 Verwechslungen + Häufungen).
// Alte Stufe 1 -> 1 (Lückenwörter kommen neu dazu), 2 -> 3 (ganze Wörter wurden schon geübt;
// der alte Versuchsverlauf entfällt, damit kein Pokal ohne neue Übung entsteht), 3 und 4 -> 4.
function migrateStationsV3(){
  const old = state.levels.buchstabe;
  if(old){
    const map = {1:1, 2:3, 3:4, 4:4};
    const nw = map[old] || old;
    state.levels.buchstabe = nw;
    const al = state.attemptLogs && state.attemptLogs.buchstabe;
    if(al){
      if(old===2) delete state.attemptLogs.buchstabe;
      else al.level = map[al.level] || al.level;
    }
    if(state.mastery && state.mastery.buchstabe && nw<3) delete state.mastery.buchstabe;
  }
  state.stationsVersion = 3;
}

// Verlaufsdaten (Wochenstände, Diagnosen) aus der Zeit vor dem Umbau der Buchstabenbrücke
// auf das neue Stufenschema umrechnen, damit Lernzuwächse nicht verfälscht werden.
function fixHistoryV3(onlyBefore){
  const map = {1:1, 2:3, 3:4, 4:4};
  (state.history||[]).forEach(h=>{
    if(h.sv || !h.levels) return;
    if(!(onlyBefore && h.date >= onlyBefore) && h.levels.buchstabe) h.levels.buchstabe = map[h.levels.buchstabe] || h.levels.buchstabe;
    h.sv = 3;
  });
  (state.diagReports||[]).forEach(r=>{
    if(r.sv) return;
    const b = r.results && r.results.buchstabe;
    if(!(onlyBefore && r.date >= onlyBefore) && b && b.level) b.level = map[b.level] || b.level;
    r.sv = 3;
  });
}

// Ein einmal verdienter Pokal bleibt für immer im Pokal-Regal.
function ensureTrophies(){
  state.trophies = state.trophies || {};
  let changed = false;
  domains.forEach(d=>{
    const s = domainStatus(d).status;
    if((s==='mastered' || s==='review') && !state.trophies[d.id]){ state.trophies[d.id] = todayStr(); changed = true; }
  });
  if(changed) saveProgress();
}

// Silbenbögen wie im Unterricht: ein Bogen pro Silbe, statt abstrakter Punkte.
function silbenbogen(n){
  const w = n*34;
  let arcs = '';
  for(let i=0;i<n;i++){
    const cx = 17 + i*34;
    arcs += `<path d="M ${cx-14} 5 Q ${cx} 23 ${cx+14} 5" stroke="#173142" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 ${w} 26" width="${w}" height="30" style="display:block;margin:0 auto;">${arcs}</svg>`;
}

// Wie silbenbogen(), aber für eine einzelne Silbe mit frei wählbarer Breite -
// wird in Satzwerft unter jede Buchstabengruppe einer Silbe gesetzt.
function syllableArcSpan(width){
  const cx = width/2;
  return `<svg viewBox="0 0 ${width} 24" width="${width}" height="20" style="display:block;">
    <path d="M 4 4 Q ${cx} 21 ${width-4} 4" stroke="#173142" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}

// Kein Standard-Emoji zeigt "einen Tisch" als Möbelstück - deshalb eine
// eigene, einfache Strichzeichnung (tableIcon). Für "Gabel" gibt es
// mittlerweile überall ein einheitliches eigenes Foto (gabel.png, siehe
// renderPicVal weiter unten) statt der früheren Strichzeichnung oder eines
// mehrdeutigen Emojis (🍴 zeigt immer Gabel+Messer zusammen).
function forkIcon(size){
  size = size || 44;
  return `<svg viewBox="0 0 40 60" width="${size}" height="${Math.round(size*1.3)}" style="display:inline-block;vertical-align:middle;">
    <rect x="17" y="24" width="6" height="34" rx="2" fill="#5A6B7A"/>
    <rect x="8" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="14" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="20" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="26" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <path d="M8 22 Q8 30 20 30 Q32 30 32 22" fill="none" stroke="#5A6B7A" stroke-width="4"/>
  </svg>`;
}
function tableIcon(size){
  size = size || 44;
  return `<svg viewBox="0 0 60 50" width="${size}" height="${Math.round(size*0.83)}" style="display:inline-block;vertical-align:middle;">
    <rect x="4" y="8" width="52" height="8" rx="2" fill="#8B5A2B"/>
    <rect x="8" y="16" width="6" height="28" fill="#8B5A2B"/>
    <rect x="46" y="16" width="6" height="28" fill="#8B5A2B"/>
  </svg>`;
}

// Kindgerechte Lernziel-Erklärung je Bereich und Stufe – wird vor jeder
// Übungssitzung gezeigt, damit klar ist, warum gerade das geübt wird.
// "Ich kann..."-Aussagen für die echte Selbsteinschätzung nach der Sitzung -
// bezogen auf den konkreten Lerngegenstand, nicht auf "hat es gefallen".
const iCanStatements = {
  phon: {
    1:'Ich kann hören, ob sich zwei Wörter reimen, wie viele Silben ein Wort hat und wie es anfängt.',
    2:'Ich kann auch bei kniffligeren Wörtern Reime, Silben und Anfangslaute erkennen.',
    3:'Ich kann schwierige Reime und Anlaute ganz genau heraushören.',
    4:'Ich kann auch bei mehrsilbigen Wörtern und ähnlichen Anlauten wie „Bl" und „Br" genau hinhören.',
  },
  buchstabe: {
    1:'Ich kann hören, mit welchem Buchstaben ein Wort beginnt oder endet.',
    2:'Ich kann einen fehlenden Buchstaben am Anfang, am Ende und in der Mitte eines Wortes finden.',
    3:'Ich kann das passende geschriebene Wort zu einem Bild finden.',
    4:'Ich kann Buchstaben unterscheiden, die leicht verwechselt werden (b, d, p), und besondere Laute und Konsonantenhäufungen (Qu, Pf, St, Str) richtig zuordnen.',
  },
  silbendock: {

// vergeben, wo eine Rechtschreibregel tatsächlich greift (Leuchtturm,
// Speicherstadt), nicht künstlich für Bereiche wie Blitzlesen.
const ERROR_CATEGORIES = {

function ch(prompt, options, answerIdx, tip, speakText, errorCategory){
  // Lückensätze: "___" nie mitlesen (verunsichert Kinder) - stattdessen
  // eine kurze Sprechpause an der Lückenstelle.
  return {type:'choice', prompt, options, answer:answerIdx, tip, speak:speakText||prompt.replace(/_+/g,'…'), errorCategory};
}
function inp(prompt, answer, tip, speakText, pictureEmoji, cutMs){
  return {type:'input', prompt, answer, tip, speak:speakText||prompt, pictureEmoji, cutMs};
}

// Wie inp(), aber zum Antippen statt Eintippen - für die Silbendock-Diagnostik,
// damit ein Kind nicht an der Tastatureingabe scheitert, wenn es den Laut/die
// Silbe eigentlich richtig erkannt hat. Ein Silbenbogen wird nur unter echten
// Silben-Optionen gezeigt (mehr als ein Buchstabe), nicht unter einzelnen
// Lauten - ein Bogen unter "f" allein ergibt keinen Sinn.
function silbchoice(prompt, options, answerIdx, tip, speakText, pictureEmoji){
  return {type:'silbchoice', prompt, options, answer:answerIdx, tip, speak:speakText, pictureEmoji};
}
// Bildbasierte Aufgabe: kein Lesen von Wörtern nötig, um die Aufgabe zu
// verstehen. taskIcon zeigt den Aufgabentyp, targetEmoji das Zielwort als
// Bild, options sind große Symbole/Buchstaben/Wörter zum Antippen.
function pic(taskIcon, targetEmoji, targetWord, options, answerIdx, tip, niko, audioKey, seq){
  const o = {type:'pic', taskIcon, targetEmoji, options, answer:answerIdx, tip, speak:targetWord, niko:!!niko, audioKey};
  if(seq) o.seq = seq;
  return o;
}
// Papier-Schreibaufgabe: Das Kind hört das Wort, schreibt es mit der Hand auf sein Blatt
// und vergleicht danach Buchstabe für Buchstabe mit der richtigen Schreibung
// ("|" trennt Silben und färbt sie ein). Ohne Handschrift gibt es keinen Transfer vom
// Antippen zum Schreiben.
function papier(word, pictureEmoji, tip){
  return {type:'papier', word, pictureEmoji, tip, speak:word.replace(/\|/g,'')};
}
// Lückenwort: Bild + Wort mit einer Lücke ("_a|se"; | trennt Silben, _ = fehlender Buchstabe).
// seq ordnet die Aufgaben (1 Anfang, 2 Ende, 3 Mitte): die Übungsreihe wechselt
// in kleinen Runden durch alle Gruppen, so ist jedes Sechserfenster gemischt.
function gap(taskIcon, targetEmoji, targetWord, gapPattern, options, answerIdx, tip, seq){
  const o = pic(taskIcon, targetEmoji, targetWord, options, answerIdx, tip, false, null, seq);
  o.gap = gapPattern;
  return o;
}
function gapHtml(item, fillIdx){
  if(!item || !item.gap) return '';
  const fill = (fillIdx===null || fillIdx===undefined) ? null : item.options[fillIdx];
  const parts = item.gap.split('|').map((seg,i)=>{
    const inner = seg.split('').map(c=> c==='_'
      ? (fill!==null ? `<span class="gap-fill">${fill}</span>` : '<span class="gap-box"></span>')
      : c).join('');
    return `<span class="syl syl-${i%2}">${inner}</span>`;
  }).join('');
  return `<div class="gap-word">${parts}</div>`;
}

// Blitzlesen: Wort erscheint, ein sichtbarer Countdown läuft, das passende
// Bild muss angetippt werden, bevor die Zeit abläuft.
function flash(word, options, answerIdx, tip){
  return {type:'flash', word, options, answer:answerIdx, tip, speak:word};
}

// Rendert ein Bild-Feld (targetEmoji/pictureEmoji/pic-Option): normalerweise
// ein einzelnes Emoji-Zeichen, aber wenn der Wert mit "img:" beginnt, wird
// stattdessen ein eigenes Bild angezeigt (Datei liegt flach neben der
// HTML-Datei, kein Unterordner - genau wie die .m4a-Lautdateien) -
// eingebunden für Wörter, deren Emoji-Darstellung nicht eindeutig genug war
// (z. B. Arm, Gabel, Lampe, Rasen, Segel, Strumpf, Traum, Überraschungsei).
// GitHub unterscheidet Groß-/Kleinschreibung bei Dateinamen: Fehlt "Traum.png",
// wird automatisch "traum.png" (und ohne Umlaut-Schreibweise "Ueberraschungsei") versucht.
function picImgFallback(img){
  const n = parseInt(img.dataset.try||'0',10);
  const src = img.getAttribute('src')||'';
  const file = src.split('/').pop();
  const tries = [file.toLowerCase(), file.charAt(0).toUpperCase()+file.slice(1).toLowerCase()];
  if(n>=tries.length) return;
  img.dataset.try = String(n+1);
  if(tries[n]!==file) img.setAttribute('src', tries[n]); else picImgFallback(img);
}
function renderPicVal(val){
  if(typeof val==='string' && val.indexOf('img:')===0){
    const src = val.slice(4);
    return `<img src="${src}" alt="" class="pic-img" draggable="false" ondragstart="return false;" onerror="picImgFallback(this)">`;
  }
  return val;
}

// Zustand je Strategie: {ok, n, seen, card}
function fr(k){
  state.fresch = state.fresch || {};

}
function frKings(list){ return list.length>1 ? list.slice(0,-1).join(', ')+' und '+list[list.length-1] : list[0]; }

// Konstruktoren der Strategie-Aufgaben
function T(strat, seq, item, cat, noDisc){

}
// Könige (bzw. Wörter) antippen: units = Buchstabeneinheiten, correct = Indizes der richtigen Einheiten
function mk(strat, seq, prompt, units, correct, tip, word, cat){
  return {type:'mark', strat, seq, prompt, units, correct, tip, speak:prompt+' '+word, word, errorCategory:cat};
}
// Könige im Wort: units aus Buchstaben (au, ei, ie, sch, ch zählen als eine Einheit), Silben nur für den Tipp
function mkKing(word, units, kings, syl){
  const names = kings.map(i=>units[i]);
  return mk('schwingen', 1, 'Tippe alle Könige im Wort an: '+word, units, kings,
    syl+': Jede Silbe hat einen König. '+(names.length>1 ? 'Hier sind es ' : 'Hier ist es ')+frKings(names)+'.', word, 'koenig');
}

window.stratMerk = function(){
  const p = state.practice, it = p && p.current;
  if(!it || !it.strat) return;
  p.merkOpen = !p.merkOpen;
  if(p.merkOpen) speak(FRESCH[it.strat].merk);
  render(true);

function renderMark(item, isStatic){
  const p = state.practice, sel = p.markSel || [];
  const need = {}; item.correct.forEach(i=>need[i]=true);
  const btns = item.units.map((u,i)=>{
    let cls = 'mk-u' + (item.unitKind==='word' ? ' mk-word' : '');
    if(isStatic){
      if(sel[i] && need[i]) cls += ' ok';
      else if(sel[i] && !need[i]) cls += ' bad';
      else if(!sel[i] && need[i]) cls += ' miss';
      return `<span class="${cls}">${u}</span>`;
    }
    if(sel[i]) cls += ' on';
    return `<button class="${cls}" onclick="markToggle(${i})">${u}</button>`;
  }).join('');
  return `
    <div class="prompt-text">${item.prompt}</div>
    <button class="speak-btn" onclick="speakCurrent()">🔊</button>
    <div class="mk-row">${btns}</div>
    ${isStatic ? `<p class="mk-legend"><span class="mk-u ok">✓</span> richtig <span class="mk-u miss">!</span> hat gefehlt <span class="mk-u bad">✗</span> zu viel</p>`
               : `<button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="markSubmit()">✅ Fertig</button>`}`;
}
window.markToggle = function(i){
  const p = state.practice; if(!p || p.answered || !p.markSel) return;
  p.markSel[i] = !p.markSel[i];
  render(true);
};
window.markSubmit = function(){
  const p = state.practice, it = p.current; if(!it || p.answered) return;
  const need = {}; it.correct.forEach(i=>need[i]=true);
  const sel = p.markSel || [];
  let ok = true;
  it.units.forEach((u,i)=>{ if(!!sel[i] !== !!need[i]) ok = false; });
  window.practiceAnswer(ok ? 0 : 1);
};

// Handgeprüfte Silbentrennung für alle Wörter, die in den Satzwerft-Körben
// vorkommen - bewusst nicht automatisch erraten (Silbentrennung im
// Deutschen hat zu viele Ausnahmen für eine zuverlässige Faustregel).
// Wörter ohne Eintrag gelten als einsilbig (ein Bogen über das ganze Wort).
const wordSyllables = {
  der:['der'], die:['die'], das:['das'], im:['im'], in:['in'], zu:['zu'], am:['am'],
  junge:['Jun','ge'], mädchen:['Mäd','chen'], hund:['Hund'], katze:['Kat','ze'],
  oma:['O','ma'], opa:['O','pa'], papa:['Pa','pa'],
  lacht:['lacht'], rennt:['rennt'], schläft:['schläft'], singt:['singt'],
  isst:['isst'], liest:['liest'], spielt:['spielt'], malt:['malt'],
  spaziert:['spa','ziert'], baut:['baut'], backt:['backt'],
  fröhlich:['fröh','lich'], geduldig:['ge','dul','dig'], aufgeregt:['auf','ge','regt'],
  glücklich:['glück','lich'], ruhig:['ru','hig'], stolz:['stolz'],
  garten:['Gar','ten'], schule:['Schu','le'], hause:['Hau','se'],
  bett:['Bett'], park:['Park'], zimmer:['Zim','mer'], küche:['Kü','che'], auto:['Au','to'],
};
function syllablesFor(word){
  const clean = word.replace(/[.,!?]/g,'');
  return wordSyllables[clean.toLowerCase()] || [clean];
}
function isVowel(letter){
  return 'aeiouäöüAEIOUÄÖÜ'.includes(letter);
}

// Zerlegt ein Wort in seine tatsächlichen Lautbausteine, passend zu den
// aufgenommenen Dateien (SCH.m4a, CH1.m4a, AU.m4a, einzelne Buchstaben...).
// Nur Verbindungen, für die wir eine echte Aufnahme haben, werden als ein
// Baustein erkannt - alles andere zerfällt automatisch in Einzelbuchstaben
// (für die wir durchgehend Aufnahmen haben), nie in eine geratene TTS-Lesung.
function tokenizeSyllable(syl, prevChar, isLastSyllable){
  const lower = syl.toLowerCase();
  const tokens = [];
  let i = 0;
  while(i < lower.length){
    const rest = lower.slice(i);
    let len = 1, key = null;
    if(rest.startsWith('sch')){ len=3; key='SCH'; }
    else if(rest.startsWith('ch')){
      // Ach-Laut (CH1) nach a/o/u, sonst Ich-Laut (CH2). Bei Silbenanfang
      // zählt der letzte Buchstabe der VORHERIGEN Silbe (z.B. "Bau-ch").
      const prev = i>0 ? lower[i-1] : (prevChar||'');
      len=2; key = ['a','o','u'].includes(prev) ? 'CH1' : 'CH2';
    }
    else if(rest.startsWith('sp')){ len=2; key='SP'; }
    else if(rest.startsWith('pf')){ len=2; key='PF'; }
    else if(rest.startsWith('ck')){ len=2; key='CK'; }
    else if(rest.startsWith('tz')){ len=2; key='TZ'; }
    else if(rest.startsWith('qu')){ len=2; key='QU'; }
    else if(rest.startsWith('ng')){ len=2; key='NG'; }
    else if(rest.startsWith('äu')){ len=2; key='AEU'; }
    else if(rest.startsWith('eu')){ len=2; key='EU'; }
    else if(rest.startsWith('au')){ len=2; key='AU'; }
    else if(rest.startsWith('ei')){ len=2; key='EI'; }
    else if(rest.startsWith('ie')){ len=2; key='IE'; }
    else if(rest[0]==='ä'){ len=1; key='AE'; }
    else if(rest[0]==='ö'){ len=1; key='OE'; }
    else if(rest[0]==='ü'){ len=1; key='UE'; }
    else if(rest[0]==='y'){
      // y als Konsonant am Wortanfang (wie Yak) vs. als Vokal am echten Wortende (wie Teddy)
      len=1; key = (isLastSyllable && i === lower.length-1) ? 'Y1' : 'Y';
    }
    else if(rest[0]==='e' && isLastSyllable && i === lower.length-1){
      len=1; key='-E'; // unbetontes Endungs-e am ECHTEN Wortende, z.B. Blume - nicht bei einer Mittelsilbe wie "ge" in "auf-ge-regt"
    }
    else if(/[a-zß]/.test(rest[0])){
      len=1; key = rest[0].toUpperCase();
    }
    else {
      len=1; key=null;
    }
    tokens.push({text: syl.slice(i, i+len), key});
    i += len;
  }
  return tokens;
}

// Zerlegt ein Wort in Lautbausteine - Silbe für Silbe getrennt (anhand der
// handgeprüften Silbentrennung), damit z.B. bei "Jun-ge" kein "ng" über die
// Silbengrenze hinweg fälschlich erkannt wird. Rückgabe: eine Liste von
// Silben, jede als Liste ihrer Lautbausteine.
function tokenizeWordToSounds(word){
  const clean = (word||'').replace(/[.,!?]/g,'');
  const syls = syllablesFor(clean);
  const groups = [];
  let prevChar = '';
  syls.forEach((syl,idx)=>{
    groups.push(tokenizeSyllable(syl, prevChar, idx === syls.length-1));
    const lowerSyl = syl.toLowerCase();
    prevChar = lowerSyl[lowerSyl.length-1] || '';
  });
  return groups;
}

// Vokal-artige Laute bekommen die Königsbuchstabe-Krone, Konsonanten(-verbindungen) nicht.
function isVowelSoundKey(key){
  return ['A','E','I','O','U','AE','OE','UE','AU','AEU','EU','EI','IE','-E','Y1'].includes(key);
}

// Ordnet die Lautbausteine eines Wortes den (handgeprüften) Silben zu, damit
// der Silbenbogen weiterhin über der richtigen Buchstabengruppe sitzt.

// Zentrale, robuste Audio-Wiedergabe für alle aufgenommenen Laute: probiert
// zuerst die Schreibweise genau wie übergeben, dann komplett klein - GitHub
// unterscheidet bei Dateinamen Groß-/Kleinschreibung, das fängt eine
// abweichende Schreibweise beim Hochladen automatisch ab. onDone(true) heißt
// "hat abgespielt" (Ende abgewartet), onDone(false) heißt "beide Versuche
// fehlgeschlagen, nichts wurde abgespielt".
function playAudioKey(key, onDone){
  const variants = [key + '.m4a', key.toLowerCase() + '.m4a'];
  let i = 0;
  function tryNext(){
    if(i >= variants.length){ if(onDone) onDone(false); return; }
    const src = variants[i]; i++;
    try{
      const audio = new Audio(src);
      currentAudioEl = audio;
      let handled = false;
      audio.addEventListener('error', ()=>{ if(!handled){ handled=true; tryNext(); } });
      audio.addEventListener('ended', ()=>{ if(!handled){ handled=true; if(onDone) onDone(true); } });
      const p = audio.play();
      if(p && typeof p.catch === 'function'){ p.catch(()=>{ if(!handled){ handled=true; tryNext(); } }); }
    }catch(e){ tryNext(); }
  }
  tryNext();
}

// Spielt den Laut-Baustein ab; probiert dabei automatisch beide
// Schreibweisen des Dateinamens (GitHub ist groß-/kleinschreibungsempfindlich),
// bevor sicherheitshalber das ganze Wort normal vorgelesen wird.
window.playSoundToken = function(key, wholeWord){
  if(!key){ speak(wholeWord); return; }
  playAudioKey(key, (ok)=>{ if(!ok) speak(wholeWord); });
};

function tipForWord(word){

}

// Diagnostik nutzt gezielt: erstes Item aus Stufe 2 (Einstieg), dann
// Stufe 3 (bei Erfolg) bzw. Stufe 1 (bei Misserfolg) zur Einordnung.
function diagItem(domainId, level, usedSet){
  const pool = (domainId==='silbendock' ? diagSilbendock[level] : content[domainId][level]) || [];
  const okPool = pool.filter(i => i.type!=='mark');
  const candidates = usedSet ? okPool.filter(i => !usedSet.has(i)) : okPool;
  const choices = candidates.length ? candidates : (okPool.length ? okPool : pool);
  const original = choices[Math.floor(Math.random()*choices.length)];
  if(usedSet) usedSet.add(original);
  return original;
}

// Grobe, aber ausreichende Wochenkennung für die Verlaufsanzeige (muss
// nicht dem exakten ISO-Kalender entsprechen, nur wochenweise eindeutig sein).
function weekKey(date){
  const localMs = date.getTime() - date.getTimezoneOffset()*60000;
  return 'W' + Math.floor(localMs/86400000/7);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

const STORAGE_KEY = 'buchstabenhafen_progress_v1';
function saveProgress(){
  const now = new Date();
  const wk = weekKey(now);
  const snapshot = {week:wk, date:now.toISOString().slice(0,10), levels:{...state.levels}, stars:{...state.stars}, sv:3};
  const history = state.history || [];
  if(history.length && history[history.length-1].week === wk){
    const prevNote = history[history.length-1].note;
    history[history.length-1] = prevNote ? {...snapshot, note:prevNote} : snapshot;
  } else {
    history.push(snapshot);
  }
  state.history = history.slice(-26); // max. ca. ein halbes Jahr
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      levels: state.levels, stars: state.stars, diagDone: !!state.diagDone, history: state.history,
      errorCounts: state.errorCounts, attemptLogs: state.attemptLogs,
      mastery: state.mastery, selfChecks: state.selfChecks,
      needsBasicLetterDrill: state.needsBasicLetterDrill,
      diagReports: state.diagReports, wordStore: state.wordStore, errorProfile: state.errorProfile, errorLog: state.errorLog, fpSnapshots: state.fpSnapshots, sessionMin: state.sessionMin, showOsk: state.showOsk, endurance: state.endurance, sessionLog: state.sessionLog, histV3: true, discoverSeen: state.discoverSeen, fresch: state.fresch,
      childLabel: state.childLabel, className: state.className,
      trophies: state.trophies, knownAtStart: state.knownAtStart, stationsVersion: 3,
    }));
  }catch(e){}
}

// Hamburger Schulhalbjahr zum aktuellen Datum (kalendarische Näherung:
// 1. Halbjahr 01.08.-31.01., 2. Halbjahr 01.02.-31.07.) - für die exakten
// Daten (bewegliche Ferientage) bitte den offiziellen Kalender prüfen.
function currentSchulhalbjahr(){
  const d = new Date();
  const y = d.getFullYear(), m = d.getMonth()+1;
  const pad = n => String(n);
  if(m>=8){
    return {label:'1. Halbjahr '+y+'/'+String(y+1).slice(2), from:'01.08.'+y, to:'31.01.'+(y+1)};
  } else if(m===1){
    return {label:'1. Halbjahr '+(y-1)+'/'+String(y).slice(2), from:'01.08.'+(y-1), to:'31.01.'+y};
  } else {
    return {label:'2. Halbjahr '+(y-1)+'/'+String(y).slice(2), from:'01.02.'+y, to:'31.07.'+y};
  }
}

function errPlain(s){ return (typeof s==='string' && s.indexOf('<')<0 && s.indexOf('img:')!==0) ? s.replace(/\|/g,'') : null; }
function errGapPos(gap){ if(!gap) return ''; if(gap.charAt(0)==='_') return 'Anlaut'; if(gap.charAt(gap.length-1)==='_') return 'Auslaut'; return 'Inlaut'; }
// Baut den Fehlereintrag zu einer Aufgabe. given = Antwort des Kindes (oder null, wenn unbekannt).
function errorEntryFor(item, given, p){
  const t = item.type, o = {t};
  const w = errPlain(String(item.word || item.speak || item.answer || ''));
  if(w) o.w = w.slice(0,40);
  if(item.strat) o.st = item.strat;
  if(t==='pic' || t==='silbchoice' || t==='choice' || t==='flash'){
    const g = (given===null||given===undefined) ? null : errPlain(item.options[given]);
    const c = errPlain(item.options[item.answer]);
    if(g) o.g = g.slice(0,40);
    if(c) o.c = c.slice(0,40);
    if(item.taskIcon) o.ti = item.taskIcon;
    if(item.errorCategory) o.cat = item.errorCategory;
    if(t==='pic' && c && c.length<=2){
      o.pos = item.gap ? errGapPos(item.gap) : ({'🔡':'Anlaut','🔚':'Auslaut','🔍':'Inlaut'}[item.taskIcon] || '');
    }
    if(t==='silbchoice' && item.prompt){
      if(/ersten/.test(item.prompt)) o.pos='Anlaut'; else if(/letzten/.test(item.prompt)) o.pos='Auslaut'; else if(/mittleren|Mitte/.test(item.prompt)) o.pos='Inlaut';
    }
    if(t==='choice' && item.prompt && !item.errorCategory) o.q = item.prompt.replace(/_+/g,'…').slice(0,60);
  } else if(t==='mark'){
    o.c = item.correct.map(i=>item.units[i]).join('+').slice(0,40);
    o.g = ((p&&p.markSel)||[]).map((x,i)=>x?item.units[i]:null).filter(Boolean).join('+').slice(0,40);
    if(item.errorCategory) o.cat = item.errorCategory;
  } else if(t==='input'){
    o.c = String(item.answer||''); o.g = String(given||'').slice(0,40);
    if(item.errorCategory) o.cat = item.errorCategory;
  } else if(t==='papier'){
    o.c = item.word.replace(/\|/g,'');
    if(p && p.papierMarks) o.m = p.papierMarks.map((x,i)=>x?i:-1).filter(i=>i>=0);
  } else if(t==='kreuzseite' && item.rows && item.rows.length){
    const r = item.rows[item.rows.length-1];
    o.c = (r.opts.find(x=>x.ok)||{}).w; o.g = (r.opts.find(x=>!x.ok)||{}).w; o.cat = 'lese_'+r.typ; o.w = o.c;
  }
  return o;
}
function logError(domainId, level, entry){
  state.errorLog = state.errorLog || [];
  state.errorLog.push(Object.assign({d:todayStr(), dom:domainId, lv:level}, entry));
  while(state.errorLog.length > ERRLOG_MAX) state.errorLog.shift();
}

function fpAllDomains(){ return domains.concat(advancedDomains); }
// Einstiegsdiagnostik (Lotsen-Check): erste bzw. letzte Diagnose je Station
function fpDiagFor(id, last){
  const reps = state.diagReports || [];
  const order = last ? reps.slice().reverse() : reps;
  for(let i=0;i<order.length;i++){
    const r = (order[i].results||{})[id];
    if(r && r.level){
      const st = ['mid','second','confirm'].filter(s=>r[s]);
      return {date:order[i].date, level:r.level, ok:st.filter(s=>r[s].correct).length, n:st.length};
    }
  }
  return null;
}
// Stufe zu Beginn der Förderung (Einstiegsdiagnostik; sonst erster Verlaufseintrag; sonst 0 = nicht begonnen)
function fpBaseLevel(id){
  const dg = fpDiagFor(id, false);
  if(dg) return dg.level;
  const h = (state.history||[])[0];
  return (h && h.levels && h.levels[id]) ? h.levels[id] : 0;
}
function fpBaseDate(){
  const reps = state.diagReports || [];
  if(reps.length) return reps[0].date;
  const h = (state.history||[])[0];
  return h ? h.date : null;
}
const FP_DIAGCLS = {1:'schwerpunkt', 2:'aufbau', 3:'ressource'};
function fpAssess(d){
  const lvl = state.levels[d.id]||0, stars = state.stars[d.id]||0, err = state.errorCounts[d.id]||0;
  const al = state.attemptLogs[d.id];
  const log = (al && al.level===lvl) ? al.log : [];
  const status = domainStatus(d).status;
  const total = stars+err;
  const trophy = !!state.trophies[d.id] || status==='mastered' || status==='review';
  const started = total>0 || trophy || !!state.mastery[d.id];
  const errRate = total ? err/total : null;
  const last6 = log.slice(-6);
  const rc = last6.length>=4 ? {ok:last6.filter(Boolean).length, n:last6.length, seq:last6} : null;
  const rec = rc ? rc.ok/rc.n : null;
  const maxLvl = Math.max.apply(null, Object.keys(content[d.id]||{1:1}).map(Number));
  const dgLast = fpDiagFor(d.id, true), dgFirst = fpDiagFor(d.id, false);
  let cls, basis;
  if(started && (total>=8 || trophy)){
    basis = 'practice';
    if(trophy || (lvl>=maxLvl && (errRate===null || errRate<0.35))) cls = 'ressource';
    else if((rec!==null && rec<0.6) || (errRate!==null && errRate>=0.35)) cls = 'schwerpunkt';
    else cls = 'aufbau';
  } else if(dgLast){
    basis = 'diag';
    cls = FP_DIAGCLS[Math.min(3, Math.max(1, lvl||dgLast.level))];
  } else if(started){ basis = 'practice'; cls = 'aufbau'; }
  else { basis = 'none'; cls = 'offen'; }
  const base = fpBaseLevel(d.id);
  return {d, lvl, stars, err, total, errRate, rc, rec, cls, basis, trophy, status, maxLvl, started, dgFirst, dgLast, base, tested:!!(started||dgLast)};
}
function fpICan(d, lvl){
  const s = (iCanStatements[d.id]||{})[lvl] || '';
  return s.replace(/\.$/,'').replace(/^Ich kann /,'kann ').replace(/\bmir\b/g,'sich').replace(/\bmein(e|en|em|er)?\b/g,'sein$1');
}
const FP_RANK = {schwerpunkt:3, aufbau:2, ressource:1, offen:0};
function fpTKs(byId){
  return FP_TK.map(tk=>{
    const rows = tk.doms.map(id=>byId[id]).filter(Boolean);
    const tested = rows.filter(r=>r.tested);
    let cls;
    if(!tested.length) cls = 'offen';
    else if(tested.some(r=>r.cls==='schwerpunkt')) cls = 'schwerpunkt';
    else if(tested.every(r=>r.cls==='ressource') && tested.length===rows.length) cls = 'ressource';
    else cls = 'aufbau';
    const ok = rows.reduce((s,r)=>s+r.stars,0), bad = rows.reduce((s,r)=>s+r.err,0);
    return Object.assign({}, tk, {rows, tested, cls, ok, bad, total:ok+bad});
  });
}
function fpMain(tks){
  const by = {}; tks.forEach(t=>by[t.id]=t);
  const ordered = FP_TK_ORDER.map(i=>by[i]);
  const sw = ordered.filter(t=>t.cls==='schwerpunkt');
  if(sw.length) return {kind:'schwerpunkt', main:sw[0], more:sw.slice(1)};
  const au = ordered.filter(t=>t.cls==='aufbau');
  if(au.length) return {kind:'aufbau', main:au[0], more:au.slice(1)};
  if(ordered.some(t=>t.cls==='ressource')) return {kind:'keiner', main:null, more:[]};
  return {kind:'offen', main:null, more:[]};
}
function fpBereichCls(tks, bid){
  const l = tks.filter(t=>t.bereich===bid && t.cls!=='offen');
  if(!l.length) return 'offen';
  return l.reduce((w,t)=>FP_RANK[t.cls]>FP_RANK[w]?t.cls:w, 'ressource');
}
function fpRoundsByDate(){
  const by = {};
  (state.selfChecks||[]).forEach(s=>{ const b = by[s.date] = by[s.date]||{items:0,err:0,n:0}; b.items+=s.items||0; b.err+=s.errors||0; b.n++; });
  return Object.keys(by).sort().map(d=>({d, n:by[d].n, items:by[d].items, err:by[d].err, ok:Math.max(0,by[d].items-by[d].err)}));
}
function fpAlign(given, correct){
  const g = (given||'').toLowerCase(), c = (correct||'').toLowerCase();
  const n = g.length, m = c.length, D = [];
  for(let i=0;i<=n;i++){ D[i]=[i]; }
  for(let j=0;j<=m;j++){ D[0][j]=j; }
  for(let i=1;i<=n;i++) for(let j=1;j<=m;j++){
    D[i][j] = Math.min(D[i-1][j]+1, D[i][j-1]+1, D[i-1][j-1] + (g[i-1]===c[j-1]?0:1));
  }
  const ops = []; let i=n, j=m;
  while(i>0 || j>0){
    if(i>0 && j>0 && D[i][j]===D[i-1][j-1] + (g[i-1]===c[j-1]?0:1)){
      if(g[i-1]!==c[j-1]) ops.push({k:'sub', g:g[i-1], c:c[j-1], j:j-1}); i--; j--;
    } else if(j>0 && D[i][j]===D[i][j-1]+1){ ops.push({k:'del', c:c[j-1], j:j-1}); j--; }
    else { ops.push({k:'ins', g:g[i-1], j:Math.min(j,m-1)}); i--; }
  }
  const V = x => LETTER_VOWELS.indexOf(x)>=0;
  return ops.reverse().map(op=>{
    const pos = op.j<=0 ? 'Anlaut' : (op.j>=m-1 ? 'Auslaut' : 'Inlaut');
    let label;
    if(op.k==='del'){
      if(V(op.c)) label = 'Vokalbuchstabe fehlt (Silbenkern)';
      else if(c[op.j]===c[op.j-1] || c[op.j]===c[op.j+1]) label = 'Doppelkonsonant verkürzt';
      else if(!V(c[op.j-1]||'a') || !V(c[op.j+1]||'a')) label = 'Konsonant in Häufung fehlt';
      else label = 'Konsonant fehlt';
    } else if(op.k==='ins'){
      label = (!V(op.g) && (g.split(op.g).length>2)) ? 'Konsonant zu viel / verdoppelt' : 'Buchstabe zu viel';
    } else {
      const pair = [op.g,op.c].sort().join('');
      if(pos==='Auslaut' && (pair==='bp'||pair==='dt'||pair==='gk')) label = 'Auslautverhärtung (b/p, d/t, g/k)';
      else if(V(op.g)&&V(op.c)) label = 'Vokal verwechselt';
      else if(!V(op.g)&&!V(op.c)) label = 'Konsonant verwechselt';
      else label = 'Vokal und Konsonant vertauscht';
    }
    return {label, pos, g:op.g||'', c:op.c||''};
  });
}
// Alle erfassten Fehler: Detailprotokoll (ab diesem Update) + Fehler aus den Eingangs-/Wiederholungsdiagnosen
function fpAllErrors(){
  const out = (state.errorLog||[]).map(e=>Object.assign({src:'log'}, e));
  (state.diagReports||[]).forEach(rep=>{
    Object.keys(rep.results||{}).forEach(dom=>{
      ['mid','second','confirm'].forEach(st=>{
        const r = rep.results[dom][st];
        if(r && r.item && r.correct===false){
          const e = errorEntryFor(r.item, null, null);
          out.push(Object.assign({src:'diag', d:rep.date, dom, lv:rep.results[dom].level||null}, e));
        }
      });
    });
  });
  return out;
}
const FP_SPELL_DOMS = ['silbendock','schreib1','schreib2','grundwortschatz','satzbau','diktat'];
const FP_READ_DOMS = ['lesen','lesekai','blitzlesen','lesekompetenz'];

function fpAnalyse(){
  const errs = fpAllErrors();
  // Wörter
  const words = {};
  const addWord = (key, e)=>{
    const k = key.toLowerCase();
    (words[k] = words[k] || {w:key, n:0, ist:[], doms:new Set(), dates:new Set()});
    words[k].n++; words[k].doms.add(e.dom); words[k].dates.add(e.d);
    if(e.g && e.g!==e.c && (e.t==='input' || (e.t==='choice' && FP_SPELL_DOMS.indexOf(e.dom)>=0))) words[k].ist.push(e.g);
  };
  errs.filter(e=>FP_SPELL_DOMS.indexOf(e.dom)>=0 && e.w && (e.t==='input'||e.t==='choice'||e.t==='papier'||e.t==='dictate'||e.t==='satzbau'||e.t==='wordstudy')).forEach(e=>addWord(e.w || e.c, e));
  (state.wordStore||[]).forEach(ws=>{ const k=ws.word.toLowerCase(); if(!words[k]) words[k]={w:ws.word,n:0,ist:[],doms:new Set(),dates:new Set()}; words[k].inStore=true; words[k].streak=ws.streak||0; });
  const wordList = Object.keys(words).map(k=>words[k]).sort((a,b)=>(b.n-a.n)||a.w.localeCompare(b.w,'de'));
  // Laute / Buchstaben
  const sound = errs.filter(e=>e.pos && (e.t==='pic'||e.t==='silbchoice'));
  const posCount = {Anlaut:0, Inlaut:0, Auslaut:0};
  sound.forEach(e=>{ if(posCount[e.pos]!==undefined) posCount[e.pos]++; });
  const conf = {};
  sound.forEach(e=>{ if(e.c){ const k=(e.g?e.g:'?')+'|'+e.c; (conf[k] = conf[k]||{g:e.g||null,c:e.c,n:0,pos:{},ws:new Set()}); conf[k].n++; conf[k].pos[e.pos]=1; conf[k].ws.add(e.w); } });
  const confList = Object.keys(conf).map(k=>conf[k]).sort((a,b)=>b.n-a.n);
  const phonErr = {};
  errs.filter(e=>e.dom==='phon').forEach(e=>{ const k = ({'👏':'Silben gliedern','🔁':'Reime erkennen','🎯':'Anlaute vergleichen'}[e.ti]||'Lautbewusstheit'); phonErr[k]=(phonErr[k]||0)+1; });
  // Schreibmuster
  const patterns = {};
  const addPat = (label,pos,ex)=>{ const p = patterns[label] = patterns[label] || {n:0,pos:{},ex:[]}; p.n++; p.pos[pos]=(p.pos[pos]||0)+1; if(ex && p.ex.length<3 && p.ex.indexOf(ex)<0) p.ex.push(ex); };
  errs.filter(e=>e.t==='input' && e.g!==undefined && e.g!=='' && e.c).forEach(e=>{
    fpAlign(e.g, e.c).forEach(op=>addPat(op.label, op.pos, e.g+' → '+e.c));
  });
  errs.filter(e=>e.t==='papier' && e.m && e.c).forEach(e=>{
    e.m.forEach(i=>{ const m=e.c.length; const pos = i<=0?'Anlaut':(i>=m-1?'Auslaut':'Inlaut'); const isV = LETTER_VOWELS.indexOf(e.c[i].toLowerCase())>=0; addPat(isV?'Vokalbuchstabe auf Papier abweichend':'Konsonant auf Papier abweichend', pos, e.c+' (Buchstabe „'+e.c[i]+'")'); });
  });
  // Leseauffälligkeiten (Kreuzseite, Wort-Bild, Verstehen)
  const readCnt = {};
  Object.keys(READ_ERROR_LABELS).forEach(k=>{ if(state.errorProfile[k]) readCnt[k] = state.errorProfile[k]; });
  const readPairs = {};
  errs.filter(e=>FP_READ_DOMS.indexOf(e.dom)>=0 && e.g && e.c && e.t!=='flash').forEach(e=>{ const k=e.g+' ↔ '+e.c; readPairs[k]=(readPairs[k]||0)+1; });
  // Spelling-Kategorien mit Beispielen
  const cats = Object.keys(FP_CAT_INFO).map(k=>({k, n:state.errorProfile[k]||0, info:FP_CAT_INFO[k],
    ex: errs.filter(e=>e.cat===k && e.t==='choice' && e.c).map(e=>(e.g?e.g+' → ':'')+e.c).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3)})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n);
  return {errs, wordList, posCount, confList, phonErr, patterns, readCnt, readPairs:Object.keys(readPairs).map(k=>({k,n:readPairs[k]})).sort((a,b)=>b.n-a.n), cats, detail:(state.errorLog||[]).length};
}

    <table class="fp-table"><tr><th>Station</th><th>Einstiegsdiagnostik</th>${redia?'<th>Neue Diagnose</th>':''}<th>Stufenband</th></tr>${zuwachsRows}</table>` : '<p class="fp-muted">Noch keine Stationen geprüft.</p>'}
    ${roundHtml}
    ${rueck}`;

  /* ---------- 3 Fehleranalyse ---------- */
  const catHtml = An.cats.length ? `
    <table class="fp-table">
      <tr><th>Rechtschreibmuster</th><th>Anzahl</th><th>So äußert sich der Fehler</th><th>Beispiele</th></tr>
      ${An.cats.map(c=>`<tr><td><strong>${escapeHtml(c.info.label)}</strong></td><td style="text-align:center;">${c.n}</td><td>${escapeHtml(c.info.desc)}</td><td>${c.ex.length? c.ex.map(escapeHtml).join('<br>') : '<span class="fp-sub">noch keine Wortbeispiele erfasst</span>'}</td></tr>`).join('')}
    </table>` : '<p class="fp-muted">Noch keine kategorisierten Rechtschreibfehler erfasst.</p>';
  const patKeys = Object.keys(An.patterns).sort((a,b)=>An.patterns[b].n-An.patterns[a].n);
  const patHtml = patKeys.length ? `
    <p style="margin-top:8px;"><strong>Fehlerarten beim Aufschreiben</strong> <span class="fp-sub">(Vergleich der Kinderschreibung mit dem Zielwort)</span></p>

      <tr><th>Fehlerart</th><th>Anzahl</th><th>Wortstelle</th><th>Beispiele</th></tr>
      ${patKeys.slice(0,8).map(k=>{ const p=An.patterns[k]; const pos=Object.keys(p.pos).map(x=>x+' ('+p.pos[x]+')').join(', ');
        return `<tr><td>${escapeHtml(k)}</td><td style="text-align:center;">${p.n}</td><td>${escapeHtml(pos)}</td><td>${p.ex.map(escapeHtml).join('<br>')}</td></tr>`; }).join('')}
    </table>` : '';
  const posTotal = An.posCount.Anlaut + An.posCount.Inlaut + An.posCount.Auslaut;
  const confHtml = An.confList.length ? `
    <table class="fp-table">
      <tr><th>Laut / Buchstabe</th><th>Anzahl</th><th>Wortstelle</th><th>Wörter</th></tr>
      ${An.confList.slice(0,10).map(c=>`<tr><td>${c.g?escapeHtml(c.g)+' statt ':'Gesucht: '}<strong>${escapeHtml(c.c)}</strong></td><td style="text-align:center;">${c.n}</td><td>${Object.keys(c.pos).join(', ')}</td><td>${Array.from(c.ws).slice(0,4).map(escapeHtml).join(', ')}</td></tr>`).join('')}
    </table>` : '';
  const lautHtml = (posTotal || An.confList.length || Object.keys(An.phonErr).length) ? `
    <p>${posTotal ? `Laute, die nicht sicher zugeordnet wurden, nach Wortstelle: <strong>Anlaut ${An.posCount.Anlaut}</strong> · <strong>Inlaut (Mitte) ${An.posCount.Inlaut}</strong> · <strong>Auslaut ${An.posCount.Auslaut}</strong>.` : ''} ${Object.keys(An.phonErr).length ? 'Fehler beim reinen Hören (ohne Schrift): '+Object.keys(An.phonErr).map(k=>escapeHtml(k)+' ('+An.phonErr[k]+')').join(', ')+'.' : ''}</p>
    ${confHtml}` : '<p class="fp-muted">Für einzelne Laute und Buchstaben liegen noch keine Fehler vor. Sie werden ab jetzt beim Üben mit Wort, gewählter Antwort und Wortstelle (Anlaut/Inlaut/Auslaut) erfasst.</p>';
  const recurring = An.wordList.filter(w=>w.n>=2);
  const single = An.wordList.filter(w=>w.n<2);
  const wordRow = w=>`<tr><td><strong>${escapeHtml(w.w)}</strong></td><td style="text-align:center;">${w.n||'–'}</td><td>${Array.from(w.doms).map(id=>{const d=anyDomain(id);return d?d.icon+' '+escapeHtml(d.name):''}).join(', ')}</td><td>${w.ist.length?Array.from(new Set(w.ist)).slice(0,3).map(escapeHtml).join(', '):'<span class="fp-sub">–</span>'}${w.inStore?'<br><span class="fp-sub">liegt im Wortspeicher der App</span>':''}</td></tr>`;
  const wordHtml = An.wordList.length ? `
    ${recurring.length ? `<p><strong>Wiederholt falsch geschrieben:</strong></p>
    <table class="fp-table"><tr><th>Wort</th><th>Fehler</th><th>Station</th><th>Falsche Schreibung</th></tr>${recurring.map(wordRow).join('')}</table>` : '<p class="fp-muted">Bisher wurde kein Wort mehr als einmal falsch geschrieben.</p>'}
    ${single.length ? `<p class="fp-muted" style="margin-top:8px;">Einmal auffällig (Diagnose oder Übung): ${single.slice(0,20).map(w=>escapeHtml(w.w)).join(', ')}.</p>` : ''}` : '<p class="fp-muted">Noch keine einzelnen Wörter erfasst.</p>';
  const readKeys = Object.keys(An.readCnt).sort((a,b)=>An.readCnt[b]-An.readCnt[a]);
  const readHtml = readKeys.length ? `
    <table class="fp-table"><tr><th>Leseauffälligkeit</th><th>Anzahl</th></tr>${readKeys.map(k=>`<tr><td>${escapeHtml(READ_ERROR_LABELS[k])}</td><td style="text-align:center;">${An.readCnt[k]}</td></tr>`).join('')}</table>
    ${An.readPairs.length ? `<p class="fp-muted" style="margin-top:6px;">Verwechselte Wörter beim Lesen: ${An.readPairs.slice(0,8).map(p=>escapeHtml(p.k)+(p.n>1?' ('+p.n+'×)':'')).join(', ')}.</p>` : ''}` : '<p class="fp-muted">Keine kategorisierten Leseauffälligkeiten erfasst.</p>';
  const readSummary = tks.filter(t=>t.bereich==='lesen').map(t=>`${escapeHtml(t.n)}: ${FP_CLS[t.cls].label}`).join(' · ');

  /* ---------- 4 Ziele ---------- */
  const prioTK = (M.main?[M.main]:[]).concat(M.more).concat(tks.filter(t=>t.cls==='aufbau' && (!M.main||M.main.id!==t.id) && M.more.indexOf(t)<0)).slice(0,3);
  const goalRows = prioTK.map((t,i)=>{
    const cand = t.rows.filter(r=>r.tested);
    const a = cand.sort((x,y)=>(FP_RANK[y.cls]-FP_RANK[x.cls]) || ((x.lvl||9)-(y.lvl||9)))[0];
    if(!a) return '';
    const next = (iCanStatements[a.d.id]||{})[a.lvl+1];
    const obs = `${stn(a.d.id,true)}: ${lvTxt(a)}.<br>${a.total>0?`${a.stars} von ${a.total} Aufgaben richtig.`:(a.dgLast?`Einstiegscheck: ${a.dgLast.ok} von ${a.dgLast.n} richtig.`:'')}`;
    const ziel = next ? `${who} ${escapeHtml(fpICan(a.d,a.lvl+1))}.<br><span class="fp-sub">Erreicht, wenn von 6 Aufgaben mindestens 5 richtig sind – in zwei Übungsrunden hintereinander.</span>` : `${who} festigt Stufe ${a.lvl}: mindestens 5 von 6 Aufgaben richtig.`;
    const mass = `<strong>${escapeHtml(t.n)}:</strong> ${escapeHtml(t.foerder)}<br><em>In der App:</em> ${stn(a.d.id,false)}, ca. 1× wöchentlich Lernförderstunde.<br><em>Ergänzend:</em> ${escapeHtml((FP_MASS[a.d.id]||{}).aus||'')}`;
    return `<tr><td style="text-align:center;font-weight:bold;">${i+1}</td><td>${obs}</td><td>${ziel}</td><td>${mass}<br>&nbsp;<br>Weitere Maßnahmen: ______________________</td><td>____________<br>&nbsp;<br>Überprüfung am: ________</td></tr>`;
  }).join('');

  /* ---------- Arbeitsverhalten ---------- */
  const sl = (state.sessionLog||[]).slice(-8);
  const eh = (state.endurance && state.endurance.hist) || [];
  let arbeitHtml;
  if(!sl.length){
    arbeitHtml = '<p class="fp-muted">Noch keine vollständige Förderstunde erfasst. Die App misst ab jetzt, wie lange das Kind am Stück konzentriert arbeitet.</p>';
  } else {
    const avg = sl.reduce((s,x)=>s+x.min,0)/sl.length, avgSoll = sl.reduce((s,x)=>s+x.soll,0)/sl.length;
    const maxSoll = Math.max.apply(null, sl.map(x=>Math.max(x.soll,x.min)));
    const startBlock = eh.length ? eh[0].from : (state.endurance?state.endurance.blockMin:5), nowBlock = state.endurance?state.endurance.blockMin:startBlock;
    const guessSum = sl.reduce((s,x)=>s+(x.guess||0),0);
    const blkTxt = nowBlock>startBlock ? `von ${startBlock} auf ${nowBlock} Minuten gestiegen ↗` : (nowBlock<startBlock ? `von ${startBlock} auf ${nowBlock} Minuten gesunken ↘` : `unverändert bei ${nowBlock} Minuten`);
    arbeitHtml = `
    <p>Die App teilt jede Förderstunde in Arbeitsblöcke mit stillen Bewegungspausen. Die <strong>Blocklänge</strong> ist die Zeit, die das Kind am Stück konzentriert arbeitet, bevor Genauigkeit oder Tempo nachlassen. Sie wird für jedes Kind selbst angepasst.</p>
    <table class="fp-table">
      <tr><td style="width:34%;"><strong>Blocklänge (Konzentration am Stück)</strong></td><td>${blkTxt}</td></tr>
      <tr><td><strong>Arbeitszeit netto je Förderstunde</strong></td><td>im Mittel ${avg.toFixed(1).replace('.',',')} Minuten (Ziel ${Math.round(avgSoll)} Minuten), ${sl.length} Stunde(n) erfasst</td></tr>
      <tr><td><strong>Schnelles Raten</strong></td><td>${guessSum ? guessSum+' Antworten wurden als Raten erkannt und nicht als Fehler gewertet.' : 'Kein Raten erkannt.'}</td></tr>
    </table>
    <p class="fp-muted" style="margin:6px 0 2px;">Arbeitszeit netto je Förderstunde (grün: erreicht, grauer Rahmen: Ziel):</p>
    <table class="fp-table fp-small">${sl.map(x=>`<tr><td style="width:84px;">${escapeHtml(x.d)}</td><td style="width:120px;">${String(x.min).replace('.',',')} von ${x.soll} Min.</td><td><div style="border:1px solid #B9C4CC;border-radius:5px;height:11px;width:${Math.round(x.soll/maxSoll*100)}%;"><div style="background:#2E9B49;height:11px;border-radius:5px;width:${Math.min(100,Math.round(x.min/x.soll*100))}%;"></div></div></td><td style="width:130px;" class="fp-sub">${x.pauses} Pause(n), Block ${x.blockMin} Min.</td></tr>`).join('')}</table>
    <p class="fp-muted">Gemessen wird aus dem Antwortverhalten in der App. Das ersetzt nicht die Beobachtung durch die Lehrkraft.</p>`;
  }

  /* ---------- Anhang ---------- */
  const stationRows = FP_TK_ORDER.map(id=>tkBy[id]).map(t=>t.doms.map(id=>{
    const d = anyDomain(id), i = STATION_INFO[id]||{};
    return `<tr><td>${d.icon} <strong>${escapeHtml(d.name)}</strong></td><td>${escapeHtml(t.n)}</td><td>${escapeHtml(i.tut||'')}<br><span class="fp-sub">Beispiel: ${escapeHtml(i.bsp||'')}</span></td><td class="fp-sub">${escapeHtml(i.stufen||'')}</td></tr>`;
  }).join('')).join('');

  return `<!DOCTYPE html>
<html lang="de">
<head>

<title>Förderplan – ${child !== '____________________' ? child : 'Buchstabenhafen'}</title>
<style>

  h3{font-size:0.95rem;margin:16px 0 4px;color:#1B4F5F;page-break-after:avoid;}
  p{margin:5px 0;}

  .fp-meta div{margin:2px 0;}
  .fp-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:0.82rem;}

  .fp-table th{background:#EEF2F4;}

  .fp-band td{background:#DDE9ED;font-size:0.84rem;}
  .fp-hl td{background:#FFF8EA;}

  .fp-sub{font-size:0.76rem;color:#617685;}

  .fp-muted{font-size:0.84rem;color:#5A6B76;}
  .fp-chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:0.78rem;font-weight:bold;margin:1px 2px;}

  .fp-main-h{font-size:0.78rem;font-weight:bold;letter-spacing:0.05em;text-transform:uppercase;color:#A23A12;}
  .fp-main-t{font-size:1.3rem;font-weight:bold;margin:2px 0;}

  .fp-sig .line{display:inline-block;width:260px;border-bottom:1px solid #173142;margin-right:24px;}

  @media print{ .no-print{display:none;} body{padding:0;} .fp-main,.fp-sc,.fp-chip,.fp-hl td,.fp-band td{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
</style>
</head>
<body>
  <div class="no-print" style="text-align:right;margin-bottom:10px;">
    <button onclick="window.print()" style="font-family:Arial;font-weight:bold;padding:10px 18px;border-radius:8px;border:none;background:#1B6E7F;color:#fff;cursor:pointer;">🖨️ Drucken / Als PDF speichern</button>
  </div>

  <h1>Förderplan Lesen und Rechtschreiben – ${mode==='fort' ? 'Fortschreibung' : 'Erstfassung'}</h1>
  <div class="fp-meta" style="margin-top:8px;">
    <div>Name/Kürzel: <strong>${child}</strong> &nbsp;&nbsp; Klasse: <strong>${klass}</strong> &nbsp;&nbsp; Datum: <strong>${today}</strong></div>
    <div>Förderzeitraum: <strong>${hj.label}</strong> (${hj.from} – ${hj.to})</div>
    <div>Grundlage: digitale Förderdiagnostik mit der Lernanwendung „Buchstabenhafen“ (adaptive Übungen mit Stationen); ${diagReps.length?'Einstiegsdiagnostik vom '+escapeHtml(baseDate||''):'ohne Einstiegsdiagnostik'}; ${nRounds} Übungsrunden${rounds.length?' ('+escapeHtml(rounds[0].d)+' bis '+escapeHtml(rounds[rounds.length-1].d)+')':''}.</div>

  ${mainBox}

  <h2 style="page-break-before:always;">1. Kompetenzkarte: Wo genau liegen Stärken und Förderbedarf?</h2>
  <p class="fp-muted">Die Teilkompetenzen des Schriftspracherwerbs werden getrennt betrachtet, weil sie unterschiedlich gefördert werden. Die Stationen der App (Name und Symbol) sind der jeweiligen Teilkompetenz zugeordnet.</p>
  <table class="fp-table"><tr><th>Teilkompetenz</th><th>Einschätzung</th><th>Stationen und Belege</th></tr>${tkRowsHtml}</table>

  ${zSec}

  <h2>3. Arbeitsverhalten: Konzentration und Durchhalten</h2>
  ${arbeitHtml}

  <h2>4. Fehleranalyse</h2>
  <h3>4.1 Hören und Zuordnen: Laute und Buchstaben</h3>
  ${lautHtml}
  <h3>4.2 Schreiben: Rechtschreibmuster und Fehlerarten</h3>
  ${catHtml}
  ${fpFreschHtml()}
  ${patHtml}

  ${An.cats.length ? `<h3>Förderung nach Fehlermustern (stationsübergreifend)</h3><table class="fp-table"><tr><th>Fehlermuster</th><th>Maßnahme</th></tr>${An.cats.slice(0,3).map(c=>`<tr><td><strong>${escapeHtml(c.info.label)}</strong> (${c.n}×)</td><td>${escapeHtml(c.info.mass)}</td></tr>`).join('')}</table>` : ''}
  <p class="fp-muted">Die Ziele und Maßnahmen sind Vorschläge, die aus den Übungsdaten abgeleitet wurden. Sie sind von der Lehrkraft zu prüfen und anzupassen.</p>` : '<p class="fp-muted">Aktuell kein Bereich mit Förderbedarf.</p>'}

  <h2>6. Ergänzungen der Lehrkraft</h2>

  <h2 style="page-break-before:always;">Anhang A: So lesen Sie diesen Förderplan</h2>
  <table class="fp-table">
    <tr><th style="width:24%;">Begriff</th><th>Bedeutung</th></tr>
    <tr><td><strong>Station</strong></td><td>Eine Übungsstation in der App (Name und Symbol, z. B. 🪢 Silbendock). Jede Station trainiert genau eine Teilkompetenz; die Tabelle in Anhang B erklärt alle Stationen.</td></tr>
    <tr><td><strong>Stufe (z. B. „Stufe 2 von 4“)</strong></td><td>Jede Station hat vier Schwierigkeitsstufen. Die App stellt das Kind automatisch auf die passende Stufe ein: Sie steigt auf, wenn von den letzten 6 Aufgaben mindestens 5 richtig waren (nach mindestens 8 bearbeiteten Aufgaben), und geht zurück, wenn von den letzten 4 Aufgaben mindestens 3 falsch waren. „Stufe 2“ heißt: Die Aufgaben von Stufe 1 sind gesichert, das Kind übt an Stufe 2.</td></tr>
    <tr><td><strong>„x von y Aufgaben richtig“</strong></td><td>Anzahl der bisher gelösten Aufgaben der Station im Verhältnis zu allen bearbeiteten Aufgaben. Es sind absolute Zahlen, keine Prozentwerte eines Tests.</td></tr>
    <tr><td><strong>„zuletzt ●●●○●●“</strong></td><td>Die letzten bis zu 6 Aufgaben auf der aktuellen Stufe: <span class="fp-ok">●</span> richtig, <span class="fp-no">○</span> falsch. Zeigt, wie sicher das Kind <em>jetzt</em> ist.</td></tr>
    <tr><td><strong>Einstiegscheck</strong></td><td>Kurze Einstiegsdiagnostik (3 Aufgaben je Station mit leichterem oder schwererem Nachfolgeitem). Ergibt die Startstufe 1 bis 3.</td></tr>
    <tr><td>${chip('ressource')}</td><td>Die Teilkompetenz ist gesichert (Pokal oder höchste Stufe erreicht und weniger als ein Drittel der Aufgaben falsch; bei geringer Datenlage: Start auf Stufe 3 im Einstiegscheck). Muss nicht mehr gefördert werden und dient als Stütze.</td></tr>
    <tr><td>${chip('aufbau')}</td><td>Die Teilkompetenz entwickelt sich. Es gibt Fehler, aber keinen auffälligen Schwerpunkt.</td></tr>
    <tr><td>${chip('schwerpunkt')}</td><td>Auffällig unsicher: von den letzten 6 Aufgaben weniger als 4 richtig oder insgesamt mehr als ein Drittel der Aufgaben falsch (bei geringer Datenlage: Start auf Stufe 1 im Einstiegscheck).</td></tr>
    <tr><td>${chip('offen')}</td><td>Bisher nicht geprüft, oder die Station wird erst freigeschaltet, wenn eine Voraussetzung erreicht ist.</td></tr>
    <tr><td><strong>Blocklänge, Netto-Arbeitszeit</strong></td><td>Netto-Arbeitszeit ist die Zeit mit Aufgaben (ohne Verteilen der iPads und ohne Pausen). Die Blocklänge ist die Zeit bis zur nächsten stillen Pause; sie passt sich an, wenn Genauigkeit oder Tempo nachlassen (kürzer) oder lange stabil bleiben (länger).</td></tr>
    <tr><td><strong>Hauptförderbedarf</strong></td><td>Die Teilkompetenz mit Förderschwerpunkt, die in der Entwicklung des Schriftspracherwerbs am weitesten vorn liegt (Reihenfolge: Phonologische Bewusstheit, Buchstaben-Laut-Wissen, lautorientiertes Schreiben, Dekodieren, orthografische Strategien, Leseflüssigkeit, Rechtschreibwortschatz, Leseverstehen, Sätze). Denn spätere Teilkompetenzen bauen auf den früheren auf.</td></tr>
