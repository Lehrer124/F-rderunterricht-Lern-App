<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buchstabenhafen – Lese-Rechtschreib-Lotse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --harbor-dark:#0F3145;
    --harbor-mid:#1B6E7F;
    --sand:#FCF4E4;
    --sand-deep:#F4E6CB;
    --coral:#E2672E;
    --coral-dark:#C44F1D;
    --sun:#F4B93E;
    --foam:#4FA893;
    --ink:#173142;
    --line:#D8C9A8;
    --white:#FFFFFF;
    --radius-lg:22px;
    --radius-sm:12px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--sand);
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Baloo 2', sans-serif;
    color:var(--harbor-dark);
    margin:0;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:24px;}
  @media (min-width:820px){
    #app{max-width:920px;}
    body{font-size:1.15rem;}
    .prompt-text{font-size:1.5rem;}
    .pic-target{font-size:5.6rem;}
    .pic-target .pic-img{width:5.6rem;height:5.6rem;}
    .task-instr{font-size:1.25rem;}
    .opt-btn, .pic-opt-btn{font-size:1.3rem;min-height:96px;}
    .btn{font-size:1.2rem;padding:16px 30px;}
    .station-icon{width:66px;height:66px;font-size:2rem;}
    .station-body h3{font-size:1.25rem;}
  }

  /* ---------- header / wave ---------- */
  .topbar{
    background:linear-gradient(180deg, var(--harbor-dark) 0%, var(--harbor-mid) 100%);
    color:var(--white);
    padding:18px 20px 40px;
    position:relative;
  }
  .topbar h1{color:var(--white);font-size:1.5rem;font-weight:700;}
  .topbar .sub{font-size:0.9rem;opacity:0.85;margin-top:2px;}
  .wave{
    position:absolute;left:0;right:0;bottom:-1px;height:26px;
    background:var(--sand);
    clip-path: polygon(0 60%, 5% 40%, 10% 60%, 15% 40%, 20% 60%, 25% 40%, 30% 60%, 35% 40%, 40% 60%, 45% 40%, 50% 60%, 55% 40%, 60% 60%, 65% 40%, 70% 60%, 75% 40%, 80% 60%, 85% 40%, 90% 60%, 95% 40%, 100% 60%, 100% 100%, 0 100%);
  }
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .icon-btn{
    background:rgba(255,255,255,0.15);
    border:none;color:var(--white);
    border-radius:50%;
    width:42px;height:42px;
    font-size:1.1rem;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .icon-btn:active{background:rgba(255,255,255,0.3);}

  main{padding:0 20px;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    border:none;
    border-radius:999px;
    padding:14px 26px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:transform .08s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--coral);color:var(--white);}
  .btn-primary:hover{background:var(--coral-dark);}
  .btn-ghost{background:var(--white);color:var(--harbor-dark);border:2px solid var(--line);}
  .btn-block{width:100%;justify-content:center;}

  /* ---------- start screen ---------- */
  .hero{text-align:center;padding:8px 4px 10px;}
  @keyframes lumiSail{ 0%{ transform:translateX(-40px); opacity:0; } 100%{ transform:translateX(0); opacity:1; } }
  .lumi-sail{ animation: lumiSail 0.6s ease-out; }
  .lighthouse{font-size:64px;line-height:1;margin-bottom:4px;}
  .hero p{font-size:1rem;line-height:1.5;color:var(--ink);opacity:0.85;margin-top:10px;}
  .card{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:20px;
    margin-top:18px;
    border:2px solid var(--line);
  }

  /* ---------- diagnostic / practice question ---------- */
  .progress-track{height:10px;background:var(--sand-deep);border-radius:999px;overflow:hidden;margin:14px 0 22px;}
  .progress-fill{height:100%;background:var(--foam);border-radius:999px;transition:width .3s ease;}
  .prompt-card{
    background:var(--white);
    border-radius:var(--radius-lg);
    padding:24px 20px;
    border:2px solid var(--line);
    text-align:center;
  }
  .domain-tag{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--sand-deep);color:var(--harbor-dark);
    font-family:'Baloo 2';font-weight:700;font-size:0.85rem;
    padding:6px 14px;border-radius:999px;margin-bottom:14px;
  }
  .prompt-text{font-size:1.3rem;font-weight:600;line-height:1.4;color:var(--harbor-dark);margin:6px 0 4px;font-family:'Baloo 2';}
  .speak-btn{
    background:var(--sun);border:none;color:var(--harbor-dark);
    border-radius:50%;width:52px;height:52px;font-size:1.4rem;cursor:pointer;margin:10px auto 4px;
    display:flex;align-items:center;justify-content:center;
  }
  .options{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px;}
  .options.single{grid-template-columns:1fr;}
  .opt-btn{
    background:var(--sand);
    border:2px solid var(--line);
    border-radius:var(--radius-sm);
    padding:16px 10px;
    font-family:'Atkinson Hyperlegible';
    font-weight:700;font-size:1.1rem;color:var(--ink);
    cursor:pointer;
  }
  .opt-btn:active{transform:scale(0.97);}
  .opt-btn.correct{background:var(--foam);border-color:var(--foam);color:var(--white);}
  .opt-btn.wrong{background:#F1A38B;border-color:var(--coral-dark);color:var(--white);}
  .opt-btn[disabled]{cursor:default;}

  .text-input-row{display:flex;gap:10px;margin-top:18px;}
  .text-input-row input{
    flex:1;font-size:1.2rem;padding:14px 16px;border-radius:var(--radius-sm);
    border:2px solid var(--line);font-family:'Atkinson Hyperlegible';
  }
  .task-badge{font-size:1.9rem;margin-bottom:2px;}
  .task-instr{
    font-family:'Baloo 2';font-weight:700;font-size:1.05rem;color:var(--harbor-dark);
    line-height:1.3;margin-bottom:4px;
  }
  .pic-target{font-size:4.6rem;line-height:1;margin:2px 0 6px;}
  .pic-img{width:4.6rem;height:4.6rem;object-fit:contain;display:block;margin:0 auto;}
  .pic-opt-btn .pic-img{width:2.6rem;height:2.6rem;}
  .pic-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:16px;}
  .pic-options.two{grid-template-columns:1fr 1fr;}
  .pic-opt-btn{
    background:var(--sand);border:2px solid var(--line);border-radius:var(--radius-sm);
    padding:12px 6px;font-size:1.8rem;line-height:1.15;cursor:pointer;
    display:flex;align-items:center;justify-content:center;min-height:80px;
    font-family:'Atkinson Hyperlegible';font-weight:700;color:var(--ink);
    word-break:break-word;
  }
  .pic-opt-btn:active{transform:scale(0.96);}
  .pic-opt-btn.correct{background:var(--foam);border-color:var(--foam);color:var(--white);}
  .pic-opt-btn.wrong{background:#F1A38B;border-color:var(--coral-dark);color:var(--white);}
  .pic-opt-btn[disabled]{cursor:default;}
  .feedback-box{
    margin-top:18px;padding:14px 16px;border-radius:var(--radius-sm);
    font-size:0.95rem;line-height:1.45;text-align:left;
  }
  .feedback-good{background:#E4F4EF;border:2px solid var(--foam);color:#0F5240;}
  .feedback-tip{background:#FDEDE2;border:2px solid var(--coral);color:#7A3512;}

  /* ---------- harbor map ---------- */
  .map-wrap{margin-top:14px;}
  .station{
    display:flex;align-items:center;gap:14px;
    background:var(--white);border:2px solid var(--line);

  .lock-note{font-size:0.78rem;color:#8A7355;margin-top:6px;line-height:1.4;}
  .section-label{font-family:'Baloo 2';font-weight:700;font-size:0.85rem;color:#8A9BA8;margin:16px 0 8px;text-transform:uppercase;letter-spacing:0.03em;}
  .station-icon{
    width:54px;height:54px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;

  .station-body{flex:1;}
  .station-body h3{font-size:1.05rem;}
  .station-body .sub{font-size:0.82rem;color:#5B7280;margin-top:1px;}
  .anchors{margin-top:6px;font-size:0.95rem;letter-spacing:2px;}
  .stars-badge{
    background:var(--sand-deep);border-radius:999px;padding:6px 10px;

  .teacher-panel td,.teacher-panel th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;}
  .badge-level{
    display:inline-block;padding:2px 10px;border-radius:999px;font-weight:700;font-size:0.8rem;

  .overlay{
    position:fixed;inset:0;background:rgba(15,49,69,0.55);
    display:flex;align-items:flex-end;justify-content:center;z-index:10;

  .sheet{
    background:var(--sand);width:100%;max-width:640px;border-radius:24px 24px 0 0;
    padding:22px 20px 30px;max-height:85vh;overflow-y:auto;
  }
  .sheet-close{float:right;background:none;border:none;font-size:1.4rem;color:var(--harbor-dark);cursor:pointer;}
</style>
</head>
<body>
<div id="app"></div>
<div id="ttsNotice" style="display:none;position:fixed;left:12px;right:12px;bottom:12px;background:#0F3145;color:#fff;padding:14px 16px;border-radius:14px;font-family:'Atkinson Hyperlegible';font-size:0.88rem;line-height:1.4;z-index:20;box-shadow:0 4px 18px rgba(0,0,0,0.25);">
  🔈 Auf diesem Gerät/in dieser Ansicht ist keine Sprachausgabe verfügbar. Öffne die Datei direkt im Browser der Vorschau (z. B. Chrome), dann sollte der Lautsprecher-Button funktionieren.
  <button onclick="document.getElementById('ttsNotice').style.display='none'" style="display:block;margin-top:8px;background:#E2672E;border:none;color:#fff;padding:8px 14px;border-radius:999px;font-weight:700;">Verstanden</button>
</div>

<script>
/* ============================================================
   DATENBASIS: Kompetenzbereiche & Aufgabenpools
   Grundlage: phonologische Bewusstheit, Graphem-Phonem-Korrespondenz,
   Lesegenauigkeit/-flüssigkeit, lautorientiertes & orthografisches
   Schreiben (Silben-, Morphem-, Regelstrategien; FRESCH-nahe Tipps:
   Schwingen / Verlängern / Ableiten / Merken)
   ============================================================ */

// Kurze, feste Erklärung je Aufgabentyp – wird angezeigt UND vorgelesen,
// ist aber nie Voraussetzung: die Aufgabe bleibt über Bilder lösbar.
const taskInstructions = {
  '🔁': 'Welches Bild reimt sich?',
  '👏': 'Wie viele Silben hat das Wort?',
  '🎯': 'Welches Bild beginnt mit dem gleichen Laut?',
  '🔡': 'Welchen Laut hörst du am Anfang des Wortes?',
  '🔚': 'Welchen Laut hörst du am Ende des Wortes?',
  '🔤': 'Welches Wort ist richtig geschrieben, so wie du es hörst?',
  '🔠': 'Welcher Kleinbuchstabe klingt genauso wie dieser Großbuchstabe?',
};

// Vertiefung für leistungsstarke Kinder: bewusst NICHT Teil von `domains`,
// damit sie nie in der Hauptübersicht/Sperrlogik auftaucht. Freigeschaltet
// erst, wenn Lesefahrrinne sicher sitzt (gemeistert oder in Auffrischung).
const advancedDomains = [
  {id:'blitzlesen', name:'Blitzbucht', sub:'Wörter blitzschnell erkennen', icon:'⚡', color:'#E8A33D'},
  {id:'lesekompetenz', name:'Krähennest', sub:'Texte verstehen und einordnen', icon:'🔭', color:'#3D6E8A'},
];

function anyDomain(id){
  return domains.find(x=>x.id===id) || advancedDomains.find(x=>x.id===id);
}

function advancedUnlocked(){
  const lesenDomain = domains.find(x=>x.id==='lesen');
  const s = domainStatus(lesenDomain).status;
  return s==='mastered' || s==='review';
}

const domains = [
  {id:'phon', name:'Lauthafen', sub:'Reime, Silben & Laute hören', icon:'🌊', color:'#4FA893'},
  {id:'buchstabe', name:'Buchstabenbrücke', sub:'Laute Buchstaben zuordnen', icon:'🌉', color:'#1B6E7F'},
  {id:'silbendock', name:'Silbendock', sub:'Laute & Silben verschriften', icon:'🪢', color:'#6B8E6B'},
  {id:'lesen', name:'Lesefahrrinne', sub:'Genau & flüssig lesen', icon:'⛵', color:'#E2672E'},
  {id:'schreib1', name:'Schreibwerft', sub:'Wörter lauttreu schreiben', icon:'⚓', color:'#0F3145'},
  {id:'schreib2', name:'Leuchtturm', sub:'Richtig schreiben mit Regeln', icon:'🗼', color:'#F4B93E'},
  {id:'grundwortschatz', name:'Speicherstadt', sub:'Hamburger Grundwortschatz üben', icon:'🧱', color:'#A34A3D'},
  {id:'satzbau', name:'Satzwerft', sub:'Ganze Sätze aus Bildern bauen & schreiben', icon:'🧩', color:'#2E6E8E'},
  {id:'diktat', name:'Flaschenpost', sub:'Sätze diktieren & auf Papier schreiben', icon:'📝', color:'#6E4A8E'},
];

// Entwicklungsstufen (angelehnt an die alphabetische → orthografische
// Strategie): Tier 1 baut auf gesicherter Tier-0-Leistung auf, Tier 2 auf
// gesicherter Tier-1-Leistung. So werden Kinder nicht mit Aufgaben
// konfrontiert, für die die Voraussetzungen fehlen.
const TIERS = {
  phon:0, buchstabe:0, silbendock:0,
  lesen:1, schreib1:1,
  schreib2:2, grundwortschatz:2, satzbau:2,
  diktat:3,
};
// Flaschenpost und Satzwerft brauchen Papier bzw. freie Konstruktion - kein
// Teil der kurzen digitalen Einstiegsdiagnostik. Starten regulär bei Stufe 1,
// sobald sie über die normale Stufen-Freischaltung erreichbar werden.
const diagDomains = domains.filter(d => d.id !== 'diktat' && d.id !== 'satzbau');
const PREREQ_LEVEL = 2;   // Vorstufe muss mind. Stufe 2 erreicht haben
const MASTERY_STARS = 12; // ab so vielen Sternen bei Stufe 3 gilt ein Bereich als gefestigt

function domainStatus(d){
  const tier = TIERS[d.id] || 0;
  if(tier > 0){
    const prereqDomains = domains.filter(x => TIERS[x.id] === tier-1);
    const ready = prereqDomains.every(x => (state.levels[x.id]||1) >= PREREQ_LEVEL);
    if(!ready) return {status:'locked', prereqDomains};
  }
  const lvl = state.levels[d.id]||1, st = state.stars[d.id]||0;
  if(lvl>=3 && st>=MASTERY_STARS){
    const m = state.mastery[d.id];
    if(m && m.nextReviewAt && m.nextReviewAt <= todayStr()) return {status:'review'};
    return {status:'mastered'};
  }
  return {status:'active'};
}

// Silbenbögen wie im Unterricht: ein Bogen pro Silbe, statt abstrakter Punkte.
function silbenbogen(n){
  const w = n*34;
  let arcs = '';
  for(let i=0;i<n;i++){
    const cx = 17 + i*34;
    arcs += `<path d="M ${cx-14} 5 Q ${cx} 23 ${cx+14} 5" stroke="#173142" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 ${w} 26" width="${w}" height="30" style="display:block;margin:0 auto;">${arcs}</svg>`;
}

// Wie silbenbogen(), aber für eine einzelne Silbe mit frei wählbarer Breite -
// wird in Satzwerft unter jede Buchstabengruppe einer Silbe gesetzt.
function syllableArcSpan(width){
  const cx = width/2;
  return `<svg viewBox="0 0 ${width} 24" width="${width}" height="20" style="display:block;">
    <path d="M 4 4 Q ${cx} 21 ${width-4} 4" stroke="#173142" stroke-width="3" fill="none" stroke-linecap="round"/>
  </svg>`;
}

// Kein Standard-Emoji zeigt "nur eine Gabel" (🍴 ist immer Gabel+Messer) oder
// "einen Tisch" als Möbelstück - deshalb eigene, einfache Strichzeichnungen
// (forkIcon/tableIcon). Für die Diktier-Aufgabe "Gabel" in Schreibwerft gibt
// es zusätzlich ein eigenes Foto/Bild (images/gabel.png, siehe renderPicVal
// weiter unten) statt eines mehrdeutigen Emojis.
function forkIcon(size){
  size = size || 44;
  return `<svg viewBox="0 0 40 60" width="${size}" height="${Math.round(size*1.3)}" style="display:inline-block;vertical-align:middle;">
    <rect x="17" y="24" width="6" height="34" rx="2" fill="#5A6B7A"/>
    <rect x="8" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="14" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="20" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <rect x="26" y="2" width="4" height="20" rx="2" fill="#5A6B7A"/>
    <path d="M8 22 Q8 30 20 30 Q32 30 32 22" fill="none" stroke="#5A6B7A" stroke-width="4"/>
  </svg>`;
}
function tableIcon(size){
  size = size || 44;
  return `<svg viewBox="0 0 60 50" width="${size}" height="${Math.round(size*0.83)}" style="display:inline-block;vertical-align:middle;">
    <rect x="4" y="8" width="52" height="8" rx="2" fill="#8B5A2B"/>
    <rect x="8" y="16" width="6" height="28" fill="#8B5A2B"/>
    <rect x="46" y="16" width="6" height="28" fill="#8B5A2B"/>
  </svg>`;
}

// Kindgerechte Lernziel-Erklärung je Bereich und Stufe – wird vor jeder
// Übungssitzung gezeigt, damit klar ist, warum gerade das geübt wird.
// "Ich kann..."-Aussagen für die echte Selbsteinschätzung nach der Sitzung -
// bezogen auf den konkreten Lerngegenstand, nicht auf "hat es gefallen".
const iCanStatements = {
  phon: {
    1:'Ich kann hören, ob sich zwei Wörter reimen, wie viele Silben ein Wort hat und wie es anfängt.',
    2:'Ich kann auch bei kniffligeren Wörtern Reime, Silben und Anfangslaute erkennen.',
    3:'Ich kann schwierige Reime und Anlaute ganz genau heraushören.',
    4:'Ich kann auch bei mehrsilbigen Wörtern und ähnlichen Anlauten wie „Bl" und „Br" genau hinhören.',
  },
  buchstabe: {
    1:'Ich kann hören, mit welchem Buchstaben ein Wort beginnt oder endet.',
    2:'Ich kann ein Wort in seine Buchstaben zerlegen.',
    3:'Ich kann Buchstaben unterscheiden, die leicht verwechselt werden (b, d, p) oder besonders klingen (Qu, Pf, St).',
    4:'Ich kann auch lange, zusammengesetzte Wörter mit mehreren Konsonantenverbindungen sicher lesen.',
  },
  silbendock: {
    1:'Ich kann den ersten Laut eines Wortes aufschreiben.',
    2:'Ich kann den letzten Laut eines Wortes aufschreiben.',
    3:'Ich kann eine Silbe aus einem Wort heraushören und aufschreiben.',
    4:'Ich kann die ersten zwei Silben eines Wortes heraushören und aufschreiben.',
  },
  lesen: {
    1:'Ich kann ähnlich klingende Wörter beim Lesen genau unterscheiden.',
    2:'Ich kann einen kurzen Satz lesen und das passende Wort für die Lücke finden.',
    3:'Ich kann einen längeren Satz lesen und seinen Sinn verstehen.',
    4:'Ich kann auch Sätze mit einem Nebensatz lesen und ihren Sinn verstehen.',
  },
  schreib1: {
    1:'Ich kann einfache Wörter so aufschreiben, wie ich sie höre.',
    2:'Ich kann auch Wörter mit neuen Buchstaben lautgetreu aufschreiben.',
    3:'Ich kann Wörter mit mehreren Konsonanten hintereinander aufschreiben.',
    4:'Ich kann Wörter mit Konsonantenhäufungen am Anfang UND am Ende aufschreiben.',
  },
  schreib2: {
    1:'Ich kann mit dem Schwingen-Trick herausfinden, ob ein Buchstabe verdoppelt wird.',
    2:'Ich kann mit dem Verlängern-Trick den richtigen Buchstaben am Wortende finden.',
    3:'Ich kann mit dem Ableiten-Trick schwierige Wortbausteine richtig schreiben.',
    4:'Ich kann auch lange zusammengesetzte Wörter und einige Merkwörter richtig schreiben.',
  },
  grundwortschatz: {
    1:'Ich kann wichtige Wörter aus dem Grundwortschatz richtig schreiben.',
    2:'Ich kann Wörter mit Doppellauten oder doppelten Buchstaben richtig schreiben.',
    3:'Ich kann auch kniffligere Grundwortschatz-Wörter mit meinen Tricks richtig schreiben.',
    4:'Ich kann auch längere Wörter und die das/dass-Regel richtig anwenden.',
  },
  blitzlesen: {
    1:'Ich kann kurze, bekannte Wörter blitzschnell erkennen.',
    2:'Ich kann auch längere, zusammengesetzte Wörter schnell lesen.',
    3:'Ich kann auch lange und ungewöhnliche Wörter blitzschnell erfassen.',
    4:'Ich kann auch sehr lange Wörter in kürzester Zeit erfassen.',
  },
  lesekompetenz: {
    1:'Ich kann eine kurze Geschichte lesen und eine direkte Frage dazu beantworten.',

// Handgeprüfte Silbentrennung für alle Wörter, die in den Satzwerft-Körben
// vorkommen - bewusst nicht automatisch erraten (Silbentrennung im
// Deutschen hat zu viele Ausnahmen für eine zuverlässige Faustregel).
// Wörter ohne Eintrag gelten als einsilbig (ein Bogen über das ganze Wort).
const wordSyllables = {
  der:['der'], die:['die'], das:['das'], im:['im'], in:['in'], zu:['zu'], am:['am'],
  junge:['Jun','ge'], mädchen:['Mäd','chen'], hund:['Hund'], katze:['Kat','ze'],
  oma:['O','ma'], opa:['O','pa'], papa:['Pa','pa'],
  lacht:['lacht'], rennt:['rennt'], schläft:['schläft'], singt:['singt'],
  isst:['isst'], liest:['liest'], spielt:['spielt'], malt:['malt'],
  spaziert:['spa','ziert'], baut:['baut'], backt:['backt'],
  fröhlich:['fröh','lich'], geduldig:['ge','dul','dig'], aufgeregt:['auf','ge','regt'],
  glücklich:['glück','lich'], ruhig:['ru','hig'], stolz:['stolz'],
  garten:['Gar','ten'], schule:['Schu','le'], hause:['Hau','se'],
  bett:['Bett'], park:['Park'], zimmer:['Zim','mer'], küche:['Kü','che'], auto:['Au','to'],
};
function syllablesFor(word){
  const clean = word.replace(/[.,!?]/g,'');
  return wordSyllables[clean.toLowerCase()] || [clean];
}
function isVowel(letter){
  return 'aeiouäöüAEIOUÄÖÜ'.includes(letter);
}

// Zerlegt ein Wort in seine tatsächlichen Lautbausteine, passend zu den
// aufgenommenen Dateien (SCH.m4a, CH1.m4a, AU.m4a, einzelne Buchstaben...).
// Nur Verbindungen, für die wir eine echte Aufnahme haben, werden als ein
// Baustein erkannt - alles andere zerfällt automatisch in Einzelbuchstaben
// (für die wir durchgehend Aufnahmen haben), nie in eine geratene TTS-Lesung.
function tokenizeSyllable(syl, prevChar, isLastSyllable){
  const lower = syl.toLowerCase();
  const tokens = [];
  let i = 0;
  while(i < lower.length){
    const rest = lower.slice(i);
    let len = 1, key = null;
    if(rest.startsWith('sch')){ len=3; key='SCH'; }
    else if(rest.startsWith('ch')){
      // Ach-Laut (CH1) nach a/o/u, sonst Ich-Laut (CH2). Bei Silbenanfang
      // zählt der letzte Buchstabe der VORHERIGEN Silbe (z.B. "Bau-ch").
      const prev = i>0 ? lower[i-1] : (prevChar||'');
      len=2; key = ['a','o','u'].includes(prev) ? 'CH1' : 'CH2';
    }
    else if(rest.startsWith('sp')){ len=2; key='SP'; }
    else if(rest.startsWith('pf')){ len=2; key='PF'; }
    else if(rest.startsWith('ck')){ len=2; key='CK'; }
    else if(rest.startsWith('tz')){ len=2; key='TZ'; }
    else if(rest.startsWith('qu')){ len=2; key='QU'; }
    else if(rest.startsWith('ng')){ len=2; key='NG'; }
    else if(rest.startsWith('äu')){ len=2; key='AEU'; }
    else if(rest.startsWith('eu')){ len=2; key='EU'; }
    else if(rest.startsWith('au')){ len=2; key='AU'; }
    else if(rest.startsWith('ei')){ len=2; key='EI'; }
    else if(rest.startsWith('ie')){ len=2; key='IE'; }
    else if(rest[0]==='ä'){ len=1; key='AE'; }
    else if(rest[0]==='ö'){ len=1; key='OE'; }
    else if(rest[0]==='ü'){ len=1; key='UE'; }
    else if(rest[0]==='y'){
      // y als Konsonant am Wortanfang (wie Yak) vs. als Vokal am echten Wortende (wie Teddy)
      len=1; key = (isLastSyllable && i === lower.length-1) ? 'Y1' : 'Y';
    }
    else if(rest[0]==='e' && isLastSyllable && i === lower.length-1){
      len=1; key='-E'; // unbetontes Endungs-e am ECHTEN Wortende, z.B. Blume - nicht bei einer Mittelsilbe wie "ge" in "auf-ge-regt"
    }
    else if(/[a-zß]/.test(rest[0])){
      len=1; key = rest[0].toUpperCase();
    }
    else {
      len=1; key=null;
    }
    tokens.push({text: syl.slice(i, i+len), key});
    i += len;
  }
  return tokens;
}

// Zerlegt ein Wort in Lautbausteine - Silbe für Silbe getrennt (anhand der
// handgeprüften Silbentrennung), damit z.B. bei "Jun-ge" kein "ng" über die
// Silbengrenze hinweg fälschlich erkannt wird. Rückgabe: eine Liste von
// Silben, jede als Liste ihrer Lautbausteine.
function tokenizeWordToSounds(word){
  const clean = (word||'').replace(/[.,!?]/g,'');
  const syls = syllablesFor(clean);
  const groups = [];
  let prevChar = '';
  syls.forEach((syl,idx)=>{
    groups.push(tokenizeSyllable(syl, prevChar, idx === syls.length-1));
    const lowerSyl = syl.toLowerCase();
    prevChar = lowerSyl[lowerSyl.length-1] || '';
  });
  return groups;
}

// Vokal-artige Laute bekommen die Königsbuchstabe-Krone, Konsonanten(-verbindungen) nicht.
function isVowelSoundKey(key){
  return ['A','E','I','O','U','AE','OE','UE','AU','AEU','EU','EI','IE','-E','Y1'].includes(key);
}

// Ordnet die Lautbausteine eines Wortes den (handgeprüften) Silben zu, damit
// der Silbenbogen weiterhin über der richtigen Buchstabengruppe sitzt.

// Zentrale, robuste Audio-Wiedergabe für alle aufgenommenen Laute: probiert
// zuerst die Schreibweise genau wie übergeben, dann komplett klein - GitHub
// unterscheidet bei Dateinamen Groß-/Kleinschreibung, das fängt eine
// abweichende Schreibweise beim Hochladen automatisch ab. onDone(true) heißt
// "hat abgespielt" (Ende abgewartet), onDone(false) heißt "beide Versuche
// fehlgeschlagen, nichts wurde abgespielt".
function playAudioKey(key, onDone){
  const variants = [key + '.m4a', key.toLowerCase() + '.m4a'];
  let i = 0;
  function tryNext(){
    if(i >= variants.length){ if(onDone) onDone(false); return; }
    const src = variants[i]; i++;
    try{
      const audio = new Audio(src);
      currentAudioEl = audio;
      let handled = false;
      audio.addEventListener('error', ()=>{ if(!handled){ handled=true; tryNext(); } });
      audio.addEventListener('ended', ()=>{ if(!handled){ handled=true; if(onDone) onDone(true); } });
      const p = audio.play();
      if(p && typeof p.catch === 'function'){ p.catch(()=>{ if(!handled){ handled=true; tryNext(); } }); }
    }catch(e){ tryNext(); }
  }
  tryNext();
}

// Spielt den Laut-Baustein ab; probiert dabei automatisch beide
// Schreibweisen des Dateinamens (GitHub ist groß-/kleinschreibungsempfindlich),
// bevor sicherheitshalber das ganze Wort normal vorgelesen wird.
window.playSoundToken = function(key, wholeWord){
  if(!key){ speak(wholeWord); return; }
  playAudioKey(key, (ok)=>{ if(!ok) speak(wholeWord); });
};

// Diagnostik nutzt gezielt: erstes Item aus Stufe 2 (Einstieg), dann
// Stufe 3 (bei Erfolg) bzw. Stufe 1 (bei Misserfolg) zur Einordnung.
function diagItem(domainId, level, usedSet){
  const pool = (domainId==='silbendock' ? diagSilbendock[level] : content[domainId][level]) || [];
  const candidates = usedSet ? pool.filter(i => !usedSet.has(i)) : pool;
  const choices = candidates.length ? candidates : pool;
  const original = choices[Math.floor(Math.random()*choices.length)];
  if(usedSet) usedSet.add(original);
  return original;
}

// Grobe, aber ausreichende Wochenkennung für die Verlaufsanzeige (muss
// nicht dem exakten ISO-Kalender entsprechen, nur wochenweise eindeutig sein).
function weekKey(date){
  const localMs = date.getTime() - date.getTimezoneOffset()*60000;
  return 'W' + Math.floor(localMs/86400000/7);
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return d.toISOString().slice(0,10);
}

const STORAGE_KEY = 'buchstabenhafen_progress_v1';
function saveProgress(){
  const now = new Date();
  const wk = weekKey(now);
  const snapshot = {week:wk, date:now.toISOString().slice(0,10), levels:{...state.levels}, stars:{...state.stars}};
  const history = state.history || [];
  if(history.length && history[history.length-1].week === wk){
    const prevNote = history[history.length-1].note;
    history[history.length-1] = prevNote ? {...snapshot, note:prevNote} : snapshot;
  } else {
    history.push(snapshot);
  }
  state.history = history.slice(-26); // max. ca. ein halbes Jahr
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      levels: state.levels, stars: state.stars, diagDone: !!state.diagDone, history: state.history,
      errorCounts: state.errorCounts, attemptLogs: state.attemptLogs,
      mastery: state.mastery, selfChecks: state.selfChecks,
      needsBasicLetterDrill: state.needsBasicLetterDrill,
      diagReports: state.diagReports, wordStore: state.wordStore, errorProfile: state.errorProfile, discoverSeen: state.discoverSeen,
      childLabel: state.childLabel, className: state.className,
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const d = JSON.parse(raw);
      state.levels = d.levels || {};
      state.stars = d.stars || {};
      state.diagDone = !!d.diagDone;
      state.history = d.history || [];
      state.errorCounts = d.errorCounts || {};
      state.attemptLogs = d.attemptLogs || {};
      state.mastery = d.mastery || {};
      state.selfChecks = d.selfChecks || [];
      state.needsBasicLetterDrill = !!d.needsBasicLetterDrill;
      state.diagReports = d.diagReports || [];
      state.wordStore = d.wordStore || [];
      state.errorProfile = d.errorProfile || {};
      state.discoverSeen = d.discoverSeen || {};
      state.childLabel = d.childLabel || '';
      state.className = d.className || '';
    }
  }catch(e){}
}

window.exportData = function(){
  const payload = {
    levels: state.levels, stars: state.stars, diagDone: !!state.diagDone, history: state.history,
    errorCounts: state.errorCounts, attemptLogs: state.attemptLogs,
    mastery: state.mastery, selfChecks: state.selfChecks,
    needsBasicLetterDrill: state.needsBasicLetterDrill,
    diagReports: state.diagReports, wordStore: state.wordStore, errorProfile: state.errorProfile, discoverSeen: state.discoverSeen,
    childLabel: state.childLabel, className: state.className,
    exportedAt: new Date().toISOString(),
  };
  try{
    const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'buchstabenhafen-sicherung-' + todayStr() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);

window.importData = function(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const d = JSON.parse(e.target.result);
      if(!d || typeof d !== 'object' || !d.levels){
        alert('Diese Datei sieht nicht wie eine Buchstabenhafen-Sicherung aus.');
        return;
      }
      state.levels = d.levels || {};
      state.stars = d.stars || {};
      state.diagDone = !!d.diagDone;
      state.history = d.history || [];
      state.errorCounts = d.errorCounts || {};
      state.attemptLogs = d.attemptLogs || {};
      state.mastery = d.mastery || {};
      state.selfChecks = d.selfChecks || [];
      state.needsBasicLetterDrill = !!d.needsBasicLetterDrill;
      state.diagReports = d.diagReports || [];
      state.wordStore = d.wordStore || [];
      state.errorProfile = d.errorProfile || {};
      state.discoverSeen = d.discoverSeen || {};
      state.childLabel = d.childLabel || '';
      state.className = d.className || '';
      saveProgress();

      state.screen = 'start';
      render();

  reader.readAsText(file);
};

let ttsWarned = false;
let cachedVoices = [];
function refreshVoices(){
  try{ cachedVoices = window.speechSynthesis.getVoices() || []; }catch(e){}
}
if('speechSynthesis' in window){
  try{
    refreshVoices();
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }catch(e){}
}
// Silbentrennungs-Bindestriche (z.B. "Schmet-ter-ling") sind zum SEHEN
// gedacht, sollen aber nicht mitgesprochen werden - sonst verfälscht das
// die Aussprache. Der Gedankenstrich "–" (z.B. "Löwe – Löffel") bleibt
// unangetastet, das ist ein anderes Zeichen.
function stripSyllableHyphens(text){
  return (text||'').replace(/([a-zA-ZäöüÄÖÜß])-(?=[a-zA-ZäöüÄÖÜß])/g, '$1');
}

// Echte Sprachaufnahmen für isolierte Laute (z.B. "A.m4a", "V1.m4a") -
// umgehen das TTS-Problem komplett, weil eine Audiodatei einfach abspielt,
// was aufgenommen wurde, ohne über Text-Ausspracheregeln zu gehen. Fehlt
// eine Datei oder schlägt die Wiedergabe fehl, fällt es automatisch auf die
// normale Sprachausgabe (das ganze Wort) zurück - nichts bricht ab.
// Spielt die Aufnahme des isolierten Lauts ab und spricht danach das ganze
// Wort - wartet auf das tatsächliche Ende der Aufnahme (kein geratenes Timing).
function playLetterSoundThenWord(key, word){
  if(!key){ speak(word); return; }
  playAudioKey(key, ()=>{ speak(word); });
}


function speak(text, rate){
  text = stripSyllableHyphens(text);
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    warnNoTts();
    return;
  }
  try{
    refreshVoices();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=rate||0.95;
    const deVoices = cachedVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('de'));
    const enhancedVoice = deVoices.find(v=>/enhanced|premium|neural/i.test(v.name||''));
    if(enhancedVoice) u.voice = enhancedVoice;
    // Ohne besonders gekennzeichnete Stimme: keine Stimme fest vorgeben,
    // damit der Browser/das Betriebssystem seine eigene Standardauswahl
    // für "de-DE" trifft - das entspricht eher der auf dem Gerät
    // eingestellten Stimme, als wenn wir selbst irgendeine erzwingen.
    let started = false;
    u.onstart = ()=>{ started = true; };
    u.onerror = ()=>{ warnNoTts(); };
    window.speechSynthesis.speak(u);
    // Manche eingebetteten WebViews melden weder Fehler noch Start.
    setTimeout(()=>{ if(!started) warnNoTts(); }, 1200);
  }catch(e){
    warnNoTts();
  }
}
function warnNoTts(){
  if(ttsWarned) return;
  ttsWarned = true;
  const el = document.getElementById('ttsNotice');
  if(el) el.style.display='block';
}

window.speakCurrent = function(){
  let item = null;
  if(state.screen==='diagnose') item = state.diag.current;
  else if(state.screen==='practice') item = state.practice.current;
  else if(state.screen==='letterdrill') item = state.drill.current;
  if(!item) return;
  if(item.type==='pic'){
    const instr = taskInstructions[item.taskIcon] || '';
    speak(instr + (instr ? '. ' : '') + item.speak);
  } else if(item.type==='input' || item.type==='silbchoice'){
    speak(item.prompt);
    speak(item.speak, 0.7);
  } else {
    speak(item.speak);
  }
};


function checkAnswer(item, given){
  if(item.type==='choice' || item.type==='pic' || item.type==='flash' || item.type==='silbchoice') return given===item.answer;
  if(item.type==='dictate') return given===0;
  if(item.type==='satzbau') return given===0;
  const norm = s => (s||'').toString().trim().toLowerCase().replace(/ß/g,'ss');
  return norm(given)===norm(item.answer).replace(/ß/g,'ss');
}

function screenDiagnose(){
  const d = diagDomains[state.diag.domainIndex];
  const item = state.diag.current;
  const totalSteps = diagDomains.length*3;
  const stepOf = {mid:0, high:1, low:1, confirm:2};
  const doneSteps = state.diag.domainIndex*3 + (stepOf[state.diag.stage]||0);
  const pct = Math.round((doneSteps/totalSteps)*100);

  const skipBtn = `<button class="btn btn-ghost" style="margin-top:14px;font-size:0.95rem;" onclick="diagDontKnow()">🤷 Weiß ich nicht</button>`;

  return `

function escJs(s){ return (s||'').replace(/'/g,"\\'"); }

window.diagDontKnow = function(){
  // Garantiert falsch (kein Options-Index und kein echtes Wort kann diesem
  // Wert entsprechen) - zählt bewusst als Fehler, damit Raten bei zu
  // schweren Aufgaben die Diagnose nicht verfälscht.
  window.diagAnswer('__SKIP__');
};

window.diagAnswer = function(given){
  const d = diagDomains[state.diag.domainIndex];
  const item = state.diag.current;
  const correct = checkAnswer(item, given);
  if(given==='__SKIP__' && d.id==='buchstabe'){
    state.diag.buchstabeSkipped = true;
  }
  const dr = state.diag.domainResults[d.id] = state.diag.domainResults[d.id] || {};

  if(state.diag.stage==='mid'){
    dr.mid = {item, correct};
    state.diag.midCorrect = correct;
    const nextLevel = correct ? 3 : 1;
    state.diag.stage = correct ? 'high' : 'low';
    state.diag.current = shuffleOptions(diagItem(d.id, nextLevel, state.diag.usedItems));
    state.diag.currentLevel = nextLevel;
    render();
    return;
  }
  if(state.diag.stage==='high' || state.diag.stage==='low'){
    dr.second = {item, correct};
    let tentative;
    if(state.diag.midCorrect && correct) tentative=3;
    else if(state.diag.midCorrect && !correct) tentative=2;
    else if(!state.diag.midCorrect && correct) tentative=2;
    else tentative=1;
    state.diag.tentativeLevel = tentative;
    state.diag.stage = 'confirm';
    state.diag.current = shuffleOptions(diagItem(d.id, tentative, state.diag.usedItems));
    state.diag.currentLevel = tentative;
    render();
    return;
  }
  // Bestätigungs-Item: fängt einen Glückstreffer/Ausrutscher der ersten
  // beiden Items ab, bevor die Stufe endgültig feststeht.
  dr.confirm = {item, correct};
  let level = state.diag.tentativeLevel;
  if(!correct) level = Math.max(1, level-1);
  dr.level = level;
  state.levels[d.id] = level;
  delete state.attemptLogs[d.id]; // alte Versuchsdaten passen ggf. nicht mehr zur neuen Stufe

  state.diag.domainIndex++;
  if(state.diag.domainIndex>=diagDomains.length){
    state.diagDone = true;
    if(state.levels.buchstabe === 1 || state.diag.buchstabeSkipped){
      state.needsBasicLetterDrill = true;
    }
    state.diagReports = state.diagReports || [];
    state.diagReports.push({date: todayStr(), results: state.diag.domainResults});
    state.diagReports = state.diagReports.slice(-10);
    saveProgress();
    state.screen = 'diagreport';
    render();
    return;
  }
  state.diag.stage='mid';
  state.diag.midCorrect=null;
  const nd = diagDomains[state.diag.domainIndex].id;
  state.diag.current = shuffleOptions(diagItem(nd, 2, state.diag.usedItems));
  state.diag.currentLevel = 2;
  render();
};

    const lvl = state.levels[d.id]||1;

    const cls = 'station' + (info.status==='locked' ? ' locked' : info.status==='mastered' ? ' mastered' : info.status==='review' ? ' review' : '');
    const onclick = info.status==='locked' ? '' : `onclick="openDomain('${d.id}')"`;

const CORRECT_PHRASES = ['Richtig! Weiter so!', 'Super!', 'Toll gemacht!', 'Spitze!', 'Du bist richtig gut!', 'Klasse!', 'Genau richtig!', 'Prima, das stimmt!'];
function randomCorrectPhrase(){
  return CORRECT_PHRASES[Math.floor(Math.random()*CORRECT_PHRASES.length)];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Antwortoptionen jedes Mal neu mischen, statt immer in derselben
// Reihenfolge zu zeigen - sonst lernen Kinder "die richtige Antwort ist
// immer links", statt die Aufgabe wirklich zu lösen.
function shuffleOptions(item){
  if(!item || !item.options || item.options.length < 2) return item;
  const idx = item.options.map((_,i)=>i);
  const order = shuffle(idx);
  const newOptions = order.map(i=>item.options[i]);
  const newAnswer = order.indexOf(item.answer);
  return {...item, options:newOptions, answer:newAnswer};
}

function pickPracticeItem(){
  const p = state.practice;
  if(!p.queue || p.queue.length === 0){
    const pool = content[p.domainId][p.level];
    let shuffled = shuffle(pool);
    if(p.current && shuffled[0]===p.current && shuffled.length>1){
      [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
    }
    p.queue = shuffled;
  }
  p.current = shuffleOptions(p.queue.shift());
  p.answered=false;
  p.message=null;
  if(p.current && p.current.type==='flash'){
    startFlashCountdown();
  } else {
    clearFlashInterval();
  }
  if(p.current && p.current.type==='dictate'){
    p.dictatePhase = 'listen';
    p.markedWords = p.current.sentence.split(' ').map(()=>false);
  }
  if(p.current && p.current.type==='satzbau'){
    p.sbStep = 'build';
    p.sbSelections = [];
    p.sbBasketIndex = 0;
    p.sbWordIndex = 0;
    p.sbMarked = [];
  }
  if(p.current && p.current.type==='wordstudy'){
    p.wsPhase = 'study';
    p.wsShowPicture = false;
    p.wsTokens = [];
  }
}

// Spielt einen Laut ab (echte Aufnahme, sonst TTS-Rückfall auf das ganze
// Wort) und ruft danach onDone auf - damit sich mehrere Laute nacheinander
// automatisch abspielen lassen ("Laut für Laut").
function playTokenSequenced(key, wholeWord, onDone){
  if(!key){ speakSequenced(wholeWord, onDone); return; }
  playAudioKey(key, (ok)=>{
    if(ok){ if(onDone) onDone(); }
    else { speakSequenced(wholeWord, onDone); }
  });
}
function speakSequenced(text, onDone){
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    warnNoTts(); if(onDone) onDone(); return;
  }
  try{
    const u = new SpeechSynthesisUtterance(stripSyllableHyphens(text));
    u.lang='de-DE'; u.rate=0.75;
    const deVoices = cachedVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('de'));
    const enhancedVoice = deVoices.find(v=>/enhanced|premium|neural/i.test(v.name||''));
    if(enhancedVoice) u.voice = enhancedVoice;
    let done = false;
    const finish = ()=>{ if(!done){ done=true; if(onDone) onDone(); } };
    u.onend = finish; u.onerror = finish;
    window.speechSynthesis.speak(u);
    setTimeout(finish, 4000); // Sicherheitsnetz, falls onend nie feuert
  }catch(e){ if(onDone) onDone(); }
}

// Spielt bei einem neuen Wort automatisch jeden Laut nacheinander ab und
// liest danach das ganze Wort einmal am Stück vor.
function autoPlayWordSounds(){
  const p = state.practice;
  const tokens = p.sbTokens || [];
  const wholeWord = sentenceWords()[p.sbWordIndex] || '';
  let i = 0;
  function playNext(){
    if(i >= tokens.length){ speak(wholeWord); return; }
    const tok = tokens[i]; i++;
    playTokenSequenced(tok.key, wholeWord, playNext);
  }
  playNext();
}

window.startCategoryReview = function(category){
  const pool = [];
  ['schreib2','grundwortschatz'].forEach(domId=>{
    [1,2,3].forEach(lvl=>{
      (content[domId][lvl]||[]).forEach(it=>{
        if(it.errorCategory === category) pool.push(it);
      });
    });
  });
  if(pool.length === 0) return;
  const items = shuffle(pool).slice(0, Math.min(6, pool.length));
  state.practice = {
    domainId:'schreib2', level: state.levels.schreib2||1, isWordReview:true,
    sessionTarget: items.length, sessionErrors:0,
    attemptLog:[], queue: items.slice(1),
    itemsDone:0, answered:false, lastCorrect:null, current: shuffleOptions(items[0]),
    levelUpMsg:null, levelDownMsg:null, reviewCategory: category,
  };
  state.errorProfile[category] = 0; // frisch beginnen, sobald gezielt geübt wird
  state.screen='practice';
  render();
  speak('Gezieltes Üben: ' + (ERROR_CATEGORIES[category]||category));

      <p style="font-size:0.95rem;color:#4B6473;text-align:center;margin-top:8px;">Richtig geschrieben: <strong>${item.answer}</strong></p>`;
  }
  if(item.type==='satzbau'){
    const p = state.practice;
    const words = sentenceWords();
    const wordSpans = words.map((w,i)=>{
      const marked = p.sbMarked && p.sbMarked[i];
      return marked ? `<span style="color:var(--coral-dark);text-decoration:underline;">${w}</span>` : w;
    }).join(' ');
    return `
      <div class="task-instr">📝 Dein Vergleich:</div>
      <p style="font-size:1.3rem;font-family:'Baloo 2';font-weight:600;margin-top:10px;line-height:1.6;">${wordSpans}</p>`;
  }
  if(item.type==='dictate'){
    const words = item.sentence.split(' ');
    const p = state.practice;
    const wordSpans = words.map((w,i)=>{
      const marked = p.markedWords && p.markedWords[i];
      return marked ? `<span style="color:var(--coral-dark);text-decoration:underline;">${w}</span>` : w;
    }).join(' ');
    return `
      <div class="task-instr">📝 Dein Vergleich:</div>
      <p style="font-size:1.3rem;font-family:'Baloo 2';font-weight:600;margin-top:10px;line-height:1.6;">${wordSpans}</p>`;
  }
  if(item.type==='flash'){
    const cls = item.options.length<=2 ? 'pic-options two' : 'pic-options';
    return `
      <div class="task-instr">⚡ Lies das Wort schnell, dann tippe das passende Bild an!</div>
      <div class="pic-target" style="font-family:'Baloo 2';font-size:2.4rem;">${item.word}</div>
      <div class="${cls}">${item.options.map((opt,i)=>{
        let cls2='pic-opt-btn';
        if(i===item.answer) cls2+=' correct';
        else if(i===given) cls2+=' wrong';
        return `<button class="${cls2}" disabled>${opt}</button>`;
      }).join('')}</div>`;
  }
  if(item.type==='pic'){
    const cls = item.options.length<=2 ? 'pic-options two' : 'pic-options';
    return `
      <div class="task-instr">${item.taskIcon} ${taskInstructions[item.taskIcon]||''}</div>
      <div class="pic-target">${renderPicVal(item.targetEmoji)}</div>
      <button class="speak-btn" onclick="speakCurrent()">🔊</button>
      <div class="${cls}">${item.options.map((opt,i)=>{
        let cls2='pic-opt-btn';
        if(i===item.answer) cls2+=' correct';
        else if(i===given) cls2+=' wrong';
        return `<button class="${cls2}" disabled>${renderPicVal(opt)}</button>`;
      }).join('')}</div>`;
  }
  let body = '';
  if(item.pictureEmoji) body += `<div class="pic-target">${renderPicVal(item.pictureEmoji)}</div>`;
  body += `<div class="prompt-text">${item.prompt}</div>`;
  body += `<button class="speak-btn" onclick="speakCurrent()">🔊</button>`;
  if(item.type==='choice'){
    const cls = item.options.length<=2 ? 'options single' : 'options';
    body += `<div class="${cls}">` + item.options.map((opt,i)=>{
      let cls2='opt-btn';
      if(i===item.answer) cls2+=' correct';
      else if(i===given) cls2+=' wrong';
      return `<button class="${cls2}" disabled>${opt}</button>`;
    }).join('') + `</div>`;
  } else {
    body += `<div class="text-input-row"><input type="text" disabled value="${escHtml(given||'')}"></div>`;
  }
  return body;
}

function escHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML.replace(/"/g,'&quot;');
}

// Ortsgenaues Feedback statt nur "falsch": zeigt, WO der Fehler liegt
// (zu kurz/zu lang/ab welcher Stelle), ohne die Lösung zu verraten.
// Substep-Feedback wirkt laut VanLehn (2011) deutlich stärker als reines
// Richtig/Falsch-Feedback.
function diffHint(given, correct){
  const g = (given||'').trim().toLowerCase();
  const c = (correct||'').trim().toLowerCase();
  if(g.length === 0) return 'Da steht noch nichts – trau dich, etwas einzutippen!';
  if(g.length < c.length) return 'Dein Wort hat noch zu wenige Buchstaben.';
  if(g.length > c.length) return 'Dein Wort hat zu viele Buchstaben.';
  for(let i=0; i<g.length; i++){
    if(g[i] !== c[i]){
      if(i===0) return 'Schau dir noch mal den Anfang des Wortes an.';
      return `Die ersten ${i} Buchstaben stimmen schon – schau dir den Rest noch mal genau an.`;
    }
  }
  return '';
}

window.practiceAnswer = function(given){
  clearFlashInterval();
  const p = state.practice;
  const item = p.current;
  const correct = checkAnswer(item, given);
  p.answered = true;
  p.lastCorrect = correct;
  p.lastGiven = given;
  p.itemsDone++;
  p.levelUpMsg=null; p.levelDownMsg=null;
  p.correctPhrase = randomCorrectPhrase();
  if(!correct) p.sessionErrors = (p.sessionErrors||0) + 1;

  p.attemptLog.push(correct);
  if(p.attemptLog.length > 12) p.attemptLog.shift();

  if(p.isWordReview){
    // Wortspeicher-Wiederholung: eigene, einfache Logik statt Phonemstufen.
    if(item.storeKey){
      const entry = state.wordStore.find(w=>w.word.toLowerCase()===item.storeKey);
      if(entry){
        if(correct){
          entry.streak = (entry.streak||0) + 1;
          if(entry.streak >= 2){
            state.wordStore = state.wordStore.filter(w=>w!==entry);
          }
        } else {
          entry.streak = 0;
        }
      }
    }
  } else {
    if(correct){
      state.stars[p.domainId] = (state.stars[p.domainId]||0)+1;
    } else {
      state.errorCounts[p.domainId] = (state.errorCounts[p.domainId]||0)+1;
      if(item.errorCategory){
        state.errorProfile[item.errorCategory] = (state.errorProfile[item.errorCategory]||0) + 1;
      }
    }

    let levelChanged = false;
    // Aufstieg erst, wenn genug geübt wurde UND die Fehlerquote zuletzt
    // erkennbar niedrig ist – reines Raten reicht nicht mehr aus.
    if(p.level<4 && p.attemptLog.length>=8){
      const lastSix = p.attemptLog.slice(-6);
      if(lastSix.filter(x=>!x).length<=1){
        p.level++;
        p.attemptLog=[]; p.queue=[];
        levelChanged = true;
        p.levelUpMsg = '⬆️ Klasse gemacht – du gehst eine Stufe hoch! ' + (levelGoals[p.domainId]||{})[p.level];
      }
    }
    if(!levelChanged && p.level>1 && !correct){
      const lastFour = p.attemptLog.slice(-4);
      if(lastFour.filter(x=>!x).length>=3){
        p.level--;
        p.attemptLog=[]; p.queue=[];
        p.levelDownMsg = '⬇️ Wir gehen eine Stufe zurück und üben das erst noch etwas.';
        delete state.mastery[p.domainId]; // war ggf. gemeistert, ist es jetzt nicht mehr
      }
    }
    state.levels[p.domainId] = p.level;
    state.attemptLogs[p.domainId] = {level:p.level, log:p.attemptLog};

    // Erstmalig gemeistert? Dann in zwei Wochen zur Auffrischung wieder vorlegen.
    const dObj = domains.find(x=>x.id===p.domainId);
    if(dObj && domainStatus(dObj).status==='mastered' && !state.mastery[p.domainId]){
      state.mastery[p.domainId] = {nextReviewAt: addDays(todayStr(), 14)};
    }
  }

  if(correct){
    speak(p.levelUpMsg ? (p.correctPhrase + ' ' + p.levelUpMsg) : p.correctPhrase);
  } else if(item.type==='dictate'){
    speak('Okay, dieses Wort hast du noch nicht ganz richtig geschrieben. Das üben wir einfach noch mal.' + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(item.type==='satzbau'){
    speak('Okay, dein Satz war noch nicht ganz richtig geschrieben. Das üben wir einfach noch mal.' + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(given==='__SKIP__'){
    speak('Kein Problem, das lernst du noch! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(item.type==='input'){
    const hint = diffHint(given, item.answer);
    speak('Das war leider noch nicht richtig. ' + hint + ' Versuche es noch einmal, das schaffst du! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else {
    speak('Das war leider noch nicht richtig. Versuche es noch einmal, das schaffst du! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  }

  saveProgress();
  render();
};

window.nextPracticeItem = function(){
  const p = state.practice;
  state.levels[p.domainId] = p.level;
  const target = p.sessionTarget || 6;
  if(p.itemsDone >= target){
    if(p.isWordReview){
      saveProgress();
      state.screen = 'map';
      render();
      return;
    }
    if(p.isReview){
      const today = todayStr();
      if(p.level>=3){
        state.mastery[p.domainId] = { nextReviewAt: addDays(today, (p.sessionErrors||0)<=1 ? 14 : 3) };
      } else {
        delete state.mastery[p.domainId]; // während der Auffrischung zurückgestuft
      }
      saveProgress();
    }
    state.pendingSelfCheck = {domainId:p.domainId, level:p.level, errors:p.sessionErrors||0, items:p.itemsDone};
    state.screen='selfcheck';
    render();
    speakSelfCheck();

  render();
};

function drillPool(){

const DRILL_OFFER_TEXT = 'Lotse Lumi schlägt vor: ein kurzes Buchstaben-Training, weil einige Buchstaben-Laute noch unsicher wirken. Das hilft, bevor es mit den Stationen weitergeht.';

window.startLetterDrill = function(){
  const all = drillPool();
  const nikoWords = shuffle(all.filter(i=>i.niko));
  const otherWords = shuffle(all.filter(i=>!i.niko));
  const pool = [...nikoWords, ...otherWords];
  state.drill = {
    queue: pool, current:null, answered:false, lastGiven:null, lastCorrect:null,
    initialCount: pool.length, doneCount:0, wrongAttempts:{}, flagged:[],
  };
  pickDrillItem();
  state.screen = 'letterdrill';
  render();
};

function pickDrillItem(){
  const d = state.drill;
  if(d.queue.length === 0){
    state.needsBasicLetterDrill = false;
    saveProgress();
    state.screen = 'drilldone';
    return;
  }
  d.current = shuffleOptions(d.queue.shift());
  d.answered = false;
  d.lastGiven = null;
}

window.drillAnswer = function(given){
  const d = state.drill;
  const item = d.current;
  const correct = checkAnswer(item, given);
  d.answered = true; d.lastGiven = given; d.lastCorrect = correct;
  const letter = item.options[item.answer];
  // Erst die echte Aufnahme des isolierten Lauts (z.B. "M.m4a"), danach das
  // ganze Wort - wartet auf das tatsächliche Ende der Aufnahme.
  const audioKey = item.audioKey || letter.toUpperCase();
  playLetterSoundThenWord(audioKey, item.speak);
  if(correct){
    d.doneCount++;
  } else {
    const key = item.speak;
    d.wrongAttempts[key] = (d.wrongAttempts[key]||0) + 1;
    if(d.wrongAttempts[key] < 4){
      d.queue.push(item); // nochmal hinten anstellen, bis es sitzt
    } else {
      d.flagged.push(letter + ' (' + item.speak + ')');
    }
  }
  render();
};

window.nextDrillItem = function(){
  pickDrillItem();
  render();
  if(state.screen==='drilldone') speakDrillDone();
};

function screenLetterDrill(){
  const d = state.drill;

// Kleines SVG-Balkendiagramm für den Stufenverlauf - bewusst minimalistisch,
// keine Bibliothek nötig.
function historyBarChart(levels, color){
  const w = 150, h = 36;
  const barW = Math.max(5, Math.floor(w/levels.length) - 3);
  const bars = levels.map((lvl,i)=>{
    const val = lvl || 0;
    const barH = Math.max(2, (val/3)*h);
    const x = i*(barW+3);
    const y = h-barH;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color||'#1B6E7F'}" rx="1.5"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;">${bars}</svg>`;
}

function renderErrorProfileSection(){
  const entries = Object.keys(ERROR_CATEGORIES)
    .map(cat => ({cat, name: ERROR_CATEGORIES[cat], count: state.errorProfile[cat]||0}))
    .filter(e => e.count > 0)
    .sort((a,b) => b.count - a.count);
  if(entries.length === 0){
    return `<h3 style="font-size:1rem;margin-top:18px;">Fehlerprofil</h3><p style="font-size:0.85rem;color:#6B7F8C;margin-top:4px;">Noch keine kategorisierten Fehler erfasst (Leuchtturm/Speicherstadt).</p>`;
  }
  const maxCount = Math.max(...entries.map(e=>e.count));
  const rows = entries.map(e => {
    const barW = Math.round((e.count/maxCount)*140);
    return `<tr>
      <td style="font-size:0.85rem;">${e.name}</td>
      <td><svg viewBox="0 0 140 16" width="140" height="16"><rect x="0" y="2" width="${barW}" height="12" fill="#B24C2F" rx="3"/></svg></td>
      <td style="font-size:0.85rem;text-align:center;">${e.count}</td>
    </tr>`;
  }).join('');
  return `
    <h3 style="font-size:1rem;margin-top:18px;">Fehlerprofil (Leuchtturm &amp; Speicherstadt)</h3>
    <p style="font-size:0.8rem;color:#6B7F8C;margin-top:2px;">Zeigt, bei welchen Rechtschreibmustern noch Unsicherheit besteht - nicht nur wie viele, sondern welche Art von Fehlern.</p>
    <table class="teacher-panel"><tr><th>Muster</th><th>Häufigkeit</th><th>Anzahl</th></tr>${rows}</table>`;
}

function renderHistorySection(){
  const history = state.history || [];
  const wk = weekKey(new Date());
  const currentEntry = history.find(h => h.week === wk);
  const currentNote = currentEntry ? (currentEntry.note || '') : '';

  const noteForm = `
    <p style="font-size:0.85rem;color:#334;margin-top:14px;margin-bottom:4px;">Notiz zur aktuellen Woche (z. B. SCHNABEL-Ergebnis, Beobachtung):</p>
    <textarea id="weekNoteInput" rows="2" style="width:100%;border:2px solid var(--line);border-radius:var(--radius-sm);padding:8px 10px;font-family:'Atkinson Hyperlegible';font-size:0.88rem;" placeholder="z. B. SCHNABEL Dez.: Schwäche bei Doppelkonsonanten">${currentNote}</textarea>
    <button class="btn btn-ghost" style="margin-top:8px;padding:8px 16px;font-size:0.9rem;" onclick="saveWeekNote()">Notiz speichern</button>`;

  if(history.length === 0){
    return `<p style="font-size:0.85rem;color:#6B7F8C;margin-top:14px;">Noch kein Wochenverlauf – der baut sich automatisch auf, sobald über mehrere Wochen geübt wird (ein Eintrag pro Kalenderwoche).</p>${noteForm}`;
  }
  const rows = domains.map(d=>{
    const levelsArr = history.map(h => h.levels[d.id] || 1);
    const trend = history.map(h => h.levels[d.id] || '–').join(' → ');
    return `<tr><td>${d.icon} ${d.name}</td><td>${historyBarChart(levelsArr, d.color)}</td><td style="font-family:monospace;font-size:0.8rem;">${trend}</td></tr>`;
  }).join('');
  const notedWeeks = history.filter(h => h.note);
  const notesList = notedWeeks.length ? `
    <p style="font-size:0.85rem;color:#334;margin-top:14px;"><strong>Notizen:</strong></p>
    <ul style="font-size:0.85rem;color:#334;padding-left:18px;margin-top:4px;">
      ${notedWeeks.map(h => `<li>${h.date}: ${h.note}</li>`).join('')}
    </ul>` : '';
  return `
    <h3 style="font-size:1rem;margin-top:18px;">Verlauf über die Wochen</h3>
    <p style="font-size:0.8rem;color:#6B7F8C;margin-top:2px;">${history[0].date} bis ${history[history.length-1].date} · ${history.length} Woche(n) erfasst</p>
    <table class="teacher-panel"><tr><th>Bereich</th><th>Verlauf</th><th>Stufe je Woche</th></tr>${rows}</table>
    ${notesList}
    ${noteForm}
    <p style="font-size:0.8rem;color:#6B7F8C;line-height:1.5;margin-top:8px;">Zum externen Protokollieren: Werte einfach ablesen und ins Förderprotokoll übertragen. Ein neuer Wert kommt automatisch dazu, sobald in einer neuen Kalenderwoche geübt wird.</p>`;
}

window.saveWeekNote = function(){
  const val = (document.getElementById('weekNoteInput')||{}).value || '';
  const wk = weekKey(new Date());
  let history = state.history || [];
  let entry = history.find(h => h.week === wk);
  if(!entry){
    entry = {week:wk, date:new Date().toISOString().slice(0,10), levels:{...state.levels}, stars:{...state.stars}};
    history.push(entry);
  }
  entry.note = val;
  state.history = history.slice(-26);
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      levels: state.levels, stars: state.stars, diagDone: !!state.diagDone, history: state.history,
    }));
  }catch(e){}
  render();
};

function renderSelfCheckSection(){
  const checks = (state.selfChecks||[]).slice(-8).reverse();
  if(checks.length === 0) return '';
  const stageOf = {good:3, ok:2, hard:1};
  const rows = checks.map(c=>{
    const d = anyDomain(c.domainId);
    const label = d ? (d.icon+' '+d.name) : c.domainId;
    const mismatch = (c.rating==='good' && c.errors>=2) || (c.rating==='hard' && c.errors===0);
    return `<tr><td>${c.date}</td><td>${label}</td><td>${plantIcon(stageOf[c.rating]||1, 26)}</td><td>${c.errors}/${c.items}</td><td>${mismatch?'⚠️':''}</td></tr>`;
  }).join('');
  return `
    <h3 style="font-size:1rem;margin-top:18px;">Selbsteinschätzung (letzte Einträge)</h3>
    <table class="teacher-panel"><tr><th>Datum</th><th>Bereich</th><th>Gefühl</th><th>Fehler</th><th></th></tr>${rows}</table>
    <p style="font-size:0.8rem;color:#6B7F8C;margin-top:6px;">⚠️ markiert Fälle, in denen Selbsteinschätzung und tatsächliche Fehlerzahl deutlich auseinanderliegen.</p>`;
}

function renderTeacherOverlay(){
  const rows = domains.map(d=>{
    const lvl = state.levels[d.id]||'–';
    const st = state.stars[d.id]||0;
    const err = state.errorCounts[d.id]||0;
    return `<tr><td>${d.icon} ${d.name}</td><td><span class="badge-level">Stufe ${lvl}</span></td><td>⭐ ${st}</td><td>❌ ${err}</td></tr>`;
  }).join('');
  return `
  <div class="overlay" onclick="if(event.target===this) toggleTeacher()">
    <div class="sheet">
      <button class="sheet-close" onclick="toggleTeacher()">✕</button>
      <h2 style="font-size:1.2rem;">Für Lehrkräfte</h2>
      <p style="font-size:0.9rem;color:#4B6473;margin-top:6px;">Momentaner Lernstand pro Kompetenzbereich – als Gesprächsgrundlage, z. B. für Förderplanung oder Elterngespräche.</p>
      <div style="display:flex;gap:10px;margin-top:14px;">
        <div style="flex:1;">
          <label style="font-size:0.75rem;color:#4B6473;">Name/Kürzel (nur lokal auf diesem Gerät)</label>
          <input type="text" id="childLabelInput" value="${escapeHtml(state.childLabel||'')}" onchange="updateChildInfo()" placeholder="z. B. Initialen" style="width:100%;border:2px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px;font-family:'Atkinson Hyperlegible';font-size:0.88rem;margin-top:2px;">
        </div>
        <div style="flex:1;">
          <label style="font-size:0.75rem;color:#4B6473;">Klasse</label>
          <input type="text" id="classNameInput" value="${escapeHtml(state.className||'')}" onchange="updateChildInfo()" placeholder="z. B. 3b" style="width:100%;border:2px solid var(--line);border-radius:var(--radius-sm);padding:7px 9px;font-family:'Atkinson Hyperlegible';font-size:0.88rem;margin-top:2px;">
        </div>
      </div>
      <table class="teacher-panel">
        <tr><th>Bereich</th><th>Stufe</th><th>Sterne</th><th>Fehler</th></tr>
        ${rows}
      </table>
      ${renderErrorProfileSection()}
      ${renderHistorySection()}
      ${renderSelfCheckSection()}
      <p style="font-size:0.82rem;color:#6B7F8C;line-height:1.5;margin-top:16px;">
      Funktionsweise: Der Lotsen-Check testet jeden Bereich jetzt mit drei zufällig gewählten Aufgaben statt zwei – Einstiegsitem, ein leichteres oder schwereres Folgeitem, und ein Bestätigungsitem auf der so ermittelten Stufe. Fällt die Bestätigung negativ aus, wird eine Stufe zurückgestuft – das fängt Ausrutscher und Zufallstreffer ab. Jede Diagnose wird als Bericht gespeichert (Testergebnis je Aufgabe, aktueller Lernstand als „Ich kann"-Aussage, nächster Lernschritt) und dient bei einer Wiederholung (z. B. nach einem halben Jahr) automatisch als Vergleichsbasis. Ein Aufstieg passiert erst, wenn mindestens 8 Versuche auf der aktuellen Stufe protokolliert sind UND von den letzten 6 Versuchen höchstens 1 falsch war (über mehrere Sitzungen hinweg gespeichert) – reines Raten reicht damit nicht für einen Aufstieg. Sind von den letzten 4 Versuchen mindestens 3 falsch, geht es eine Stufe zurück. Die Fehlerzahl je Bereich wird fortlaufend gezählt. Nach jeder Sitzung schätzt das Kind anhand einer „Ich kann..."-Aussage zum konkreten Lernziel der Stufe seine eigene Beherrschung ein – dargestellt als wachsende Pflanze in drei selbst gezeichneten Stufen (Keim, kleine Blätter, blühend) statt als Gesichtsausdruck, damit nicht die Person, sondern der noch wachsende Lernstand bewertet wird – sichtbar oben in der Tabelle, mit Warnhinweis bei auffälliger Abweichung von der tatsächlichen Fehlerzahl. Ein gemeisterter Bereich (🏆) wird nach 14 Tagen automatisch zur kurzen Auffrischung (🔁, 4 Aufgaben aus Stufe 2+3 gemischt) wieder vorgelegt; läuft die Auffrischung gut, verlängert sich die Frist um weitere 14 Tage, bei Schwierigkeiten schon nach 3 Tagen erneut oder mit Rückstufung. Lesefahrrinne/Schreibwerft schalten sich erst frei, wenn Lauthafen, Buchstabenbrücke & Silbendock mindestens Stufe 2 erreicht haben; Leuchtturm/Speicherstadt entsprechend erst nach Lesefahrrinne/Schreibwerft – angelehnt an die alphabetische-vor-orthografischer-Strategie-Abfolge, damit kein Kind mit Aufgaben konfrontiert wird, für die die Grundlage fehlt. Der Fortschritt wird ausschließlich lokal auf diesem Gerät gespeichert (kein Server, keine Übertragung von Kinderdaten). Dies ist ein Funktionsprototyp; für den Realeinsatz braucht es größere, psychometrisch abgesicherte Aufgabenpools sowie eine Anbindung an die schulische Dokumentation (z. B. DiViS/Förderplan, SCHNABEL-Ergebnisse).</p>
      ${(state.diagReports&&state.diagReports.length) ? `<button class="btn btn-ghost" style="margin-top:16px;" onclick="viewDiagReport()">📋 Diagnosebericht ansehen</button>` : ''}
      <button class="btn btn-primary" style="margin-top:16px;" onclick="exportFoerderplan()">📄 Förderplan-Auszug exportieren</button>
      <p style="font-size:0.78rem;color:#6B7F8C;line-height:1.4;margin-top:4px;">Erzeugt eine druckbare Übersicht (Lernausgangslage, Förderziele, Verlauf) als Arbeitsgrundlage für den diagnosegestützten Förderplan nach § 5 VO Notenschutz – kein fertiger, rechtsgültiger Förderplan und kein Ersatz für SCHNABEL/SLS.</p>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="toggleTeacher(); startDiagnose();">🔁 Diagnose erneut durchführen (z. B. nach 6 Monaten)</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="exportData()">📤 Daten exportieren (Sicherung)</button>
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="document.getElementById('importFileInput').click()">📥 Daten importieren</button>
      <input type="file" id="importFileInput" accept="application/json" style="display:none;" onchange="importData(this.files[0])">
      <button class="btn btn-ghost" style="margin-top:10px;" onclick="confirmReset()">🔄 Fortschritt dieses Geräts zurücksetzen</button>
    </div>
  </div>`;
}

try{
  render();
}catch(err){
  const app = document.getElementById('app');
  if(app){
    app.innerHTML = `<div style="padding:30px 20px;text-align:center;font-family:sans-serif;">
      <div style="font-size:2.5rem;">⚠️</div>
      <p style="margin-top:10px;color:#173142;">Etwas ist beim Laden schiefgelaufen. Bitte die Seite neu laden. Falls das nicht hilft, bitte den technischen Fehler melden:</p>
      <p style="margin-top:10px;font-family:monospace;font-size:0.8rem;color:#7A3512;background:#FDEDE2;padding:10px;border-radius:8px;">${(err && err.message) ? err.message : String(err)}</p>
    </div>`;
  }
}
</script>
</body>
</html>
