// Silbentrennungs-Bindestriche (z.B. "Schmet-ter-ling") sind zum SEHEN
// gedacht, sollen aber nicht mitgesprochen werden - sonst verfälscht das
// die Aussprache. Der Gedankenstrich "–" (z.B. "Löwe – Löffel") bleibt
// unangetastet, das ist ein anderes Zeichen.
function stripSyllableHyphens(text){
  return (text||'').replace(/([a-zA-ZäöüÄÖÜß])-(?=[a-zA-ZäöüÄÖÜß])/g, '$1');
}

// Echte Sprachaufnahmen für isolierte Laute (z.B. "A.m4a", "V1.m4a") -
// umgehen das TTS-Problem komplett, weil eine Audiodatei einfach abspielt,
// was aufgenommen wurde, ohne über Text-Ausspracheregeln zu gehen. Fehlt
// eine Datei oder schlägt die Wiedergabe fehl, fällt es automatisch auf die
// normale Sprachausgabe (das ganze Wort) zurück - nichts bricht ab.
// Spielt die Aufnahme des isolierten Lauts ab und spricht danach das ganze
// Wort - wartet auf das tatsächliche Ende der Aufnahme (kein geratenes Timing).
function playLetterSoundThenWord(key, word){
  if(!key){ speak(word); return; }
  playAudioKey(key, ()=>{ speak(word); });
}


/* ============================================================
   SPRACHAUSGABE: vorab erzeugte KI-Stimme (Piper "Thorsten") mit
   Rückfall auf die Browser-Stimme.
   Alle Sprechtexte liegen als kurze MP3-Clips gebündelt in zwei Dateien:
   sprache.json (Index) und sprache.bin (Clips hintereinander).
   Jeder Text wird in Sätze zerlegt; ein Satz ist über einen Schlüssel
   (Hash des Textes + n=normal / s=langsam) auffindbar. Fehlt auch nur
   ein Satz oder lädt eine Datei nicht, spricht der ganze Text wie bisher
   die Browser-Stimme - nichts bricht ab.
   ============================================================ */
const TTS = {idx:null, buf:null, q:[], busy:false, el:null, gen:0, urls:{}, rangeOk:true, miss:{}};
function cyrb53(str){
  let h1=0xdeadbeef, h2=0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
function ttsNorm(t){
  return String(t==null?'':t)
    .replace(/([a-zA-ZäöüÄÖÜß])-(?=[a-zA-ZäöüÄÖÜß])/g,'$1')
    .replace(/\|/g,'')
    .replace(/[\u{1F000}-\u{1FFFF}\u{2190}-\u{2BFF}\u{FE00}-\u{FE0F}\u{200D}\u{20E3}]/gu,' ')
    .replace(/([.!?])(?:\s*[.!?])+/g,'$1')
    .replace(/\s+/g,' ').trim();
}
function ttsChunks(t){
  const n = ttsNorm(t);
  const parts = n.match(/[^.!?]+[.!?]*/g) || [];
  return parts.map(x=>x.trim().replace(/\.+$/,'')).filter(x=>/[A-Za-zÄÖÜäöüß0-9]/.test(x));
}
function ttsKey(chunk, slow){ return cyrb53(chunk)+(slow?'s':'n'); }
function ttsInit(){
  try{
    fetch('sprache.json').then(r=>r.ok?r.json():null).then(j=>{
      if(!j) return; TTS.idx=j;
      TTS.binP = fetch('sprache.bin').then(r=>r.ok?r.arrayBuffer():null).then(b=>{ if(b) TTS.buf=b; return b; }).catch(()=>null);
    }).catch(()=>{});
  }catch(e){}
}
function ttsHas(chunks, slow){
  if(!TTS.idx) return false;
  for(let i=0;i<chunks.length;i++){ if(!TTS.idx[ttsKey(chunks[i], slow)]) return false; }
  return true;
}
function ttsClip(key){
  if(TTS.urls[key]) return Promise.resolve(TTS.urls[key]);
  const e = TTS.idx && TTS.idx[key];
  if(!e) return Promise.reject(new Error('kein Clip'));
  const done = (ab)=>{ const u = URL.createObjectURL(new Blob([ab],{type:'audio/mpeg'})); TTS.urls[key]=u; return u; };
  if(TTS.buf) return Promise.resolve(done(TTS.buf.slice(e[0], e[0]+e[1])));
  // Noch nicht komplett geladen: nur den einen Clip per Range-Anfrage holen,
  // sonst (Server ohne Range) auf das vollständige Laden warten.
  const viaFull = ()=> (TTS.binP||Promise.resolve(null)).then(b=>{ if(!b) throw new Error('kein Laden'); return done(b.slice(e[0], e[0]+e[1])); });
  if(!TTS.rangeOk) return viaFull();
  return fetch('sprache.bin',{headers:{Range:'bytes='+e[0]+'-'+(e[0]+e[1]-1)}}).then(r=>{
    if(r.status!==206){ TTS.rangeOk=false; throw new Error('kein Range'); }
    return r.arrayBuffer();
  }).then(done, ()=>viaFull());
}
function ttsEl(){
  if(!TTS.el){ TTS.el = new Audio(); TTS.el.preload='auto'; }
  return TTS.el;
}
// iPad/Safari: Audio darf erst nach einer Berührung abgespielt werden. Dieses eine
// Element wird bei der ersten Berührung freigeschaltet und danach immer wiederverwendet.
(function(){
  let unlocked = false;
  function unlock(){
    if(unlocked) return; unlocked = true;
    try{
      const el = ttsEl();
      el.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
      const p = el.play(); if(p && p.catch) p.catch(()=>{});
    }catch(e){}
    ['pointerdown','touchend','keydown','click'].forEach(ev=>document.removeEventListener(ev, unlock, true));
  }
  ['pointerdown','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev, unlock, true));
})();
function ttsStop(){
  TTS.gen++; TTS.q = []; TTS.busy = false;
  try{ if(TTS.el) TTS.el.pause(); }catch(e){}
}
function ttsNext(){
  const job = TTS.q.shift();
  if(!job){ TTS.busy = false; return; }
  TTS.busy = true;
  const gen = TTS.gen;
  let i = 0;
  const fail = ()=>{
    if(gen!==TTS.gen) return;
    const rest = job.chunks.slice(Math.max(0,i-1)).join(' ');
    speakBrowser(rest, job.slow?0.7:0.95, ()=>{ if(gen!==TTS.gen) return; if(job.onDone) job.onDone(); ttsNext(); });
  };
  const step = ()=>{
    if(gen!==TTS.gen) return;
    if(i>=job.chunks.length){ if(job.onDone) job.onDone(); ttsNext(); return; }
    const key = ttsKey(job.chunks[i], job.slow); i++;
    ttsClip(key).then(url=>{
      if(gen!==TTS.gen) return;
      const el = ttsEl();
      el.onended = step; el.onerror = fail;
      el.src = url;
      const p = el.play();
      if(p && typeof p.catch==='function') p.catch(fail);
    }).catch(fail);
  };
  step();
}
// true = wird mit der KI-Stimme gesprochen (bzw. ist stumm, wenn nichts Sprechbares da ist)
function ttsSpeak(text, slow, onDone){
  const chunks = ttsChunks(text);
  if(!chunks.length){ if(onDone) onDone(); return true; }
  if(!ttsHas(chunks, slow)){ if(TTS.idx) chunks.forEach(c=>{ if(!TTS.idx[ttsKey(c, slow)]) TTS.miss[c+(slow?' [langsam]':'')] = 1; }); return false; }
  TTS.q.push({chunks:chunks, slow:slow, onDone:onDone});
  if(!TTS.busy) ttsNext();
  return true;
}
ttsInit();

function speak(text, rate){
  text = stripSyllableHyphens(text);
  if(ttsSpeak(text, !!(rate && rate<0.85))) return;
  speakBrowser(text, rate);
}
function speakBrowser(text, rate, onEnd){
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    warnNoTts();
    if(onEnd) onEnd();
    return;
  }
  try{
    refreshVoices();
    const u = new SpeechSynthesisUtterance(text);
    u.lang='de-DE'; u.rate=rate||0.95;
    const deVoices = cachedVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('de'));
    const enhancedVoice = deVoices.find(v=>/enhanced|premium|neural/i.test(v.name||''));
    if(enhancedVoice) u.voice = enhancedVoice;
    let started = false;
    u.onstart = ()=>{ started = true; };
    u.onerror = ()=>{ warnNoTts(); if(onEnd){ const f=onEnd; onEnd=null; f(); } };
    if(onEnd) u.onend = ()=>{ if(onEnd){ const f=onEnd; onEnd=null; f(); } };
    window.speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started) warnNoTts(); }, 1200);
  }catch(e){
    warnNoTts();
    if(onEnd) onEnd();
  }
}
function warnNoTts(){
  if(ttsWarned) return;

// ---- Lesekai: Kreuze an als Seite (6 Aufgaben) ----
function ksDiff(w, other){
  let s0=0; while(s0<w.length && s0<other.length && w[s0]===other[s0]) s0++;
  let e=0; while(e<w.length-s0 && e<other.length-s0 && w[w.length-1-e]===other[other.length-1-e]) e++;
  return w.slice(0,s0)+'<span class="ks-diff">'+w.slice(s0,w.length-e)+'</span>'+w.slice(w.length-e);
}
function buildKreuzseiteRows(pool, n){
  const rows = [], seen = new Set();
  shuffle(pool).forEach(e=>{
    if(rows.length>=n) return;
    const key = [e.right, e.wrong].sort().join('|');
    if(seen.has(key)) return;            // dasselbe Wortpaar nicht zweimal auf einer Seite
    seen.add(key);
    rows.push({pic:e.pic, typ:e.typ, opts:shuffle([{w:e.right,ok:true},{w:e.wrong,ok:false}])});
  });
  return rows;
}
function renderKreuzseite(item, isStatic){
  const p = state.practice, rows = item.rows || [], ans = p.ksAnswers || {};
  const n = Object.keys(ans).length;
  const cards = rows.map((r,i)=>{
    const picked = ans[i];
    let cardCls = 'ks-item';
    if(isStatic) cardCls += (picked!==undefined && r.opts[picked].ok) ? ' ok' : ' no';
    const opts = r.opts.map((o,k)=>{
      let cls = 'ks-opt';
      if(isStatic){ if(o.ok) cls += ' right'; else if(picked===k) cls += ' wrong'; }
      else if(picked===k) cls += ' sel';
      const word = isStatic ? ksDiff(o.w, r.opts[1-k].w) : o.w;
      return `<button class="${cls}" ${isStatic?'disabled':''} onclick="ksPick(${i},${k})"><span class="ks-box"></span><span class="ks-word">${word}</span></button>`;
    }).join('');
    return `<div class="${cardCls}"><div class="ks-pic">${renderPicVal(r.pic)}</div><div class="ks-opts">${opts}</div></div>`;
  }).join('');
  const head = `<div class="task-instr">✅ Welches Wort passt zum Bild? Tippe das richtige Wort an.</div>
    <button class="speak-btn" onclick="speakCurrent()">🔊</button>`;
  if(isStatic) return head + `<div class="ks-grid">${cards}</div>`;
  return head + `<div class="ks-count">${n} von ${rows.length}</div><div class="ks-grid">${cards}</div>
    <button class="btn btn-primary btn-block" style="margin-top:14px;" ${n<rows.length?'disabled':''} onclick="ksCheck()">✅ Prüfen</button>`;
}
window.ksPick = function(i,k){
  const p = state.practice; if(p.answered) return;
  p.ksAnswers[i] = k; rerenderKeepScroll();
};
// Jede der 6 Aufgaben zählt einzeln (Versuchsliste, Sterne, Fehlerprofil).
// Die letzte läuft durch practiceAnswer (Stufenlogik, Speichern, Rückmeldung).
window.ksCheck = function(){
  const p = state.practice; if(p.answered) return;
  try{ sessionEnsure(); sessionTick(); }catch(e){}
  const rows = p.current.rows;
  if(Object.keys(p.ksAnswers).length < rows.length) return;
  const res = rows.map((r,i)=> r.opts[p.ksAnswers[i]].ok);
  const last = rows.length-1;
  for(let i=0;i<last;i++){
    p.attemptLog.push(res[i]); if(p.attemptLog.length>12) p.attemptLog.shift();
    if(res[i]){ state.stars[p.domainId] = (state.stars[p.domainId]||0)+1; }
    else {
      state.errorCounts[p.domainId] = (state.errorCounts[p.domainId]||0)+1;
      const key = 'lese_'+rows[i].typ;
      state.errorProfile[key] = (state.errorProfile[key]||0)+1;
      try{ const ok = rows[i].opts.find(o=>o.ok), bad = rows[i].opts[p.ksAnswers[i]]; logError(p.domainId, p.level, {t:'ks', w:ok.w, c:ok.w, g:bad.w, cat:key}); }catch(e){}
      p.sessionErrors = (p.sessionErrors||0)+1;
    }
  }
  p.itemsDone += last;
  p.ksResults = res;
  p.current.errorCategory = 'lese_'+rows[last].typ;
  window.practiceAnswer(res[last] ? 0 : 1);
};

  }
  const done = p.matchDone || [];
  const order = (p.matchOrder && p.matchOrder.length===item.pairs.length) ? p.matchOrder : item.pairs.map((_,i)=>i);
  const pics = item.pairs.map((pr,i)=>{
    const isDone = done.includes(i);
    const cls = 'm-btn m-pic' + (isDone?' m-done':'') + (p.matchSel===i ? ' m-sel':'');
    return `<button class="${cls}" ${isDone?'disabled':''} onclick="matchPic(${i})">${renderPicVal(pr.pic)}</button>`;
  }).join('');
  const words = order.map(j=>{
    const isDone = done.includes(j);
    const cls = 'm-btn m-word' + (isDone?' m-done':'') + (p.matchFlash===j ? ' m-wrong':'');
    return `<button class="${cls}" ${isDone?'disabled':''} onclick="matchWord(${j})">${fmtOpt(item.pairs[j].word)}</button>`;
  }).join('');
  const hint = p.matchNeedPic ? `<div class="mal-note">👆 Tippe zuerst ein Bild an.</div>` : '';
  return instr + hint + `<div class="m-grid"><div class="m-col">${pics}</div><div class="m-col">${words}</div></div>`;
}

window.matchPic = function(i){
  const p = state.practice; if(p.answered) return;
  if((p.matchDone||[]).includes(i)) return;
  p.matchSel = i; p.matchFlash = null; p.matchNeedPic = false;
  rerenderKeepScroll();
};
window.matchWord = function(j){
  const p = state.practice; if(p.answered) return;
  if(p.matchSel===null || p.matchSel===undefined){ p.matchNeedPic = true; rerenderKeepScroll(); return; }
  if(p.matchSel===j){
    p.matchDone.push(j); p.matchSel = null; p.matchFlash = null;
    if(p.matchDone.length===p.current.pairs.length){
      window.practiceAnswer(p.matchWrong===0 ? 0 : 1);   // sauber = ohne falsches Antippen
      return;
    }
  } else {
    p.matchWrong++; p.matchFlash = j; p.matchSel = null;  // erneut ein Bild wählen
  }
  rerenderKeepScroll();
};

function malEvaluate(item, fills){
  const expected = {};
  item.tasks.forEach(t=>t.set.forEach(([r,c])=>{ expected[r] = (c==='weiss') ? null : c; }));
  const fig = MAL_FIGUREN[item.figur];
  const taskOk = item.tasks.map(t=>t.set.every(([r,c])=> (fills[r]||null) === (c==='weiss' ? null : c)));
  const extra = fig.regions.some(r => !(r in expected) && fills[r]);
  return {taskOk, extra, ok: taskOk.every(Boolean) && !extra};
}

function renderMalenBody(item, isStatic){
  const p = state.practice;
  const fig = MAL_FIGUREN[item.figur];
  const fills = p.malFill || {};
  const a = r => `data-r="${r}" fill="${fills[r] ? MAL_COLORS[fills[r]].hex : '#FFFFFF'}"` + (isStatic ? '' : ` onclick="malRegion('${r}')"`);
  const svg = fig.draw(a);
  const res = isStatic ? malEvaluate(item, fills) : null;
  const sentences = item.tasks.map((t,i)=>{
    let mark = '☐';
    if(isStatic) mark = res.taskOk[i] ? '✅' : '❌';
    else {
      const need = t.set.filter(x=>x[1]!=='weiss');
      if(need.length && need.every(x=>fills[x[0]])) mark = '☑️';
    }
    return `<div class="mal-sent"><span class="mal-mark">${mark}</span><span>${t.text}</span></div>`;
  }).join('');
  const palette = isStatic ? '' : `<div class="mal-pal">${
    Object.keys(MAL_COLORS).map(k=>`<button class="mal-col${p.malColor===k?' sel':''}" style="--c:${MAL_COLORS[k].hex}" onclick="malPick('${k}')"><span class="sw"></span>${MAL_COLORS[k].label}</button>`).join('')
  }<button class="mal-col${p.malColor==='weg'?' sel':''}" onclick="malPick('weg')"><span class="sw sw-weg">✕</span>weg</button></div>`;
  const note = isStatic
    ? (res.extra ? `<div class="mal-note">Ein Teil im Bild war gar nicht dran – er sollte weiß bleiben.</div>` : '')
    : (p.malHint ? `<div class="mal-note">👆 Tippe zuerst eine Farbe an.</div>` : '');
  return `
    <div class="task-instr">🎨 Lies und male. Tippe erst eine Farbe an, dann den Teil im Bild.</div>
    <button class="speak-btn" onclick="speakCurrent()">🔊</button>
    <div class="mal-sents">${sentences}</div>
    <div class="mal-fig">${svg}</div>
    ${palette}${note}
    ${isStatic ? '' : `<button class="btn btn-primary btn-block" style="margin-top:12px;" onclick="malCheck()">✅ Fertig</button>`}`;
}

window.malPick = function(k){
  const p = state.practice; if(p.answered) return;
  p.malColor = k; p.malHint = false; rerenderKeepScroll();
};
window.malRegion = function(r){
  const p = state.practice; if(p.answered) return;
  if(!p.malColor){ p.malHint = true; rerenderKeepScroll(); return; }
  if(p.malColor==='weg') delete p.malFill[r]; else p.malFill[r] = p.malColor;
  p.malHint = false; rerenderKeepScroll();
};
window.malCheck = function(){
  const p = state.practice; if(p.answered) return;
  window.practiceAnswer(malEvaluate(p.current, p.malFill).ok ? 0 : 1);
};

function checkAnswer(item, given){
  if(item.type==='choice' || item.type==='pic' || item.type==='flash' || item.type==='silbchoice') return given===item.answer;
  if(item.type==='dictate' || item.type==='papier' || item.type==='match' || item.type==='malen' || item.type==='kreuzseite' || item.type==='mark') return given===0;
  if(item.type==='satzbau') return given===0;
  if(item.cs) return (given||'').toString().trim().replace(/ß/g,'ss')===item.answer.replace(/ß/g,'ss');   // Groß-/Kleinschreibung zählt
  const norm = s => (s||'').toString().trim().toLowerCase().replace(/ß/g,'ss');
  return norm(given)===norm(item.answer).replace(/ß/g,'ss');
}

  if(item.type==='papier') return renderPapier(item, false);

  if(item.type==='wordstudy'){

    if(!p.wsPhase || p.wsPhase==='study'){
      const groups = tokenizeWordToSounds(item.word);
      const boxW = 46;

        const boxes = group.map(tok=>{
          const idx = globalIdx++;
          return `
          <button onclick="wordstudyPlayToken(${idx})" style="display:inline-block;position:relative;margin:2px;min-width:36px;height:44px;padding:0 6px;border:2px solid var(--line);border-radius:10px;font-size:1.25rem;font-family:'Andika';font-weight:700;background:var(--sand);line-height:40px;text-align:center;">
            ${isVowelSoundKey(tok.key) ? `<span style="position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:0.95rem;">👑</span>` : ''}

        }).join('');
        const arcWidth = group.length * boxW;

            <div>${boxes}</div>
            ${syllableArcSpan(arcWidth)}
          </span>`;
      }).join('');

    }
    // sbStep === 'compare'
    const words = sentenceWords();
    const wordBtns = words.map((w,i)=>{
      const marked = p.sbMarked && p.sbMarked[i];
      return `<button onclick="satzbauToggleWord(${i})" style="margin:4px;padding:9px 13px;border-radius:10px;border:2px solid var(--line);font-size:1.1rem;font-family:'Andika';font-weight:700;background:${marked?'#F1A38B':'var(--sand)'};color:${marked?'#fff':'var(--ink)'};">${w}</button>`;
    }).join('');

    }).join('');
    return `
      <div class="task-instr">👀 Vergleiche mit deinem Blatt. Tippe die Wörter an, die du anders geschrieben hast.</div>
      <button class="speak-btn" onclick="speakDictateSlow()">🔊</button>
      <div style="text-align:center;line-height:2.4;margin:10px 0;">${wordBtns}</div>
      <button class="btn btn-primary btn-block" style="margin-top:10px;" onclick="dictateSubmit()">✅ Fertig</button>`;
  }
  if(item.type==='flash'){
    const secs = (state.practice && state.practice.flashSecondsLeft) || 0;
    const cls = item.options.length<=2 ? 'pic-options two' : 'pic-options';
    return `
      <div class="task-instr">⚡ Lies das Wort schnell, dann tippe das passende Bild an!</div>
      <div class="pic-target" style="font-family:'Baloo 2';font-size:2.4rem;">${item.word}</div>
      <div style="font-size:1.7rem;font-weight:700;color:var(--coral);margin:6px 0 4px;">⏱️ ${secs}</div>
      <div class="${cls}">${item.options.map((opt,i)=>
        `<button class="pic-opt-btn" onclick="${handlerName}(${i})">${opt}</button>`
      ).join('')}</div>`;
  }
  if(item.type==='pic'){
    const cls = item.options.length<=2 ? 'pic-options two' : 'pic-options';
    return `
      <div class="task-instr">${item.taskIcon} ${taskInstructions[item.taskIcon]||''}</div>
      <div class="pic-target">${renderPicVal(item.targetEmoji)}</div>
      ${gapHtml(item,null)}
      <button class="speak-btn" onclick="speakCurrent()">🔊</button>
      <div class="${cls}">${item.options.map((opt,i)=>
        `<button class="pic-opt-btn" onclick="${handlerName}(${i})">${renderPicVal(opt)}</button>`
      ).join('')}</div>`;
  }
  let body = '';
  if(item.pictureEmoji) body += `<div class="pic-target">${renderPicVal(item.pictureEmoji)}</div>`;
  body += `<div class="prompt-text">${item.prompt}</div>`;
  body += `<button class="speak-btn" onclick="speakCurrent()">🔊</button>`;
  if(item.type==='choice'){
    const cls = (item.options.length<=2 || item.layout==='single') ? 'options single' : 'options';
    body += `<div class="${cls}">` + item.options.map((opt,i)=>
      `<button class="opt-btn" onclick="${handlerName}(${i})">${fmtOpt(opt)}</button>`
    ).join('') + `</div>`;
  } else {
    body += kbEntryHtml(handlerName);
  }
  return body;
}

window.diagDontKnow = function(){
  // Garantiert falsch (kein Options-Index und kein echtes Wort kann diesem
  // Wert entsprechen) - zählt bewusst als Fehler, damit Raten bei zu
  // schweren Aufgaben die Diagnose nicht verfälscht.
  window.diagAnswer('__SKIP__');
};

window.diagAnswer = function(given){
  const d = diagDomains[state.diag.domainIndex];
  const item = state.diag.current;
  const correct = checkAnswer(item, given);
  if(given==='__SKIP__' && d.id==='buchstabe'){
    state.diag.buchstabeSkipped = true;
  }
  const dr = state.diag.domainResults[d.id] = state.diag.domainResults[d.id] || {};

  if(state.diag.stage==='mid'){
    dr.mid = {item, correct};
    state.diag.midCorrect = correct;
    const nextLevel = correct ? 3 : 1;
    state.diag.stage = correct ? 'high' : 'low';
    state.diag.current = shuffleOptions(diagItem(d.id, nextLevel, state.diag.usedItems));
    state.diag.currentLevel = nextLevel;
    render();
    return;
  }
  if(state.diag.stage==='high' || state.diag.stage==='low'){
    dr.second = {item, correct};
    let tentative;
    if(state.diag.midCorrect && correct) tentative=3;
    else if(state.diag.midCorrect && !correct) tentative=2;
    else if(!state.diag.midCorrect && correct) tentative=2;
    else tentative=1;
    state.diag.tentativeLevel = tentative;
    state.diag.stage = 'confirm';
    state.diag.current = shuffleOptions(diagItem(d.id, tentative, state.diag.usedItems));
    state.diag.currentLevel = tentative;
    render();
    return;
  }
  // Bestätigungs-Item: fängt einen Glückstreffer/Ausrutscher der ersten
  // beiden Items ab, bevor die Stufe endgültig feststeht.
  dr.confirm = {item, correct};
  let level = state.diag.tentativeLevel;
  if(!correct) level = Math.max(1, level-1);
  dr.level = level;
  state.levels[d.id] = level;
  delete state.attemptLogs[d.id]; // alte Versuchsdaten passen ggf. nicht mehr zur neuen Stufe

  state.diag.domainIndex++;
  if(state.diag.domainIndex>=diagDomains.length){
    state.diagDone = true;
    state.knownAtStart = {};
    diagDomains.forEach(dd=>{ if((state.levels[dd.id]||1)>=3) state.knownAtStart[dd.id] = true; });
    if(state.levels.buchstabe === 1 || state.diag.buchstabeSkipped){
      state.needsBasicLetterDrill = true;
    }
    state.diagReports = state.diagReports || [];
    state.diagReports.push({date: todayStr(), results: state.diag.domainResults, sv:3});
    state.diagReports = state.diagReports.slice(-10);
    saveProgress();
    state.screen = 'diagreport';
    render();
    return;
  }
  state.diag.stage='mid';
  state.diag.midCorrect=null;
  const nd = diagDomains[state.diag.domainIndex].id;
  state.diag.current = shuffleOptions(diagItem(nd, 2, state.diag.usedItems));
  state.diag.currentLevel = 2;
  render();
};

function stationHint(d, info){
  if(info.status!=='active') return '';
  const lvl = state.levels[d.id]||1, st = state.stars[d.id]||0;
  const saved = state.attemptLogs[d.id];
  const n = (saved && saved.level===lvl) ? (saved.log||[]).length : 0;
  const anchorLine = lvl>=4 ? 'Du bist auf der höchsten Stufe!'
    : (n<8 ? `Noch ${8-n} Aufgaben, dann prüfen wir, ob du eine Stufe höher kannst.`
            : 'Schaffst du fast alles richtig, geht es eine Stufe hoch.');
  const cupLine = lvl>=3 ? `🏆 Pokal: ⭐ ${Math.min(st,MASTERY_STARS)} von ${MASTERY_STARS} und sicher auf Stufe 3`
                         : '🏆 Den Pokal gibt es ab Stufe 3.';
  const wait = nextLevelBlocked(d.id);
  const waitLine = wait.length ? `<br>⏳ Für die nächste Stufe übst du zuerst: ${wait.map(x=>`${x.d.name} (Stufe ${x.need})`).join(' &amp; ')}.` : '';
  return `<div class="station-hint">${anchorLine}<br>${cupLine}${waitLine}</div>`;
}

function videoButton(d, info){
  if(info.status==='locked') return '';
  const v = LERNVIDEOS.find(x=>x.domain===d.id);

  return `<button class="station-video" onclick="event.stopPropagation();showLumi('${v.id}','map')">🎬 Erklärvideo</button>`;
}

function stationCard(d, info){
  const lvl = state.levels[d.id]||1;
  const st = state.stars[d.id]||0;
  const anchors = '⚓'.repeat(lvl) + '·'.repeat(Math.max(0,4-lvl));
  const cls = 'station' + (info.status==='locked' ? ' locked' : info.status==='mastered' ? ' mastered' : info.status==='review' ? ' review' : '');
  const onclick = info.status==='locked' ? '' : `onclick="openDomain('${d.id}')"`;
  let badge = `<div class="stars-badge">⭐ ${st}</div>`;
  let extra = stationHint(d, info);
  if(info.status==='mastered') badge = `<div class="stars-badge">🏆 ${st}</div>`;
  if(info.status==='review'){
    badge = `<div class="stars-badge">🔁 Auffrischen</div>`;
    extra = `<div class="lock-note">Kurzer Check, ob das noch sicher sitzt.</div>`;
  }
  if(info.status==='locked'){
    badge = `<div class="stars-badge">🔒</div>`;
    const names = info.missing.map(x=>`${x.d.name} (Stufe ${x.need})`).join(' & ');
    extra = `<div class="lock-note">Kommt, sobald du in ${names} so weit bist.</div>`;
  }
  return `
    <div class="${cls}" ${onclick}>
      <div class="station-icon" style="background:${d.color}22;">${d.icon}</div>
      <div class="station-body">
        <h3>${d.name}</h3>
        <div class="sub">${d.sub}</div>
        <div class="anchors">${anchors}</div>
        ${extra}
        ${videoButton(d, info)}
      </div>
      ${badge}
    </div>`;
}

function screenMap(){
  ensureTrophies();
  const withStatus = domains.map(d => ({d, info: domainStatus(d)}));
  const known = state.knownAtStart || {};
  const showAll = !!state.showAllStations;

  // Reihenfolge: Auffrischung zuerst; dann Stationen, an denen etwas zu lernen ist
  // (nicht wartend), begonnene vor neuen, niedrige Stufe vor hoher.
  const rank = ({d,info}) => [info.status==='review'?0:1, (nextLevelBlocked(d.id).length && stationStarted(d.id))?1:0, stationStarted(d.id)?0:1, state.levels[d.id]||1, TIERS[d.id]||0, domains.indexOf(d)];
  const cmp = (a,b)=>{ const ra=rank(a), rb=rank(b); for(let i=0;i<ra.length;i++){ if(ra[i]!==rb[i]) return ra[i]-rb[i]; } return 0; };
  const needed = withStatus
    .filter(x => (x.info.status==='active' || x.info.status==='review') && !(known[x.d.id] && x.info.status==='active'))
    .sort(cmp);

  let wegList, moreList = [];
  if(showAll){
    const order = {active:0, review:1, mastered:2, locked:3};
    wegList = [...withStatus].sort((a,b)=> order[a.info.status]-order[b.info.status]);
  } else {
    // höchstens drei Stationen, davon höchstens eine neue (noch nicht begonnene)
    wegList = []; moreList = [];
    let newCount = 0;
    needed.forEach(x=>{
      const fresh = !stationStarted(x.d.id) && x.info.status!=='review';
      if(wegList.length<3 && (!fresh || newCount<1)){ wegList.push(x); if(fresh) newCount++; }
      else moreList.push(x);
    });
    // Ein Platz bleibt für Neues frei: Gibt es eine freigeschaltete neue Station, rückt sie
    // nach, damit parallel gelernt wird (die zuletzt einsortierte begonnene Station wartet unter "Weitere").
    if(wegList.length===3 && newCount===0){
      const idx = moreList.findIndex(x=>!stationStarted(x.d.id) && x.info.status!=='review');
      const last = wegList[2];
      if(idx>=0 && last.info.status!=='review'){
        const fresh = moreList.splice(idx,1)[0];
        wegList[2] = fresh; moreList.unshift(last);
      }
    }
  }
  const wegHtml = wegList.length
    ? wegList.map(x=>stationCard(x.d,x.info)).join('')
    : `<div class="shelf-empty">Im Moment ist keine Station dran. Schau ins Pokal-Regal oder frag deine Lehrkraft.</div>`;
  const wegTitle = showAll ? `<h2 class="map-h">Alle Stationen <small>(Lehrkraft-Ansicht)</small></h2>` : `<h2 class="map-h">Dein Weg</h2>`;
  const moreHtml = moreList.length ? `
    <button class="btn btn-ghost more-btn" onclick="toggleMoreStations()">${state.showMoreStations ? '▲ Weniger anzeigen' : `➕ Weitere Stationen (${moreList.length})`}</button>
    ${state.showMoreStations ? `<div class="map-wrap">${moreList.map(x=>stationCard(x.d,x.info)).join('')}</div>` : ''}` : '';
  const lockedCount = withStatus.filter(x=>x.info.status==='locked').length;
  const lockedNote = (!showAll && lockedCount) ? `<p class="footnote" style="text-align:center;margin-top:10px;">🔒 Noch ${lockedCount} ${lockedCount===1?'Station wartet':'Stationen warten'} auf dich – sie kommen, sobald du bereit bist.</p>` : '';

  // Pokal-Regal: einmal verdiente Pokale bleiben; "schon gekonnt" ohne Pokal/Sterne.
  const trophyDomains = domains.filter(d=>state.trophies && state.trophies[d.id]);
  const knownDomains = domains.filter(d=>known[d.id] && !(state.trophies && state.trophies[d.id]));
  const tile = (d, cls, line) => {
    const locked = domainStatus(d).status==='locked';
    return `<button class="shelf-tile ${cls}" ${locked?'disabled':`onclick="openDomain('${d.id}')"`}><span class="si">${d.icon}</span><span class="sn">${d.name}</span><span class="sc">${line}</span></button>`;
  };
  const tiles = trophyDomains.map(d=>tile(d,'',`🏆 ⭐ ${state.stars[d.id]||0}`)).join('')
              + knownDomains.map(d=>tile(d,'known','✔ schon gekonnt')).join('');
  const totalStars = Object.values(state.stars||{}).reduce((a,b)=>a+(b||0),0);
  const shelfHtml = `
    <div class="shelf">
      <div class="shelf-head"><h3>🏆 Dein Pokal-Regal</h3><div class="shelf-total">⭐ ${totalStars}</div></div>
      <div class="shelf-row">${tiles || '<div class="shelf-empty">Hier sammelst du deine Pokale. Jede Station, die du sicher kannst, bekommt hier einen Platz.</div>'}</div>
    </div>`;

  const drillBanner = state.needsBasicLetterDrill ? `
    <div class="prompt-card" style="text-align:center;border-color:var(--coral);margin-bottom:16px;">
      ${mascotIcon(44)}
      <div style="font-size:0.95rem;color:var(--harbor-dark);font-family:'Baloo 2';font-weight:700;margin-top:4px;">🔤 Kurzes Buchstaben-Training empfohlen</div>
      <p style="font-size:0.88rem;color:#4B6473;margin:6px 0 10px;">Ein paar Buchstaben-Laute wirken noch unsicher.</p>
      <button class="btn btn-primary" style="padding:10px 20px;" onclick="startLetterDrill()">▶️ Jetzt üben</button>
    </div>` : '';

  const vertiefungBanner = advancedUnlocked() ? `
    <div class="prompt-card" style="text-align:center;border-color:var(--foam);margin-bottom:16px;">
      ${mascotIcon(44)}
      <div style="font-size:0.95rem;color:var(--harbor-dark);font-family:'Baloo 2';font-weight:700;margin-top:4px;">🔭 Vertiefung freigeschaltet!</div>
      <p style="font-size:0.88rem;color:#4B6473;margin:6px 0 10px;">Für besonders sichere Leser: Blitzlesen &amp; Textverständnis.</p>
      <button class="btn btn-primary" style="padding:10px 20px;" onclick="goVertiefung()">▶️ Entdecken</button>
    </div>` : '';

  const wordStoreBanner = (state.wordStore && state.wordStore.length>0) ? `
    <div class="prompt-card" style="text-align:center;border-color:#6E4A8E;margin-bottom:16px;">
      ${mascotIcon(44)}
      <div style="font-size:0.95rem;color:var(--harbor-dark);font-family:'Baloo 2';font-weight:700;margin-top:4px;">📥 ${state.wordStore.length} eigene Wörter zum Üben</div>
      <p style="font-size:0.88rem;color:#4B6473;margin:6px 0 10px;">Wörter aus Flaschenpost, die noch nicht sicher saßen.</p>
      <button class="btn btn-primary" style="padding:10px 20px;" onclick="startWordReview()">▶️ Jetzt üben</button>
    </div>` : '';

  const dueCategories = Object.keys(ERROR_CATEGORIES).filter(cat => (state.errorProfile[cat]||0) >= 3);
  const categoryBanner = dueCategories.length>0 ? `
    <div class="prompt-card" style="text-align:center;border-color:#B24C2F;margin-bottom:16px;">
      ${mascotIcon(44)}
      <div style="font-size:0.95rem;color:var(--harbor-dark);font-family:'Baloo 2';font-weight:700;margin-top:4px;">🎯 Gezielt üben lohnt sich</div>
      <p style="font-size:0.88rem;color:#4B6473;margin:6px 0 10px;">Bei diesen Rechtschreibmustern gab es zuletzt mehrere Fehler:</p>
      ${dueCategories.map(cat=>`<button class="btn btn-primary" style="padding:8px 16px;margin:4px;font-size:0.88rem;" onclick="startCategoryReview('${cat}')">${ERROR_CATEGORIES[cat]}</button>`).join('')}
    </div>` : '';


  return `
  ${topbar('Deine Hafenkarte','Wähle eine Station', false)}
  <main>
    <div style="text-align:center;margin-top:10px;">${mascotIcon(64)}</div>
    <p style="font-size:0.92rem;color:#4B6473;margin:10px 0 4px;text-align:center;">Lotse Lumi hat deinen Startpunkt gefunden. Übe in jeder Station – die Aufgaben passen sich automatisch an dein Tempo an.</p>
    ${drillBanner}
    ${vertiefungBanner}
    ${wordStoreBanner}
    ${categoryBanner}
    ${wegTitle}
    <div class="map-wrap">${wegHtml}</div>
    ${moreHtml}
    ${lockedNote}
    ${shelfHtml}
    <p class="footnote" style="text-align:center;">⚓ Stufe (1–4) · ⭐ Sterne · 🏆 Pokal <button class="help-link" onclick="toggleStarHelp()">❓ So bekomme ich ⭐ ⚓ 🏆</button></p>
  </main>`;
}

function curVideo(){ return LERNVIDEOS.find(v=>v.id===lumiRun.vid) || LERNVIDEOS[0]; }
function curScenes(){ return curVideo().scenes; }

function lumiActive(tok){ return tok===lumiRun.token && state.screen==='lumi' && document.getElementById('lumiCap'); }
function lumiHalt(){
  lumiRun.token++; clearTimeout(lumiRun.timer); lumiRun.timer=null;
  try{ stopAllAudio(); }catch(e){}
}
function lumiShow(i){
  const sc = curScenes()[i];
  const img = document.getElementById('lumiImg'), sum = document.getElementById('lumiSum');
  if(sc.img){ img.style.display='block'; img.src = sc.img; img.classList.remove('kb'); void img.offsetWidth; img.classList.add('kb'); sum.style.display='none'; }
  else { img.style.display='none'; sum.style.display='flex'; }
  sum.innerHTML = sc.summary ? `<h2>${sc.summary.title}</h2><div class="lumi-tiles">${sc.summary.tiles.map(t=>`<div class="lumi-tile"><span>${t[0]}</span>${t[1]}</div>`).join('')}</div>` : '';

  document.getElementById('lumiProg').style.width = ((i+1)/curScenes().length*100)+'%';

function lumiSpeakStep(sceneIdx, stepIdx, tok, done){
  const st = curScenes()[sceneIdx].steps[stepIdx];
  const key = curVideo().prefix+'_'+(sceneIdx+1)+'_'+(stepIdx+1);
  playAudioKey(key, ok=>{
    if(!lumiActive(tok)) return;
    if(ok){ done(); return; }
    speak(st.say, 0.85);
    lumiRun.timer = setTimeout(()=>{ if(lumiActive(tok)) done(); }, Math.max(1800, st.say.length*85));
  });
}
function lumiRunStep(){
  const tok = ++lumiRun.token;
  const sc = curScenes()[lumiRun.scene];
  if(lumiRun.step >= sc.steps.length){
    if(lumiRun.scene < curScenes().length-1){
      lumiRun.scene++; lumiRun.step=0; lumiShow(lumiRun.scene);
      lumiRun.timer = setTimeout(()=>{ if(lumiActive(tok)) lumiRunStep(); }, 700);
    } else {
      lumiRun.playing=false;
      document.getElementById('lumiCap').textContent='🎉 Geschafft!';
      document.getElementById('lumiPP').textContent='▶ Nochmal';
      document.getElementById('lumiGo').style.display='block';
    }
    return;
  }
  const st = sc.steps[lumiRun.step];
  document.getElementById('lumiCap').textContent = st.cap;
  if(sc.summary)
    document.querySelectorAll('.lumi-tile').forEach((t,k)=>t.classList.toggle('lit', k < lumiRun.step));
  const s = lumiRun.scene, p = lumiRun.step;
  lumiSpeakStep(s, p, tok, ()=>{
    lumiRun.step++;
    lumiRun.timer = setTimeout(()=>{ if(lumiActive(tok)) lumiRunStep(); }, st.pause);
  });
}

window.lumiGo = function(i){
  i = Math.max(0, Math.min(curScenes().length-1, i));

  document.getElementById('lumiStart').style.display='none';

window.lumiFinish = function(){

  if(lumiRun.returnTo==='map'){ state.screen='map'; render(); return; }
  state.screen='goal'; render(); speakGoal();
};

window.openDomain = function(domainId){
  const d = domains.find(x=>x.id===domainId);
  const info = d ? domainStatus(d) : null;
  if(info && info.status==='locked') return;
  state.pendingDomain = domainId;
  state.pendingReview = !!(info && info.status==='review');
  const level = state.levels[domainId] || 1;
  const discoverKey = domainId + ':' + level;
  const needsDiscover = ['grundwortschatz'].includes(domainId) && !state.pendingReview && !state.discoverSeen[discoverKey];
  if(needsDiscover){
    state.discoverIndex = 0;
    state.screen = 'discover';
    render();
    speakDiscoverPair();
    return;
  }
  // Erster Besuch der Buchstabenbrücke: zuerst das kurze Erklärvideo.
  if(domainId==='buchstabe' && !state.pendingReview && !state.discoverSeen[LUMI_SEEN_KEY]){
    showLumi('lumi','goal');
    return;
  }
  state.screen = 'goal';
  render();
  speakGoal();
};

window.speakDiscoverPair = function(){
  const d = anyDomain(state.pendingDomain);
  const level = state.levels[d.id] || 1;
  const pairs = discoveryPairsFor(d.id, level);
  const item = pairs[state.discoverIndex || 0];
  if(!item) return;
  const correct = item.options[item.answer];
  const wrong = item.options[1-item.answer];
  speak(wrong + ' und ' + correct + '. Klingen fast gleich, oder? Aber nur eins ist richtig: ' + correct + '. ' + item.tip);
};

window.discoverNext = function(){
  const d = anyDomain(state.pendingDomain);
  const level = state.levels[d.id] || 1;
  const key = d.id + ':' + level;
  const pairs = discoveryPairsFor(d.id, level);
  if((state.discoverIndex||0) < pairs.length-1){
    state.discoverIndex = (state.discoverIndex||0) + 1;
    render();
    speakDiscoverPair();
  } else {
    state.discoverSeen[key] = true;
    saveProgress();
    if(state.discoverResumePractice){
      state.discoverResumePractice = false;
      state.screen = 'practice';
      pickPracticeItem();
      render();
      return;
    }
    state.screen = 'goal';
    render();
    speakGoal();
  }
};

/* ============================================================
   EIGENE BILDSCHIRMTASTATUR (QWERTZ) – ohne echtes Eingabefeld
   Es gibt kein <input>, daher erscheinen weder Wortvorschläge noch Autokorrektur,
   Diktierfunktion oder Emoji-Taste. Eine angeschlossene Hardware-Tastatur wird
   über keydown abgefangen und schreibt ebenfalls nur in unsere Anzeige.
   ============================================================ */
const KB_ROWS = [['q','w','e','r','t','z','u','i','o','p','ü'], ['a','s','d','f','g','h','j','k','l','ö','ä'], ['⇧','y','x','c','v','b','n','m','ß','⌫']];
let kbShiftOn = false, kbHwShift = false;
function kbEntryHtml(handlerName){
  kbShiftOn = true;   // Wortanfang: zuerst Großbuchstaben (die meisten Wörter sind Nomen), danach automatisch klein
  const rows = KB_ROWS.map(r=>'<div class="kb-row">' + r.map(k=>{
    if(k==='⇧') return `<button type="button" class="kb-key kb-wide kb-on" id="kbShiftKey" onclick="kbShift()" aria-label="Großbuchstabe">⇧</button>`;
    if(k==='⌫') return `<button type="button" class="kb-key kb-wide" onclick="kbBack()" aria-label="Löschen">⌫</button>`;
    return `<button type="button" class="kb-key" data-k="${k}" onclick="kbPress('${k}')">${k==='ß' ? k : k.toUpperCase()}</button>`;
  }).join('') + '</div>').join('');
  return `
    <input type="hidden" id="textAnswer" value="">
    <div class="kb-display" id="kbDisplay"><span class="kb-ph">Schreibe das Wort</span></div>
    ${state.showOsk===false ? '' : `<div class="kb-keys">${rows}<div class="kb-row"><button type="button" class="kb-key kb-space" onclick="kbPress(' ')" aria-label="Leerzeichen">␣</button></div></div>`}
    <button class="btn btn-primary btn-block kb-ok" style="margin-top:12px;" onclick="${handlerName}(document.getElementById('textAnswer').value)">✅ OK</button>`;
}
function kbRefresh(){
  const h = document.getElementById('textAnswer'), d = document.getElementById('kbDisplay');
  if(!h || !d) return;
  d.innerHTML = h.value ? escapeHtml(h.value).replace(/ /g,'&nbsp;') + '<span class="kb-caret"></span>' : '<span class="kb-ph">Schreibe das Wort</span>';
  const s = document.getElementById('kbShiftKey'); if(s) s.classList.toggle('kb-on', kbShiftOn);
  document.querySelectorAll('.kb-key[data-k]').forEach(k=>{ const c = k.getAttribute('data-k'); k.textContent = (kbShiftOn && c!=='ß') ? c.toUpperCase() : c; });
}
window.kbPress = function(ch, fromHw){
  const h = document.getElementById('textAnswer'); if(!h) return;
  if(h.value.length >= 40) return;
  // Großbuchstabe, wenn die Bildschirm-Umschalttaste aktiv ist ODER die Hardware-Umschalttaste gehalten wird
  const up = kbShiftOn || (!fromHw && kbHwShift);
  h.value += (up && ch!=='ß') ? ch.toUpperCase() : ch;
  kbShiftOn = false;
  kbRefresh();
};
window.kbBack = function(){ const h = document.getElementById('textAnswer'); if(!h) return; h.value = h.value.slice(0,-1); if(!h.value) kbShiftOn = true; kbRefresh(); };
window.kbShift = function(){ kbShiftOn = !kbShiftOn; kbRefresh(); };
let kbShiftUsed = false;
document.addEventListener('keyup', function(e){
  if(e.key==='Shift'){
    kbHwShift = false;
    // Hardware-Umschalttaste kurz angetippt (ohne Buchstaben): schaltet Groß/Klein um, z. B. für ein kleingeschriebenes Wortanfang
    if(!kbShiftUsed && document.getElementById('kbDisplay')){ kbShiftOn = !kbShiftOn; kbRefresh(); }
    kbShiftUsed = false;
  }
});
document.addEventListener('keydown', function(e){
  if(e.key==='Shift') kbHwShift = true;
  else if(kbHwShift) kbShiftUsed = true;
  if(!document.getElementById('kbDisplay')) return;
  const ae = document.activeElement;
  if(ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA' || ae.isContentEditable) && ae.type!=='hidden') return;
  if(e.ctrlKey || e.metaKey) return;
  if(e.key==='Backspace'){ e.preventDefault(); kbBack(); }
  else if(e.key==='Enter'){ e.preventDefault(); const b = document.querySelector('.kb-ok'); if(b) b.click(); }
  else if(e.key && e.key.length===1 && /^[a-zA-ZäöüÄÖÜß ]$/.test(e.key)){ e.preventDefault(); kbPress((e.shiftKey && e.key===e.key.toLowerCase() && e.key!=='ß') ? e.key.toUpperCase() : e.key, true); }
});
window.toggleOsk = function(){ state.showOsk = (state.showOsk===false); saveProgress(); render(); };

/* ============================================================
   STUNDENRHYTHMUS: Netto-Arbeitszeit, Arbeitsblöcke, stille Pausen, Abschlussrunde
   - Alle Kinder arbeiten die gleiche Netto-Zeit (Förderstunde 30 Min. = 20 Min., 45 Min. = 32 Min.).
   - Die Blocklänge (Zeit bis zur nächsten stillen Pause) passt sich je Kind selbst an.
   - Pausen kommen nach der Uhr, nie als Folge von Raten (sonst würde Raten belohnt).
   ============================================================ */
const NET_TARGET = {30:20, 45:32};
const BLOCK_START = 5, BLOCK_MIN = 3, BLOCK_MAX = 10;
const QUICK_MS = 1100, IDLE_CAP_MS = 90000, SESSION_GAP_MS = 20*60000, FINAL_MS = 120000;
const SESSION_KEY = 'buchstabenhafen_session_v1';
function netTargetMs(){ return (NET_TARGET[state.sessionMin]||20)*60000; }
function endur(){ if(!state.endurance) state.endurance = {blockMin:BLOCK_START, stable:0, hist:[]}; return state.endurance; }
function saveSession(){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(state.session)); }catch(e){} }
function loadSession(){
  try{ const raw = localStorage.getItem(SESSION_KEY); if(raw){ const s = JSON.parse(raw); if(s && s.date===todayStr() && Date.now()-s.last < SESSION_GAP_MS) state.session = s; } }catch(e){}
}
function finalizeSession(){
  const s = state.session;
  if(s && !s.logged && s.net>=60000){
    s.logged = true;
    state.sessionLog = state.sessionLog || [];
    state.sessionLog.push({d:s.date, min:Math.round(s.net/6000)/10, soll:(NET_TARGET[state.sessionMin]||20), blocks:s.blocks, pauses:s.pauses, guess:s.guess, items:s.items, ok:s.ok||0, blockMin:endur().blockMin, std:state.sessionMin||30});
    state.sessionLog = state.sessionLog.slice(-40);
    saveProgress();
  }
}
function sessionEnsure(){
  const now = Date.now(), day = todayStr();
  let s = state.session;
  if(s && (s.date!==day || now - s.last > SESSION_GAP_MS)){ finalizeSession(); s = null; }
  if(!s){ s = state.session = {date:day, start:now, last:now, net:0, blockNet:0, blockItems:[], blocks:0, pauses:0, guess:0, items:0, ok:0, ended:false, easyNext:false, logged:false}; saveSession(); }
  return s;
}
function sessionTick(){
  const s = state.session; if(!s) return;
  const now = Date.now();
  const d = Math.min(Math.max(0, now - s.last), IDLE_CAP_MS);
  s.net += d; s.blockNet += d; s.last = now;
  saveSession();
}
function median(a){ const b=a.slice().sort((x,y)=>x-y), m=b.length>>1; return b.length ? (b.length%2 ? b[m] : (b[m-1]+b[m])/2) : 0; }
function evaluateBlock(s){
  const it = s.blockItems, n = it.length, e = endur();
  s.blocks++;
  if(n<3) return;
  const h = n>>1, a1 = it.slice(0,h), a2 = it.slice(h);
  const acc = x => x.filter(i=>i.c).length/x.length;
  const r1 = a1.map(i=>i.rt).filter(x=>x!=null), r2 = a2.map(i=>i.rt).filter(x=>x!=null);
  const rtUp = r1.length>=2 && r2.length>=2 && median(r2) > 1.5*median(r1);
  const decline = it.some(i=>i.g) || (n>=4 && acc(a2) <= acc(a1)-0.3) || rtUp;
  const from = e.blockMin;
  if(decline){ e.blockMin = Math.max(BLOCK_MIN, e.blockMin-1); e.stable = 0; s.easyNext = true; }
  else { e.stable = (e.stable||0)+1; if(e.stable>=2){ e.blockMin = Math.min(BLOCK_MAX, e.blockMin+1); e.stable = 0; } }
  e.hist.push({d:todayStr(), from, to:e.blockMin, n, decline});
  if(e.hist.length>40) e.hist.shift();
}
// Gibt 'sessionend', 'pause' oder null zurück
function sessionGate(){
  const s = sessionEnsure(); sessionTick();
  const left = netTargetMs() - s.net;
  if(s.ended || left <= -30000){ s.ended = true; finalizeSession(); return 'sessionend'; }
  if(s.blockNet >= endur().blockMin*60000 && left > FINAL_MS){
    evaluateBlock(s); s.blockNet = 0; s.blockItems = []; s.pauses++;
    saveSession(); saveProgress();
    return 'pause';
  }
  return null;
}
// Erfolgsrunde: leichtere Aufgaben (ohne Wertung) nach einem Leistungsabfall und zum Schluss der Stunde
function maybeEasy(p){
  if(p.isReview || p.isWordReview) return;
  const s = state.session; if(!s) return;
  const left = netTargetMs() - s.net;
  if(p.easy && !p.final && p.easyUntil && p.itemsDone>=p.easyUntil){ p.easy = false; p.easyUntil = 0; p.queue = []; }
  if(!p.easy && left <= FINAL_MS){
    p.easy = true; p.final = true; p.easyUntil = p.itemsDone+3; p.sessionTarget = Math.min(p.sessionTarget||6, p.easyUntil); p.queue = [];
  } else if(!p.easy && s.easyNext){
    s.easyNext = false; p.easy = true; p.easyUntil = p.itemsDone+2; p.queue = [];
  }
}
function enterGate(g, ret){
  if(g==='pause'){ goPause(ret); return; }
  state.screen = g; render();
}

function pzBody(){ return `<path d="M52 190 Q52 112 84 104 L136 104 Q168 112 168 190 Z" fill="${PZ_SHIRT}" stroke="${PZ_LINE}" stroke-width="3"/>`; }
function pzHead(cx,cy){ return `<rect x="${cx-8}" y="${cy+20}" width="16" height="16" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="26" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="3"/><circle cx="${cx-9}" cy="${cy-3}" r="3" fill="${PZ_LINE}"/><circle cx="${cx+9}" cy="${cy-3}" r="3" fill="${PZ_LINE}"/><path d="M${cx-9} ${cy+9} Q${cx} ${cy+16} ${cx+9} ${cy+9}" stroke="${PZ_LINE}" stroke-width="3" fill="none" stroke-linecap="round"/>`; }
function pzHand(withFingers){ const arm = `<rect x="-14" y="2" width="28" height="46" rx="8" fill="${PZ_SHIRT}" stroke="${PZ_LINE}" stroke-width="3"/>`; // Handfläche mit Wurzel im Ursprung, Finger zeigen nach oben
  const f = (x,len,rot)=>`<g transform="translate(${x},-34)"><g>${withFingers?`<animateTransform attributeName="transform" type="rotate" values="${rot};0;${rot}" dur="3s" repeatCount="indefinite" additive="replace"/>`:''}<rect x="-5" y="${-len}" width="10" height="${len}" rx="5" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="2.5"/></g></g>`;
  return arm + `<rect x="-22" y="-38" width="44" height="42" rx="12" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="3"/>` +
    (withFingers ? f(-15,30,-34)+f(-5,36,-12)+f(5,36,12)+f(15,30,34) : f(-15,26,0)+f(-5,32,0)+f(5,32,0)+f(15,26,0)) +
    `<rect x="-36" y="-22" width="16" height="9" rx="4.5" transform="rotate(-30 -22 -18)" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="2.5"/>`;
}
function pauseSvg(key){
  const W = (inner)=>`<svg viewBox="0 0 220 190" width="250" height="216" style="display:block;margin:6px auto;" aria-hidden="true">${pzArrowDefs()}${inner}</svg>`;
  if(key==='schulter'){
    const sh = (cx,dir)=>`<circle r="17" fill="${PZ_SHIRT}" stroke="${PZ_LINE}" stroke-width="3"><animateMotion dur="3.2s" repeatCount="indefinite" path="M${cx} 108 m-10 0 a10 10 0 1 ${dir} 20 0 a10 10 0 1 ${dir} -20 0"/></circle>`;
    return W(`${pzBody()}${pzHead(110,50)}${sh(60,0)}${sh(160,1)}
      <path d="M30 80 A22 22 0 1 1 33 118" fill="none" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>
      <path d="M190 80 A22 22 0 1 0 187 118" fill="none" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>`);
  }
  if(key==='haende'){
    const hand = (x,y,v)=>`<g transform="translate(${x},${y})"><g><animateTransform attributeName="transform" type="rotate" values="-22;22;-22" dur="0.5s" repeatCount="indefinite"/><g transform="rotate(${v})">${pzHand(false)}</g></g></g>`;
    const drop = (x,d)=>`<circle cx="${x}" cy="40" r="5" fill="#6BC3E8"><animate attributeName="cy" values="40;170" dur="1.2s" begin="${d}s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.2s" begin="${d}s" repeatCount="indefinite"/></circle>`;
    return W(`${hand(62,150,0)}${hand(158,150,0)}${drop(20,0)}${drop(110,0.4)}${drop(200,0.8)}${drop(86,0.6)}${drop(135,0.2)}
      <path d="M20 110 Q10 90 20 70" fill="none" stroke="${PZ_ARROW}" stroke-width="4" stroke-linecap="round"/><path d="M200 110 Q210 90 200 70" fill="none" stroke="${PZ_ARROW}" stroke-width="4" stroke-linecap="round"/>`);
  }
  if(key==='finger'){
    return W(`<g transform="translate(110,172)">${pzHand(true)}</g>
      <path d="M44 70 L20 50 M176 70 L200 50 M110 30 L110 8" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>`);
  }
  if(key==='augen'){
    const eye = (cx)=>`<ellipse cx="${cx}" cy="95" rx="24" ry="20" fill="#fff" stroke="${PZ_LINE}" stroke-width="3"/><circle cx="${cx}" cy="95" r="9" fill="${PZ_LINE}"><animate attributeName="cx" values="${cx-11};${cx+11};${cx-11}" dur="4s" repeatCount="indefinite"/></circle>`;
    return W(`<circle cx="110" cy="95" r="80" fill="${PZ_SKIN}" stroke="${PZ_LINE}" stroke-width="3"/>${eye(76)}${eye(144)}
      <path d="M86 150 Q110 164 134 150" stroke="${PZ_LINE}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <path d="M40 22 L12 22" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/><path d="M180 22 L208 22" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>`);
  }
  if(key==='atem'){
    return W(`<circle cx="110" cy="80" r="30" fill="#BFE9F2" stroke="#4FA8C2" stroke-width="4"><animate attributeName="r" values="30;70;30" dur="8s" repeatCount="indefinite"/></circle>
      <text x="110" y="182" text-anchor="middle" font-size="26" font-weight="700" font-family="Baloo 2,Arial,sans-serif" fill="${PZ_LINE}">einatmen<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/></text>
      <text x="110" y="182" text-anchor="middle" font-size="26" font-weight="700" font-family="Baloo 2,Arial,sans-serif" fill="${PZ_LINE}" opacity="0">ausatmen<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="8s" repeatCount="indefinite"/></text>`);
  }
  if(key==='nacken'){
    return W(`${pzBody()}<g><animateTransform attributeName="transform" type="rotate" values="-20 110 86;20 110 86;-20 110 86" dur="4s" repeatCount="indefinite"/>${pzHead(110,50)}</g>
      <path d="M52 22 A70 70 0 0 0 30 66" fill="none" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>
      <path d="M168 22 A70 70 0 0 1 190 66" fill="none" stroke="${PZ_ARROW}" stroke-width="5" stroke-linecap="round" marker-end="url(#pzah)"/>`);
  }
  if(key==='fuesse'){
    const shoe = (x)=>`<g transform="translate(${x},0)"><g><animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="2s" repeatCount="indefinite"/><path d="M-22 120 L-22 150 Q-22 160 -12 160 L36 160 Q46 160 46 150 Q46 138 30 136 L8 128 L8 120 Z" fill="#E2672E" stroke="${PZ_LINE}" stroke-width="3"/><rect x="-26" y="160" width="76" height="9" rx="4" fill="${PZ_LINE}"/></g></g>`;
    const ar = (x)=>`<path d="M${x} 40 L${x} 100" stroke="${PZ_ARROW}" stroke-width="6" stroke-linecap="round" marker-end="url(#pzah)"><animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></path>`;
    return W(`<rect x="10" y="172" width="200" height="8" rx="4" fill="#B9A58A"/>${shoe(50)}${shoe(130)}${ar(70)}${ar(150)}`);
  }
  return '';
}

const PAUSE_EX = [
  {key:'schulter', title:'Schultern kreisen', text:'Zieh die Schultern hoch bis zu den Ohren. Dann kreise die Schultern ganz langsam: nach hinten, nach unten und wieder nach oben.'},
  {key:'haende',   title:'Hände ausschütteln', text:'Schüttle deine Hände ganz locker aus, so als wären sie nass. Mach es leise.'},
  {key:'finger',   title:'Finger strecken', text:'Spreize alle Finger weit auseinander. Dann drücke die Finger wieder zusammen. Wechsle ganz langsam hin und her.'},
  {key:'augen',    title:'Augen ausruhen', text:'Schau mit den Augen ganz langsam nach links und nach rechts, ohne den Kopf zu bewegen. Danach schau weit weg und zähle leise bis fünf.'},
  {key:'atem',     title:'Atem-Kreis', text:'Atme durch die Nase ein, während der Kreis größer wird. Atme langsam aus, während er kleiner wird.'},
  {key:'nacken',   title:'Nacken dehnen', text:'Neige den Kopf langsam zur rechten Schulter, dann zur Mitte, dann zur linken Schulter. Immer ganz langsam.'},
  {key:'fuesse',   title:'Füße drücken', text:'Drücke deine Füße fest auf den Boden und zähle leise bis fünf. Dann lass ganz locker.'},
];
const PAUSE_SEC = 20;
let pauseTimers = [];
function clearPauseTimers(){ pauseTimers.forEach(clearTimeout); pauseTimers = []; }
function pauseExercises(){
  const i = ((state.pauseIdx||1)-1)*2;
  return [PAUSE_EX[i%PAUSE_EX.length], PAUSE_EX[(i+1)%PAUSE_EX.length]];
}
function goPause(ret){
  clearPauseTimers();
  state.pauseReturn = ret || 'practice';
  state.pauseIdx = (state.pauseIdx||0) + 1;
  state.pauseStep = 0;
  state.screen = 'pause';
  render();
  speakPause();
  pauseTimers.push(setTimeout(()=>{ if(state.screen==='pause'){ state.pauseStep = 1; render(); speakPause(); } }, PAUSE_SEC*1000));
  pauseTimers.push(setTimeout(()=>{ if(state.screen==='pause'){ state.pauseStep = 2; render(); speakPause(); } }, PAUSE_SEC*2000));
}
window.speakPause = function(){
  const ex = pauseExercises(), step = state.pauseStep||0;
  if(step>=2){ speak('Gut gemacht! Weiter geht es.'); return; }
  const cur = ex[step];
  speak((step===0 ? 'Pause. Bleib an deinem Platz. ' : '') + cur.title + '. ' + cur.text);
};
function screenPause(){
  const ex = pauseExercises(), step = state.pauseStep||0;
  const done = step>=2;
  const cur = ex[Math.min(step,1)];
  return `
  <div class="topbar"><div class="topbar-row"><div></div><div style="text-align:center;flex:1;"><h1>Pause</h1><div class="sub">Leise bleiben und mitmachen</div></div><div></div></div><div class="wave"></div></div>
  <main>
    <div class="prompt-card" style="text-align:center;">
      <div style="margin-bottom:4px;">${mascotIcon(56)}</div>
      ${done ? `
        <div class="task-instr" style="font-size:1.4rem;">Gut gemacht! Weiter geht's.</div>
        <p style="font-size:1rem;color:#4B6473;margin:10px 0;">Dein Kopf ist wieder frisch.</p>
        <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="endPause()">✅ Weiter</button>
      ` : `
        <div style="font-size:0.85rem;color:#6B7F8C;">Übung ${step+1} von 2 · bleib an deinem Platz</div>
        ${pauseSvg(cur.key)}
        <div class="task-instr" style="font-size:1.3rem;">${cur.title} <button class="speak-btn" style="vertical-align:middle;" onclick="speakPause()">🔊</button></div>
        <p style="font-size:1.05rem;line-height:1.5;color:var(--harbor-dark);margin:8px 6px 14px;">${cur.text}</p>
        <div class="pz-track"><div class="pz-fill" style="animation-duration:${PAUSE_SEC}s;"></div></div>
      `}
    </div>
  </main>`;
}
window.endPause = function(){
  clearPauseTimers(); try{ stopAllAudio(); }catch(e){}
  const s = sessionEnsure(); s.last = Date.now(); saveSession();   // Pausenzeit zählt nicht zur Arbeitszeit
  state.screen = state.pauseReturn || 'practice';
  if(state.screen==='practice' && state.practice) state.practice.shownAt = Date.now();
  render();
};

window.holdStart = function(){ holdEnd(); holdTimer = setTimeout(()=>{ holdTimer=null; if(state.screen==='sessionend') restartSession(); else endSessionNow(); }, 3000); };

function holdHtml(){

function sessionBar(){
  const s = state.session; if(!s) return '';
  const spent = s.net + Math.min(Math.max(0, Date.now()-s.last), IDLE_CAP_MS);

window.startPracticeSession = function(){
  const domainId = state.pendingDomain;
  const isReview = state.pendingReview;
  const level = state.levels[domainId] || 1;
  let saved = state.attemptLogs[domainId];
  if(!saved || saved.level !== level){
    saved = {level, log:[]};
    state.attemptLogs[domainId] = saved;
  }
  state.practice = {
    domainId, level, isReview,
    sessionTarget: isReview ? 4 : (domainId==='satzbau' ? 2 : (domainId==='lesekai' && level>=4 ? 3 : 6)), sessionErrors:0,
    attemptLog: saved.log, queue:[],
    itemsDone:0, answered:false, lastCorrect:null, current:null,
    levelUpMsg:null, levelDownMsg:null,
  };
  if(isReview){
    // Wiederholung mischt Stufe 2 und 3, um wirklich gefestigtes Wissen zu prüfen
    const pool = [...(content[domainId][2]||[]), ...(content[domainId][3]||[])];
    state.practice.queue = shuffle(pool);
  }
  sessionEnsure(); sessionTick();
  state.practice.recent = [];
  maybeEasy(state.practice);
  pickPracticeItem();
  state.screen = 'practice';
  const g0 = sessionGate();
  if(g0){ enterGate(g0, 'practice'); return; }
  render();
};

// Braucht diese Übung ein Blatt Papier zum Aufschreiben? (Papier-Aufgaben, Diktat, Satzwerft)
function needsPaper(domainId, level, isReview){
  if(domainId==='satzbau' || domainId==='diktat') return true;
  const lv = isReview ? [2,3] : [level];
  return lv.some(l => (content[domainId]&&content[domainId][l]||[]).some(i=>i.type==='papier' || i.type==='dictate'));
}

// Der Papier-Hinweis erscheint erst, wenn das Kind wirklich auf Papier schreiben soll und danach
// mit der Lösung auf dem Bildschirm vergleicht (Diktat, Papier-Aufgabe, Satzbau-Schreibphase) –
// nicht bei Aufgaben, bei denen am Tablet getippt wird.
function paperNeededNow(p){
  const it = p.current; if(!it) return false;
  if(it.type==='dictate') return !p.answered && (!p.dictatePhase || p.dictatePhase==='listen');
  if(it.type==='papier') return !p.answered && (!p.papierPhase || p.papierPhase==='write');
  if(it.type==='satzbau') return !p.answered && p.sbStep==='write';
  return false;
}

function discoveryPairsFor(domainId, level){
  return (content[domainId][level]||[]).filter(it=>it.options && it.options.length===2).slice(0,3);
}

function screenDiscover(){
  const d = anyDomain(state.pendingDomain);
  const level = state.levels[d.id] || 1;
  const pairs = discoveryPairsFor(d.id, level);
  const idx = state.discoverIndex || 0;
  const item = pairs[idx];
  if(!item){
    // Kein passendes Wortpaar auf dieser Stufe gefunden - Entdecker-Seite überspringen.
    state.discoverSeen[d.id+':'+level] = true;
    state.screen = 'goal';
    return screenGoal();
  }
  const correct = item.options[item.answer];
  const wrong = item.options[1-item.answer];
  const isLast = idx >= pairs.length-1;
  return `
  ${topbar('Entdecken', null, false)}
  <main>
    <div class="prompt-card" style="text-align:center;margin-top:16px;">
      ${mascotIcon(60)}
      <div class="task-instr" style="margin-top:8px;">🔍 Entdecke die Besonderheit!</div>
      <div style="display:flex;justify-content:center;gap:20px;margin:18px 0;">
        <div style="padding:14px 18px;border-radius:14px;background:#E8F5EE;border:3px solid #4FA893;">
          <div style="font-size:1.5rem;">✅</div>
          <div style="font-size:1.3rem;font-family:'Baloo 2';font-weight:700;color:var(--harbor-dark);margin-top:2px;">${correct}</div>
        </div>
        <div style="padding:14px 18px;border-radius:14px;background:#FBEDE8;border:3px solid #D9A08C;">
          <div style="font-size:1.5rem;">❌</div>
          <div style="font-size:1.3rem;font-family:'Baloo 2';font-weight:700;color:var(--harbor-dark);margin-top:2px;text-decoration:line-through;">${wrong}</div>
        </div>
      </div>
      <p style="font-size:0.95rem;color:#4B6473;">Beide klingen fast gleich. Aber nur eins ist richtig – und dafür gibt es einen Grund:</p>
      <p style="font-size:1.05rem;font-family:'Baloo 2';font-weight:600;color:var(--harbor-dark);margin-top:6px;">${item.tip}</p>
      <button class="speak-btn" onclick="speakDiscoverPair()">🔊</button>
      <button class="btn btn-primary btn-block" style="margin-top:14px;" onclick="discoverNext()">${isLast ? 'Los geht’s! →' : 'Nächstes Beispiel →'}</button>
    </div>
  </main>`;
}

function screenGoal(){
  const d = anyDomain(state.pendingDomain);
  const level = state.levels[d.id]||1;
  const goal = state.pendingReview ? REVIEW_TEXT : ((levelGoals[d.id]||{})[level] || '');
  return `

window.speakGoal = function(){
  const d = anyDomain(state.pendingDomain);
  if(!d) return;
  if(state.pendingReview){ speak(REVIEW_TEXT); return; }
  const level = state.levels[d.id]||1;
  const goal = (levelGoals[d.id]||{})[level] || '';
  speak(goal);
};

// Abwechslungsreiche Rückmeldungen statt immer derselben Formulierung.
const CORRECT_PHRASES = ['Richtig! Weiter so!', 'Super!', 'Toll gemacht!', 'Spitze!', 'Du bist richtig gut!', 'Klasse!', 'Genau richtig!', 'Prima, das stimmt!'];
function randomCorrectPhrase(){
  return CORRECT_PHRASES[Math.floor(Math.random()*CORRECT_PHRASES.length)];
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

// Antwortoptionen jedes Mal neu mischen, statt immer in derselben
// Reihenfolge zu zeigen - sonst lernen Kinder "die richtige Antwort ist
// immer links", statt die Aufgabe wirklich zu lösen.
function shuffleOptions(item){
  if(!item || !item.options || item.options.length < 2) return item;
  const idx = item.options.map((_,i)=>i);
  const order = shuffle(idx);
  const newOptions = order.map(i=>item.options[i]);
  const newAnswer = order.indexOf(item.answer);
  return {...item, options:newOptions, answer:newAnswer};
}

function pickPracticeItem0(){
  const p = state.practice;
  if(!p.queue || p.queue.length === 0){
    const pool = content[p.domainId][(p.easy && !p.isReview && !p.isWordReview) ? Math.max(1,p.level-1) : p.level];
    let shuffled = shuffle(pool);
    if(pool.some(i=>i.seq)){
      // Gruppen (seq) abwechselnd in Zweierrunden: 2 aus Gruppe 1, 2 aus Gruppe 2, ...
      const g = {}; shuffled.forEach(i=>{ (g[i.seq||0] = g[i.seq||0] || []).push(i); });
      const keys = Object.keys(g).map(Number).sort((x,y)=>x-y), out = [];
      while(keys.some(k=>g[k].length)){
        keys.forEach(k=>{ for(let n=0;n<2&&g[k].length;n++) out.push(g[k].shift()); });
      }
      shuffled = out;
    }
    if(p.current && shuffled[0]===p.current && shuffled.length>1){
      [shuffled[0], shuffled[1]] = [shuffled[1], shuffled[0]];
    }
    p.queue = shuffled;
  }
  p.current = shuffleOptions(p.queue.shift());
  p.shownAt = Date.now();
  p.answered=false;
  p.message=null;
  if(p.current && p.current.type==='flash'){
    startFlashCountdown();
  } else {
    clearFlashInterval();
  }
  if(p.current && ['dictate','papier','satzbau'].indexOf(p.current.type)<0) p.paperAck = false;
  if(p.current && p.current.type==='dictate'){
    p.dictatePhase = 'listen';
    p.markedWords = p.current.sentence.split(' ').map(()=>false);
  }
  if(p.current && p.current.type==='satzbau'){
    p.sbStep = 'build';
    p.sbSelections = [];
    p.sbBasketIndex = 0;
    p.sbWordIndex = 0;
    p.sbMarked = [];
  }
  if(p.current && p.current.type==='papier'){
    p.papierPhase = 'write';
    p.papierMarks = p.current.word.replace(/\|/g,'').split('').map(()=>false);
  }
  if(p.current && p.current.type==='kreuzseite'){
    p.current = {...p.current, rows: buildKreuzseiteRows(p.current.pool, p.current.size)};
    p.ksAnswers = {}; p.ksResults = null;
  }
  if(p.current && p.current.type==='match'){
    p.matchSel = null; p.matchDone = []; p.matchWrong = 0; p.matchFlash = null; p.matchNeedPic = false;
    p.matchOrder = shuffle(p.current.pairs.map((_,i)=>i));
  }
  if(p.current && p.current.type==='malen'){
    p.malColor = null; p.malFill = {}; p.malHint = false;
  }
  if(p.current && p.current.type==='wordstudy'){
    p.wsPhase = 'study';
    p.wsShowPicture = false;
    p.wsTokens = [];
  }
}

// Spielt einen Laut ab (echte Aufnahme, sonst TTS-Rückfall auf das ganze
// Wort) und ruft danach onDone auf - damit sich mehrere Laute nacheinander
// automatisch abspielen lassen ("Laut für Laut").
function playTokenSequenced(key, wholeWord, onDone){
  if(!key){ speakSequenced(wholeWord, onDone); return; }
  playAudioKey(key, (ok)=>{
    if(ok){ if(onDone) onDone(); }
    else { speakSequenced(wholeWord, onDone); }
  });
}
function speakSequenced(text, onDone){
  if(ttsSpeak(stripSyllableHyphens(text), true, onDone)) return;
  if(!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined'){
    warnNoTts(); if(onDone) onDone(); return;
  }
  try{
    const u = new SpeechSynthesisUtterance(stripSyllableHyphens(text));
    u.lang='de-DE'; u.rate=0.75;
    const deVoices = cachedVoices.filter(v=>v.lang && v.lang.toLowerCase().startsWith('de'));
    const enhancedVoice = deVoices.find(v=>/enhanced|premium|neural/i.test(v.name||''));
    if(enhancedVoice) u.voice = enhancedVoice;
    let done = false;
    const finish = ()=>{ if(!done){ done=true; if(onDone) onDone(); } };
    u.onend = finish; u.onerror = finish;
    window.speechSynthesis.speak(u);
    setTimeout(finish, 4000); // Sicherheitsnetz, falls onend nie feuert
  }catch(e){ if(onDone) onDone(); }
}

// Spielt bei einem neuen Wort automatisch jeden Laut nacheinander ab und
// liest danach das ganze Wort einmal am Stück vor.
function autoPlayWordSounds(){
  const p = state.practice;
  const tokens = p.sbTokens || [];
  const wholeWord = sentenceWords()[p.sbWordIndex] || '';
  let i = 0;
  function playNext(){
    if(i >= tokens.length){ speak(wholeWord); return; }
    const tok = tokens[i]; i++;
    playTokenSequenced(tok.key, wholeWord, playNext);
  }
  playNext();
}

// Ortsgenaues Feedback statt nur "falsch": zeigt, WO der Fehler liegt
// (zu kurz/zu lang/ab welcher Stelle), ohne die Lösung zu verraten.
// Substep-Feedback wirkt laut VanLehn (2011) deutlich stärker als reines
// Richtig/Falsch-Feedback.
function diffHint(given, correct){
  const g = (given||'').trim().toLowerCase();
  const c = (correct||'').trim().toLowerCase();
  if(g.length === 0) return 'Da steht noch nichts – trau dich, etwas einzutippen!';
  if(g.length < c.length) return 'Dein Wort hat noch zu wenige Buchstaben.';
  if(g.length > c.length) return 'Dein Wort hat zu viele Buchstaben.';
  for(let i=0; i<g.length; i++){
    if(g[i] !== c[i]){
      if(i===0) return 'Schau dir noch mal den Anfang des Wortes an.';
      return `Die ersten ${i} Buchstaben stimmen schon – schau dir den Rest noch mal genau an.`;
    }
  }
  return '';
}

window.practiceAnswer = function(given){
  clearFlashInterval();
  const p = state.practice;
  const item = p.current;
  const correct = checkAnswer(item, given);
  p.answered = true;
  p.lastCorrect = correct;
  p.lastGiven = given;
  p.itemsDone++;
  p.levelUpMsg=null; p.levelDownMsg=null; p.cardMsg=null;
  p.correctPhrase = randomCorrectPhrase();
  // Raten erkennen: mehrere sehr schnelle Antworten bei Auswahlaufgaben mit mehreren Fehlern.
  // Solche Antworten werden nicht als Fehler gewertet (kein Abstieg, kein Eintrag im Förderplan).
  const rtMs = Date.now() - (p.shownAt || Date.now());
  const isQT = ['pic','choice','silbchoice'].indexOf(item.type)>=0 && given!=='__SKIP__';
  const quick = isQT && rtMs < QUICK_MS;
  p.recent = (p.recent||[]).concat([{q:quick, c:correct}]).slice(-4);
  const ratePattern = !p.easy && p.recent.length>=3 && p.recent.filter(x=>x.q).length>=3 && p.recent.filter(x=>!x.c).length>=2;
  const guessed = !correct && quick && ratePattern;
  if(ratePattern){ p.guessAlert = true; p.recent = []; }
  if(!correct && !guessed && !p.easy) p.sessionErrors = (p.sessionErrors||0) + 1;

  if(!guessed && !p.easy){
    p.attemptLog.push(correct);
    if(p.attemptLog.length > 12) p.attemptLog.shift();
  }
  // Strategiekarten (Werkzeugkiste): richtige Aufgaben je Strategie zählen
  if(!guessed && !p.easy && !p.isWordReview && item.strat && FRESCH[item.strat] && item.strat!=='kiste'){
    const f = fr(item.strat); f.n++; if(correct) f.ok++;
    if(!f.card && f.ok>=6 && f.ok/f.n>=0.65){ f.card = true; f.cardDate = todayStr(); p.cardMsg = '🧰 Neue Strategiekarte gesammelt: '+FRESCH[item.strat].name+'!'; }
  }

  if(p.isWordReview){
    // Wortspeicher-Wiederholung: eigene, einfache Logik statt Phonemstufen.
    if(item.storeKey){
      const entry = state.wordStore.find(w=>w.word.toLowerCase()===item.storeKey);
      if(entry){
        if(correct){
          entry.streak = (entry.streak||0) + 1;
          if(entry.streak >= 2){
            state.wordStore = state.wordStore.filter(w=>w!==entry);
          }
        } else {
          entry.streak = 0;
        }
      }
    }
  } else if(p.easy){
    // Erfolgsrunde mit leichteren Aufgaben: keine Wertung, keine Stufenänderung
  } else {
    if(correct){
      state.stars[p.domainId] = (state.stars[p.domainId]||0)+1;
    } else if(!guessed){
      state.errorCounts[p.domainId] = (state.errorCounts[p.domainId]||0)+1;
      try{ logError(p.domainId, p.level, errorEntryFor(item, given, p)); }catch(e){}
      if(item.errorCategory){
        state.errorProfile[item.errorCategory] = (state.errorProfile[item.errorCategory]||0) + 1;
      }
    }

    let levelChanged = false;
    // Aufstieg erst, wenn genug geübt wurde UND die Fehlerquote zuletzt
    // erkennbar niedrig ist – reines Raten reicht nicht mehr aus.
    if(p.level<4 && p.attemptLog.length>=8){
      const lastSix = p.attemptLog.slice(-6);
      const wait = nextLevelBlocked(p.domainId);
      if(lastSix.filter(x=>!x).length<=1 && wait.length){
        if(!p.waitShown){
          p.waitShown = true;
          p.levelUpMsg = '👍 Das kannst du schon richtig gut! Damit es hier weitergeht, übst du zuerst: ' + wait.map(x=>x.d.name+' (Stufe '+x.need+')').join(' und ') + '.';
        }
      } else if(lastSix.filter(x=>!x).length<=1){
        p.level++;
        p.attemptLog=[]; p.queue=[];
        levelChanged = true;
        p.levelUpMsg = '⬆️ Klasse gemacht – du gehst eine Stufe hoch! ' + (levelGoals[p.domainId]||{})[p.level];
        // Neue Stufe kann neue Entdecken-Paare haben (Werkzeugkiste/Speicherstadt) -
        // die sollen direkt beim Aufstieg gezeigt werden, nicht erst beim
        // nächsten Öffnen der Station von der Hafenkarte aus.
        const discoverKey = p.domainId + ':' + p.level;
        if(['grundwortschatz'].includes(p.domainId) && !state.discoverSeen[discoverKey]){
          p.pendingDiscoverLevel = p.level;
        }
      }
    }
    if(!levelChanged && p.level>1 && (!correct || (item.type==='kreuzseite' && p.ksResults && p.ksResults.includes(false)))){
      const lastFour = p.attemptLog.slice(-4);
      if(lastFour.filter(x=>!x).length>=3){
        p.level--;
        p.attemptLog=[]; p.queue=[];
        p.levelDownMsg = '⬇️ Wir gehen eine Stufe zurück und üben das erst noch etwas.';
        delete state.mastery[p.domainId]; // war ggf. gemeistert, ist es jetzt nicht mehr
      }
    }
    state.levels[p.domainId] = p.level;
    state.attemptLogs[p.domainId] = {level:p.level, log:p.attemptLog};

    // Erstmalig gemeistert? Dann in zwei Wochen zur Auffrischung wieder vorlegen.
    const dObj = domains.find(x=>x.id===p.domainId);
    if(dObj && domainStatus(dObj).status==='mastered' && !state.mastery[p.domainId]){
      state.mastery[p.domainId] = {nextReviewAt: addDays(todayStr(), 14)};
      state.trophies = state.trophies || {};
      state.trophies[p.domainId] = todayStr();
      p.levelUpMsg = (p.levelUpMsg ? p.levelUpMsg + ' ' : '') + '🏆 Pokal! Diese Station kannst du jetzt sicher.';
    }
  }

  {
    const ss = sessionEnsure(); sessionTick();
    if(!p.isWordReview && !p.easy){
      ss.blockItems.push({c:correct, rt:isQT?rtMs:null, g:guessed});
      ss.items++; if(correct) ss.ok = (ss.ok||0)+1; if(guessed) ss.guess++;
    }
  }
  if(item.type==='kreuzseite'){
    speak(ksSpeech(p));
  } else if(correct){
    speak(p.levelUpMsg ? (p.correctPhrase + ' ' + p.levelUpMsg) : p.correctPhrase);
  } else if(item.type==='papier'){
    speak('Gut, dass du genau verglichen hast! Schreibe das Wort noch einmal richtig auf dein Blatt. ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(item.type==='dictate'){
    speak('Okay, dieses Wort hast du noch nicht ganz richtig geschrieben. Das üben wir einfach noch mal.' + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(item.type==='satzbau'){
    speak('Okay, dein Satz war noch nicht ganz richtig geschrieben. Das üben wir einfach noch mal.' + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(given==='__SKIP__'){
    speak('Kein Problem, das lernst du noch! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else if(item.type==='input'){
    const hint = diffHint(given, item.answer);
    speak('Das war leider noch nicht richtig. ' + hint + ' Versuche es noch einmal, das schaffst du! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  } else {
    speak('Das war leider noch nicht richtig. Versuche es noch einmal, das schaffst du! ' + item.tip + (p.levelDownMsg ? ' ' + p.levelDownMsg : ''));
  }

  saveProgress();
  render(true); // true = laufende Sprachausgabe der Rückmeldung NICHT abbrechen (siehe render())
};

window.nextPracticeItem = function(){
  const p = state.practice;
  state.levels[p.domainId] = p.level;
  if(p.pendingDiscoverLevel){
    const level = p.pendingDiscoverLevel;
    p.pendingDiscoverLevel = null;
    const discoverKey = p.domainId + ':' + level;
    if(!state.discoverSeen[discoverKey] && discoveryPairsFor(p.domainId, level).length){
      state.pendingDomain = p.domainId;
      state.discoverIndex = 0;
      state.discoverResumePractice = true;
      state.screen = 'discover';
      render();
      speakDiscoverPair();
      return;
    }
  }
  sessionEnsure(); sessionTick();
  maybeEasy(p);
  const target = p.sessionTarget || 6;
  if(p.itemsDone >= target){
    if(p.final && state.session) state.session.ended = true;
    if(p.isWordReview){
      saveProgress();
      state.screen = 'map';
      render();
      return;
    }
    if(p.isReview){
      const today = todayStr();
      if(p.level>=3){
        state.mastery[p.domainId] = { nextReviewAt: addDays(today, (p.sessionErrors||0)<=1 ? 14 : 3) };
      } else {
        delete state.mastery[p.domainId]; // während der Auffrischung zurückgestuft
      }
      saveProgress();
    }
    state.pendingSelfCheck = {domainId:p.domainId, level:p.level, errors:p.sessionErrors||0, items:p.itemsDone};
    state.screen='selfcheck';
    render();
    speakSelfCheck();
    return;
  }
  pickPracticeItem();
  const g1 = sessionGate();
  if(g1){
    if(g1==='pause'){ const wasEasy = p.easy; maybeEasy(p); if(p.easy && !wasEasy) pickPracticeItem(); }
    enterGate(g1, 'practice'); return;
  }
  render();
};

window.startLetterDrill = function(){
  const all = drillPool();
  const nikoWords = shuffle(all.filter(i=>i.niko));
  const otherWords = shuffle(all.filter(i=>!i.niko));
  const pool = [...nikoWords, ...otherWords];
  state.drill = {
    queue: pool, current:null, answered:false, lastGiven:null, lastCorrect:null,
    initialCount: pool.length, doneCount:0, wrongAttempts:{}, flagged:[],
  };
  pickDrillItem();
  state.screen = 'letterdrill';
  render();
};

function pickDrillItem(){
  const d = state.drill;
  if(d.queue.length === 0){
    state.needsBasicLetterDrill = false;
    saveProgress();
    state.screen = 'drilldone';
    return;
  }
  d.current = shuffleOptions(d.queue.shift());
  d.answered = false;
  d.lastGiven = null;
}

window.drillAnswer = function(given){
  const d = state.drill;
  const item = d.current;
  const correct = checkAnswer(item, given);
  d.answered = true; d.lastGiven = given; d.lastCorrect = correct;
  const letter = item.options[item.answer];
  // Erst die echte Aufnahme des isolierten Lauts (z.B. "M.m4a"), danach das
  // ganze Wort - wartet auf das tatsächliche Ende der Aufnahme.
  const audioKey = item.audioKey || letter.toUpperCase();
  playLetterSoundThenWord(audioKey, item.speak);
  if(correct){
    d.doneCount++;
  } else {
    const key = item.speak;
    d.wrongAttempts[key] = (d.wrongAttempts[key]||0) + 1;
    if(d.wrongAttempts[key] < 4){
      d.queue.push(item); // nochmal hinten anstellen, bis es sitzt
    } else {
      d.flagged.push(letter + ' (' + item.speak + ')');
    }
  }
  render(true); // true = laufende Laut-Wiedergabe NICHT abbrechen (siehe render())
};

  render();
  if(state.screen==='drilldone') speakDrillDone();

/* ---------- Lehrkraft-Ansicht ---------- */
// Kleines SVG-Balkendiagramm für den Stufenverlauf - bewusst minimalistisch,
// keine Bibliothek nötig.
function historyBarChart(levels, color){
  const w = 150, h = 36;
  const barW = Math.max(5, Math.floor(w/levels.length) - 3);
  const bars = levels.map((lvl,i)=>{
    const val = lvl || 0;
    const barH = Math.max(2, (val/3)*h);
    const x = i*(barW+3);
    const y = h-barH;
    return `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color||'#1B6E7F'}" rx="1.5"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" style="display:block;">${bars}</svg>`;
}

function renderReadProfileSection(){
  const entries = Object.keys(READ_ERROR_LABELS)
    .map(k => ({name: READ_ERROR_LABELS[k], count: state.errorProfile[k]||0}))
    .filter(e => e.count > 0).sort((a,b)=>b.count-a.count);
  if(entries.length===0) return '';
  const maxCount = Math.max(...entries.map(e=>e.count));
  const rows = entries.map(e => `<tr>
      <td style="font-size:0.85rem;">${e.name}</td>
      <td><svg viewBox="0 0 140 16" width="140" height="16"><rect x="0" y="2" width="${Math.round((e.count/maxCount)*140)}" height="12" fill="#B5527A" rx="3"/></svg></td>
      <td style="font-size:0.85rem;text-align:center;">${e.count}</td></tr>`).join('');
  return `
    <h3 style="font-size:1rem;margin-top:18px;">Leseprofil (Lesekai)</h3>
    <p style="font-size:0.8rem;color:#6B7F8C;margin-top:2px;">Zeigt, wo beim genauen Lesen Fehler passieren (Wortanfang, Wortmitte, Wortende, Satz, Anweisung).</p>
    <table class="teacher-panel"><tr><th>Art des Lesefehlers</th><th>Häufigkeit</th><th>Anzahl</th></tr>${rows}</table>`;
}

  const entries = Object.keys(ERROR_CATEGORIES)

    .filter(e => e.count > 0)
